<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C5247">
<title>Kenosis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ground:#F7F5F0;--ink:#17201D;--ink2:#5A615C;--line:#E2DDD3;--line2:#EFEAE1;--btnline:#C9BEB0;--green:#1C5247;--greenbg:#E4EFEA;--greenink:#17443B;--rust:#9E3A1C;--rustbg:#FDF1EC;--rustline:#F0D4C7;--rustink:#6B4231;--plumbg:#EFE7F3;--plum:#4A2F58;--amberbg:#FBF0DC;--amberline:#EBD9B4;--amber:#5C3B06}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--green)}
button{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;gap:10px;padding:20px 18px 12px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.top .sub{font-size:13px;color:var(--ink2);margin-top:4px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:0}
.icon-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.pad{padding:0 18px;display:flex;flex-direction:column;gap:8px}
.sec{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.sec h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.sec.rust h2{color:var(--rust)}
.sec.amber h2{color:#7A4E09}
.badge{font-size:11px;font-weight:700;border-radius:9px;padding:2px 7px;background:var(--ink);color:#fff}
.badge.rust{background:var(--rust)}
.badge.amber{background:#7A4E09}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;min-height:60px;text-decoration:none;color:inherit}
.row-rust{background:var(--rustbg);border-color:var(--rustline)}
.row-amber{background:var(--amberbg);border-color:var(--amberline)}
.row-done{opacity:.75}
.row-main{flex:1;min-width:0;text-decoration:none;color:inherit;display:block}
.row-title{display:block;font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.row-meta{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.row-rust .row-meta{color:var(--rustink)}
.row-amber .row-meta{color:var(--amber)}
.row-when{font-size:12px;font-weight:600;color:var(--ink2);flex:none;text-align:right;max-width:40%}
.t-rust{color:var(--rust)!important;font-weight:700!important}
.check{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid var(--btnline);background:#fff;color:var(--green);display:inline-flex;align-items:center;justify-content:center}
.avatar{width:40px;height:40px;flex:none;border-radius:20px;background:var(--plumbg);color:var(--plum);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.dicon{width:36px;height:36px;flex:none;border-radius:9px;background:var(--greenbg);color:var(--greenink);display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{width:118px;flex:none;color:var(--ink2);font-size:13px}
.kv .v{flex:1;font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;background:var(--greenbg);color:var(--greenink)}
.tag.plum{background:var(--plumbg);color:var(--plum)}
.tag.rust{background:var(--rust);color:#fff}
.tag.grey{background:#EFEAE1;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 18px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid var(--btnline);background:#fff;color:var(--ink);width:100%;text-align:center;line-height:1.2}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{color:var(--rust);border-color:var(--rustline);background:#fff}
.btn-sm{min-height:46px;font-size:14px}
.two{display:flex;gap:8px}
.two>*{flex:1;width:auto}
.two .sq{flex:none;width:52px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;display:inline-flex}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.field>label,.field>.lab{font-size:14px;font-weight:700;color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);line-height:1.45}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--btnline);border-radius:10px;background:#fff;color:var(--ink);width:100%;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
.inline{display:flex;gap:8px;align-items:center}
.inline>*{flex:1}
.inline .lbl{flex:none;font-size:14px;font-weight:600}
.seg{display:flex;gap:6px}
.seg a{flex:1;text-align:center;font-size:13px;font-weight:600;padding:11px 0;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
.seg a.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;min-height:110px}
.tile b{font-size:15px}
.tile small{font-size:12px;color:var(--ink2);line-height:1.35}
.tile.rust{background:var(--rustbg);border-color:var(--rustline)}
.tile.rust small{color:var(--rustink);font-weight:700}
.banner{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.45;border:1px solid}
.banner svg{flex:none;margin-top:1px}
.banner.amber{background:var(--amberbg);border-color:var(--amberline);color:var(--amber)}
.banner.rust{background:var(--rustbg);border-color:var(--rustline);color:var(--rustink)}
.banner.green{background:var(--greenbg);border-color:#C5DDD3;color:var(--greenink)}
.banner a{color:inherit;font-weight:700}
.mx{margin:0 18px 8px}
.empty{font-size:14px;color:var(--ink2);margin:2px 2px 4px}
.err{color:var(--rust);font-size:13px;font-weight:700;margin:0}
.err:empty{display:none}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.docimg{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;display:block}
.filebtns{display:flex;gap:8px}
.filebtns label{position:relative;overflow:hidden;flex:1}
.filebtns input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.hidden{display:none!important}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{margin:0 0 4px;font-size:15px}
.muted{color:var(--ink2)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.bottom .in{display:flex;width:100%;max-width:560px}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:11px;font-weight:600;min-height:48px}
nav.bottom a.on{color:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;width:max-content;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;text-align:center}
#toast.show{opacity:1}
.lockwrap{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>
<script>
'use strict';

/* =========================================================== costanti */

const VERSIONE = '0.1 (prova)';
const UTENTI = ['Rita', 'Michele', 'Vincenzo'];
const RESPONSABILI = ['Rita', 'Michele', 'Entrambi'];
const CATEGORIE = ['Bollette e utenze', 'Servizi', 'Farmaci', 'Personale', 'Assicurazioni',
  'Quote e adesioni', 'Autorizzazioni e certificati', 'Ospiti', 'Altro'];
const SERVIZI = [
  { k: 'Lavanderia', i: 'shirt' }, { k: 'Spesa', i: 'cart' },
  { k: 'Pulizie', i: 'spark' }, { k: 'Rifiuti', i: 'trash' },
  { k: 'Manutenzioni', i: 'tool' }, { k: 'Trasporti', i: 'car' },
  { k: 'Bollette', i: 'bolt' }, { k: 'Farmacia', i: 'pill' }
];
const TIPI_DOC = ['Referto', 'Prescrizione', 'Bolletta', 'Ricevuta', 'Contratto',
  "Documento d'identità", 'Esenzione o invalidità', 'Altro'];
const UNITA_FARMACO = ['compresse', 'capsule', 'bustine', 'gocce', 'ml', 'fiale', 'cerotti', 'dosi'];
const RICORRENZE = [
  ['', 'Una volta sola'], ['1-settimane', 'Ogni settimana'], ['1-mesi', 'Ogni mese'],
  ['2-mesi', 'Ogni 2 mesi'], ['3-mesi', 'Ogni 3 mesi'], ['6-mesi', 'Ogni 6 mesi'],
  ['1-anni', 'Ogni anno'], ['altro', 'Altro…']
];
const AVVISI = [[0, 'Il giorno stesso'], [1, '1 giorno prima'], [3, '3 giorni prima'],
  [7, '1 settimana prima'], [30, '1 mese prima']];

/* ============================================================== icone */

const ICONS = {
  home: '<path d="M4 11l8-6.5 8 6.5v8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 19z"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8.5 3.5v3M15.5 3.5v3"/>',
  user: '<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/>',
  folder: '<path d="M3.5 7.5A2 2 0 015.5 5.5h4l2 2.5h7a2 2 0 012 2v8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/>',
  check: '<path d="M4 12.5l5 5L20 6.5"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  edit: '<path d="M16.5 4.5l3 3L9 18l-4 1 1-4z"/>',
  camera: '<path d="M3 8.5A2.5 2.5 0 015.5 6h1.2l1.1-2h6.4l1.1 2h1.2A2.5 2.5 0 0120 8.5v8A2.5 2.5 0 0117.5 19h-11A2.5 2.5 0 014 16.5z"/><circle cx="12" cy="12.5" r="3.2"/>',
  gear: '<path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 002.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 001 2.5c1.8.5 1.8 3 0 3.5a1.7 1.7 0 00-1 2.5c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 00-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 00-2.5-1c-1.6.9-3.3-.9-2.5-2.4a1.7 1.7 0 00-1-2.5c-1.8-.5-1.8-3 0-3.5a1.7 1.7 0 001-2.5C4.9 6.2 6.7 4.5 8.3 5.4a1.7 1.7 0 002-1.1z"/><circle cx="12" cy="12" r="3"/>',
  pill: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M8 8V5.5h8V8M9 14h6"/>',
  shirt: '<path d="M8 4L4 7l2 4 2-1v10h8V10l2 1 2-4-4-3c-.5 1.5-2 2.5-4 2.5S8.5 5.5 8 4z"/>',
  cart: '<path d="M3 4h2l2.2 10.5h10.3L20 7H6.3"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
  spark: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  tool: '<path d="M14.5 5.5a4 4 0 00-5 5L4 16l4 4 5.5-5.5a4 4 0 005-5l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  car: '<path d="M5 16v-5l2-5h10l2 5v5M3.5 16h17v2.5h-17zM7 11h10"/>',
  bolt: '<path d="M13 3.5L5.5 13.5h5l-1 7 8-10.5h-5z"/>',
  doc: '<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/>'
};
function ic(name, size = 20, sw = 2) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + sw +
    '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

/* ======================================================== utilità */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function adesso() { return new Date().toISOString(); }
const pad = n => String(n).padStart(2, '0');
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function aData(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function dataValida(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(aData(s)); }
function oggi() { return iso(new Date()); }
function piuGiorni(s, n) { const d = aData(s); d.setDate(d.getDate() + n); return iso(d); }
function piuMesi(s, n) {
  const d = aData(s); const giorno = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(giorno, ultimo)); return iso(d);
}
function giorniTra(a, b) { return Math.round((aData(b) - aData(a)) / 86400000); }
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const MESI_L = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const GIORNI_L = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
function fmt(s) {
  if (!s) return '—';
  const n = giorniTra(oggi(), s);
  if (n === 0) return 'oggi';
  if (n === 1) return 'domani';
  if (n === -1) return 'ieri';
  const d = aData(s);
  return d.getDate() + ' ' + MESI[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtLungo(s) { const d = aData(s); return GIORNI_L[d.getDay()] + ' ' + d.getDate() + ' ' + MESI_L[d.getMonth()] + ' ' + d.getFullYear(); }
function euro(n) { return n == null ? '' : n.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' }); }
function iniziali(nome) { return String(nome || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join(''); }
function plur(n, uno, tanti) { return n + ' ' + (n === 1 ? uno : tanti); }

function prossimaData(s, ric) {
  if (!ric) return null;
  const n = Math.max(1, parseInt(ric.ogni, 10) || 1);
  switch (ric.unita) {
    case 'giorni': return piuGiorni(s, n);
    case 'settimane': return piuGiorni(s, 7 * n);
    case 'mesi': return piuMesi(s, n);
    case 'anni': return piuMesi(s, 12 * n);
  }
  return null;
}
function descRic(ric) {
  if (!ric) return 'Una volta sola';
  const nomi = { giorni: ['giorno', 'giorni'], settimane: ['settimana', 'settimane'], mesi: ['mese', 'mesi'], anni: ['anno', 'anni'] }[ric.unita] || ['volta', 'volte'];
  return ric.ogni === 1 ? 'Ogni ' + nomi[0] : 'Ogni ' + ric.ogni + ' ' + nomi[1];
}
function descAvviso(n) {
  const t = AVVISI.find(a => a[0] === n);
  return t ? t[1] : n + ' giorni prima';
}

/* ================================================== archivio locale */

const STORES = ['voci', 'eventi', 'ospiti', 'documenti', 'farmaci', 'kv'];
let idb = null;
const memoria = {};
STORES.forEach(s => { memoria[s] = new Map(); });

function apriDB() {
  return new Promise(resolve => {
    try {
      if (!('indexedDB' in window)) return resolve(false);
      const r = indexedDB.open('kenosis', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      };
      r.onsuccess = () => { idb = r.result; resolve(true); };
      r.onerror = () => resolve(false);
      r.onblocked = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}
function transazione(store, modo, fn) {
  return new Promise((resolve, reject) => {
    const t = idb.transaction(store, modo);
    const req = fn(t.objectStore(store));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const DB = {
  all(s) { return idb ? transazione(s, 'readonly', os => os.getAll()) : Promise.resolve([...memoria[s].values()]); },
  put(s, o) { if (!idb) { memoria[s].set(o.id, o); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.put(o)); },
  del(s, id) { if (!idb) { memoria[s].delete(id); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.delete(id)); },
  clear(s) { if (!idb) { memoria[s].clear(); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.clear()); }
};

const S = { voci: [], eventi: [], ospiti: [], documenti: [], farmaci: [], kv: {} };
let persistente = false;
let bloccato = false;

async function carica() {
  for (const s of ['voci', 'eventi', 'ospiti', 'documenti', 'farmaci']) S[s] = await DB.all(s);
  S.kv = {};
  (await DB.all('kv')).forEach(x => { S.kv[x.id] = x.v; });
}
async function salva(store, obj) {
  obj.agg = adesso();
  obj.da = obj.da || utente();
  await DB.put(store, obj);
  const i = S[store].findIndex(x => x.id === obj.id);
  if (i >= 0) S[store][i] = obj; else S[store].push(obj);
}
async function togli(store, id) {
  await DB.del(store, id);
  S[store] = S[store].filter(x => x.id !== id);
}
async function setKV(k, v) { S.kv[k] = v; await DB.put('kv', { id: k, v }); }

const utente = () => S.kv.utente || '';
const voce = id => S.voci.find(v => v.id === id);

/* ================================================= logica scadenze */

function stato(v) {
  const n = giorniTra(oggi(), v.prossima);
  if (n < 0) return 'ritardo';
  if (n === 0) return 'oggi';
  if (n <= 7) return 'settimana';
  if (n <= 31) return 'mese';
  return 'avanti';
}
function attive() { return S.voci.filter(v => v.attiva !== false); }

function stimaFarmaco(f) {
  const passati = Math.max(0, giorniTra(f.contatoIl || oggi(), oggi()));
  const alGiorno = Number(f.alGiorno) || 0;
  const rimaste = Math.max(0, (Number(f.inCasa) || 0) - passati * alGiorno);
  const giorni = alGiorno > 0 ? Math.floor(rimaste / alGiorno) : null;
  let scad = null;
  if (f.scadenza) {
    const n = giorniTra(oggi(), f.scadenza);
    scad = n < 0 ? 'scaduto' : n <= 30 ? '30' : n <= 60 ? '60' : null;
  }
  const soglia = f.soglia == null ? 10 : Number(f.soglia);
  return { rimaste: Math.round(rimaste * 10) / 10, giorni, scad, daRiordinare: giorni !== null && giorni <= soglia };
}

function riepilogo() {
  const t = oggi();
  const att = attive().sort(perData);
  const ritardo = att.filter(v => v.prossima < t);
  const diOggi = att.filter(v => v.prossima === t);
  const inArrivo = att.filter(v => { const n = giorniTra(t, v.prossima); return n > 0 && n <= Math.max(v.avviso || 0, 1); });
  const settimana = att.filter(v => { const n = giorniTra(t, v.prossima); return n > 0 && n <= 7; });
  const farmaci = S.farmaci.map(f => ({ f, s: stimaFarmaco(f) })).filter(x => x.s.daRiordinare || x.s.scad);
  return { ritardo, diOggi, inArrivo, settimana, farmaci };
}

}
function sezione(titolo, n, cls = '') {
  return '<div class="sec ' + cls + '"><h2>' + esc(titolo) + '</h2>' + (n != null ? '<span class="badge ' + cls + '">' + n + '</span>' : '') + '</div>';
}
function barra(attiva) {

function bannerBackup() {
  if (!S.voci.length && !S.documenti.length) return '';

  return '<div class="banner rust mx">' + ic('info', 17) + '<div>' + testo + ' <a href="#/impostazioni">Falla adesso</a></div></div>';

function bannerMemoria() {
  return persistente ? '' : '<div class="banner rust mx">' + ic('info', 17) + '<div>Questo browser non permette di salvare i dati: quello che inserisci sparisce quando chiudi la pagina.</div></div>';

function rigaVoce(v, opz = {}) {
  const st = stato(v);
  const rit = st === 'ritardo' && v.attiva !== false;
  const o = ospite(v.ospiteId);
  const meta = [v.categoria, v.responsabile, o ? o.nome : null].filter(Boolean).join(' · ');
  let quando = fmt(v.prossima);
  if (v.attiva === false) quando = 'chiusa';
  else if (rit) quando = plur(-giorniTra(oggi(), v.prossima), 'giorno', 'giorni') + ' fa';
  const azione = v.chiusura === 'pagato' ? 'pagata' : 'fatta';
  const check = opz.check !== false && v.attiva !== false
    ? '<a class="check" href="#/segna?voce=' + v.id + '" aria-label="Segna come ' + azione + ': ' + esc(v.nome) + '">' + ic('check', 20, 2.4) + '</a>' : '';
  return '<div class="row ' + (rit ? 'row-rust' : '') + (v.attiva === false ? ' row-done' : '') + '">' +
    '<a class="row-main" href="#/voce/' + v.id + '"><span class="row-title">' + esc(v.nome) + '</span><span class="row-meta">' + esc(meta) + '</span></a>' +
    '<span class="row-when ' + (rit ? 't-rust' : '') + '">' + esc(quando) + '</span>' + check + '</div>';
}
function rigaFarmaco(f) {
  const s = stimaFarmaco(f);
  const o = ospite(f.ospiteId);
  const parti = [];
  if (s.giorni !== null) parti.push(s.giorni <= 0 ? 'scorta finita' : 'circa ' + plur(s.giorni, 'giorno', 'giorni') + ' di scorta');
  if (s.scad === 'scaduto') parti.push('confezione scaduta');
  else if (f.scadenza) parti.push('scade ' + fmt(f.scadenza));
  const urgente = s.scad === 'scaduto' || (s.daRiordinare && s.giorni !== null && s.giorni <= 3);
  const attenzione = s.daRiordinare || s.scad;
  return '<a class="row ' + (urgente ? 'row-rust' : attenzione ? 'row-amber' : '') + '" href="#/farmaco/' + f.id + '">' +
    '<span class="row-main"><span class="row-title">' + esc(f.nome) + (o ? ' — ' + esc(o.nome) : '') + '</span>' +
    '<span class="row-meta">' + esc(parti.join(' · ') || 'scorta non calcolata') + '</span></span>' + ic('chev', 18) + '</a>';
}
function rigaEvento(e) {
  const v = e.voceId ? voce(e.voceId) : null;
  const titolo = v ? v.nome : (e.nota && e.servizio === 'Farmacia' ? e.nota : e.servizio || 'Attività');
  const meta = (e.tipo === 'pagato' ? 'Pagato ' : 'Fatto ') + fmt(e.data) + (e.chi ? ' da ' + e.chi : '') + (e.importo != null ? ' · ' + euro(e.importo) : '');
  return '<div class="row"><span class="dicon">' + ic('check', 18, 2.4) + '</span><span class="row-main"><span class="row-title">' + esc(titolo) + '</span><span class="row-meta">' + esc(meta) + (e.nota && !(e.servizio === 'Farmacia' && !v) ? ' · ' + esc(e.nota) : '') + '</span></span></div>';
}
function rigaDoc(d) {
  const o = ospite(d.ospiteId);
  const meta = [d.tipo, o ? o.nome : (d.daSmistare ? 'da smistare' : null), fmt(d.data)].filter(Boolean).join(' · ');
  return '<a class="row" href="#/doc/' + d.id + '"><span class="dicon">' + ic(d.mime && d.mime.startsWith('image/') ? 'camera' : 'doc', 18) + '</span>' +

}

  const voci = attive().filter(v => v.servizio === k).sort(perData);
  const storico = S.eventi.filter(e => e.servizio === k || (e.voceId && (voce(e.voceId) || {}).servizio === k)).sort(eventiRecenti).slice(0, 10);
  let h = testata(k, { indietro: true }) + '<main class="pad">';

  h += sezione('Da ricordare') + (voci.length ? voci.map(v => rigaVoce(v)).join('') : '<p class="empty">Nessuna scadenza fissa per ' + esc(k.toLowerCase()) + '.</p>');
  h += '<a class="btn btn-sm" href="#/nuova-voce?servizio=' + encodeURIComponent(k) + '">' + ic('plus', 18) + ' Ricordamelo regolarmente</a>';

  h += sezione('Storico') + (storico.length ? storico.map(rigaEvento).join('') : '<p class="empty">Ancora niente.</p>');
  return h + '</main>' + barra('servizi');
}

  }
  if (!att.length) {
    h += '<p class="empty">Il registro è vuoto. Aggiungi la prima cosa da ricordare: una bolletta, la lavanderia, una polizza.</p><a class="btn btn-primary" href="#/nuova-voce">' + ic('plus') + ' Nuova voce</a>';
  } else if (vista === 'cat') {
    h += CATEGORIE.map(c => {

/* =========================================================== router */

function rotta() {
  const h = location.hash.slice(1) || '/oggi';
  const [percorso, query] = h.split('?');
  const parti = percorso.split('/').filter(Boolean);
  return { parti, q: new URLSearchParams(query || '') };
}
let ultimaRotta = '';
function render() {
  urlAperti.forEach(u => URL.revokeObjectURL(u));
  urlAperti = [];
  const app = document.getElementById('app');
  let html;
  if (bloccato) html = vBlocco();
  else if (!utente()) html = vBenvenuto();
  else {
    const { parti, q } = rotta();
    const id = parti[1] ? decodeURIComponent(parti[1]) : '';
    switch (parti[0]) {
      case 'servizi': html = vServizi(); break;
      case 'servizio': html = vServizio(id); break;
      case 'registro': html = vRegistro(q); break;
      case 'voce': html = vVoce(id); break;
      case 'nuova-voce': html = vFormVoce(q); break;
      case 'segna': html = vSegna(q); break;
      case 'ospiti': html = vOspiti(); break;
      case 'ospite': html = vOspite(id); break;
      case 'nuovo-ospite': html = vFormOspite(q); break;
      case 'farmaci': html = vFarmaci(); break;
      case 'farmaco': html = vFarmaco(id); break;
      case 'nuovo-farmaco': html = vFormFarmaco(q); break;
      case 'archivio': html = vArchivio(q); break;
      case 'doc': html = vDoc(id); break;
      case 'nuovo-doc': html = vFormDoc(q); break;
      case 'impostazioni': html = vImpostazioni(); break;
      default: html = vOggi();
    }
  }
  app.innerHTML = html;
  if (location.hash !== ultimaRotta) { window.scrollTo(0, 0); ultimaRotta = location.hash; }
}
function vai(hash, sostituisci) {
  if (sostituisci) { history.replaceState(null, '', hash); render(); }
  else if (location.hash === hash) render();
  else location.hash = hash;
}
let navigato = false;
function indietro() {
  if (navigato && history.length > 1) history.back();
  else vai('#/oggi', true);
}
window.addEventListener('hashchange', () => { navigato = true; render(); });

let toastTimer = null;
function avvisa(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function errore(id, msg) {
  const el = document.getElementById(id);
  if (el) el.textContent = msg;
  const campo = el && el.parentElement ? el.parentElement.querySelector('input,select,textarea') : null;
  if (campo) campo.focus();
}

/* ========================================================== file */

async function comprimi(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const lato = 2000;
    const scala = Math.min(1, lato / Math.max(bmp.width, bmp.height));
    if (scala === 1 && file.size < 1500000) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scala);
    c.height = Math.round(bmp.height * scala);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return b || file;
  } catch (e) { return file; }
}
function fileScelto(form) {
  const ins = form.querySelectorAll('input[type=file]');
  for (const i of ins) if (i.files && i.files[0]) return i.files[0];
  return null;
}
function blobInBase64(b) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(b);
  });
}
async function base64InBlob(dataUrl) {
  const [testa, corpo] = dataUrl.split(',');
  const mime = (testa.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(corpo);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

const moduli = {
  async benvenuto(form) {

    if (fd.get('dati') === 'esempio') await caricaEsempio();
    vai('#/oggi', true);
  },

  async sblocca(form) {
    const pin = String(new FormData(form).get('pin') || '');
    const ok = S.kv.pin && (await hashPin(pin, S.kv.pin.sale)) === S.kv.pin.hash;
    if (!ok) { errore('err-pin', 'PIN sbagliato.'); form.querySelector('input').value = ''; return; }
    bloccato = false;
    render();
  },

  async 'imposta-pin'(form) {
    const pin = String(new FormData(form).get('pin') || '');
    if (!/^\d{4,8}$/.test(pin)) { errore('err-nuovopin', 'Servono da 4 a 8 cifre.'); return; }
    const sale = uid();
    await setKV('pin', { sale, hash: await hashPin(pin, sale) });

  async voce(form) {
    const fd = new FormData(form);

    const prossima = String(fd.get('prossima') || '');
    if (!nome) { errore('err-nome', 'Scrivi cos\'è, anche in due parole.'); return; }
    if (!dataValida(prossima)) { errore('err-prossima', 'Scegli una data.'); return; }
    const ricK = String(fd.get('ric') || '');
    let ric = null;
    if (ricK === 'altro') ric = { ogni: Math.max(1, parseInt(fd.get('ric_n'), 10) || 1), unita: String(fd.get('ric_u') || 'settimane') };
    else if (ricK) { const [n, u] = ricK.split('-'); ric = { ogni: parseInt(n, 10), unita: u }; }
    const id = form.dataset.id || uid();
    const vecchia = form.dataset.id ? voce(form.dataset.id) : null;
    const v = Object.assign({}, vecchia || { creato: adesso(), attiva: true }, {
      id, nome, prossima, ric,
      categoria: String(fd.get('categoria') || 'Altro'),
      servizio: String(fd.get('servizio') || '') || null,
      ospiteId: String(fd.get('ospite') || '') || null,
      responsabile: String(fd.get('responsabile') || 'Entrambi'),
      avviso: parseInt(fd.get('avviso'), 10) || 0,
      chiusura: fd.get('chiusura') === 'pagato' ? 'pagato' : 'fatto',
      note: String(fd.get('note') || '').trim() || null
    });
    await salva('voci', v);
    dopoModifica();
    avvisa(vecchia ? 'Modifiche salvate' : 'Salvata: te la ricordo io');
    vai('#/voce/' + id, true);
  },

  async segna(form) {
    const fd = new FormData(form);
    const v = form.dataset.voce ? voce(form.dataset.voce) : null;
    const servizio = v ? v.servizio || null : form.dataset.servizio || null;
    const data = dataValida(fd.get('data')) ? String(fd.get('data')) : oggi();
    const pagato = fd.get('pagato') === 'on';
    let importo = parseFloat(String(fd.get('importo') || '').replace(/\./g, '').replace(',', '.'));
    if (isNaN(importo) || !pagato) importo = null;
    const cosa = String(fd.get('cosa') || '').trim();
    const nota = [cosa, String(fd.get('nota') || '').trim()].filter(Boolean).join(' — ') || null;
    const file = fileScelto(form);
    let docId = null;
    if (file) {
      const blob = await comprimi(file);
      const d = {
        id: uid(), nome: (pagato ? 'Ricevuta ' : 'Foto ') + (v ? v.nome : servizio || '') + ' ' + fmt(data),
        tipo: pagato ? 'Ricevuta' : 'Altro', ospiteId: v ? v.ospiteId || null : null, voceId: v ? v.id : null,
        data, mime: blob.type || file.type, dim: blob.size, blob, creato: adesso(), daSmistare: false
      };
      await salva('documenti', d);
      docId = d.id;
    }
    await salva('eventi', {
      id: uid(), voceId: v ? v.id : null, servizio, data, chi: String(fd.get('chi') || utente()),
      tipo: pagato ? 'pagato' : 'fatto', importo, nota, docId, creato: adesso()
    });
    let msg = pagato ? 'Segnata come pagata' : 'Segnata come fatta';
    if (v) {
      if (v.ric) { v.prossima = prossimaDopo(v, data); msg += ' · prossima ' + fmt(v.prossima); }
      else { v.attiva = false; v.chiusaIl = data; }
      await salva('voci', v);
    }
    dopoModifica();
    avvisa(msg);
    indietro();
  },

  async ospite(form) {
    const fd = new FormData(form);
    const nome = String(fd.get('nome') || '').trim();
    if (!nome) { errore('err-nome', 'Scrivi il nome.'); return; }
    const vecchio = form.dataset.id ? ospite(form.dataset.id) : null;
    const o = Object.assign({}, vecchio || { creato: adesso() }, {
      id: vecchio ? vecchio.id : uid(), nome,
      codice: String(fd.get('codice') || '').trim() || prossimoCodice(),
      note: String(fd.get('note') || '').trim() || null
    });
    await salva('ospiti', o);
    avvisa('Ospite salvato');
    vai('#/ospite/' + o.id, true);
  },

  async farmaco(form) {
    const fd = new FormData(form);
    const nome = String(fd.get('nome') || '').trim();
    const num = k => { const x = parseFloat(String(fd.get(k) || '').replace(',', '.')); return isNaN(x) ? null : x; };
    const inCasa = num('inCasa'), alGiorno = num('alGiorno');
    if (!nome) { errore('err-nome', 'Scrivi il nome del farmaco.'); return; }
    if (inCasa === null || inCasa < 0) { errore('err-incasa', 'Scrivi quante ce ne sono, anche 0.'); return; }
    if (alGiorno === null || alGiorno < 0) { errore('err-algiorno', 'Ricopialo dalla prescrizione. Se si usa solo al bisogno, scrivi 0.'); return; }
    const vecchio = form.dataset.id ? farmaco(form.dataset.id) : null;
    const scad = String(fd.get('scadenza') || '');
    const soglia = parseInt(fd.get('soglia'), 10);
    const f = Object.assign({}, vecchio || { creato: adesso() }, {
      id: vecchio ? vecchio.id : uid(), nome,
      ospiteId: String(fd.get('ospite') || '') || null,
      unita: String(fd.get('unita') || 'compresse'),
      inCasa, alGiorno, contatoIl: oggi(),
      scadenza: dataValida(scad) ? scad : null,
      soglia: isNaN(soglia) ? 10 : soglia
    });
    await salva('farmaci', f);
    dopoModifica();
    avvisa('Farmaco salvato');
    vai('#/farmaco/' + f.id, true);
  },

  async ritiro(form) {
    const f = farmaco(form.dataset.id);
    if (!f) return;
    const fd = new FormData(form);
    const n = parseFloat(String(fd.get('quante') || '').replace(',', '.'));
    if (isNaN(n) || n <= 0) { errore('err-quante', 'Scrivi quante ne hai portate.'); return; }
    const s = stimaFarmaco(f);
    f.inCasa = s.rimaste + n;
    f.contatoIl = oggi();
    const nuova = String(fd.get('scadenza') || '');
    if (dataValida(nuova)) {
      const vecchiaValida = f.scadenza && f.scadenza >= oggi() && s.rimaste > 0;
      f.scadenza = vecchiaValida && f.scadenza < nuova ? f.scadenza : nuova;
    }
    await salva('farmaci', f);
    const o = ospite(f.ospiteId);
    await salva('eventi', { id: uid(), voceId: null, servizio: 'Farmacia', data: oggi(), chi: utente(), tipo: 'fatto', importo: null,
      nota: 'Ritirato ' + n + ' ' + f.unita + ' di ' + f.nome + (o ? ' per ' + o.nome : ''), docId: null, creato: adesso() });
    dopoModifica();
    avvisa('Scorta aggiornata');
    render();
  },

  async conta(form) {
    const f = farmaco(form.dataset.id);
    if (!f) return;
    const n = parseFloat(String(new FormData(form).get('quante') || '').replace(',', '.'));
    if (isNaN(n) || n < 0) { errore('err-contate', 'Scrivi quante ce ne sono, anche 0.'); return; }
    f.inCasa = n;
    f.contatoIl = oggi();
    await salva('farmaci', f);
    dopoModifica();
    avvisa('Scorta aggiornata');
    render();
  },

  async doc(form) {
    const fd = new FormData(form);
    const file = fileScelto(form);
    if (!file) { document.getElementById('err-file').textContent = 'Fotografa o scegli un file.'; return; }
    const pulsante = form.querySelector('button[type=submit]');

    pulsante.textContent = 'Salvataggio…';

      id: uid(), nome, tipo: String(fd.get('tipo') || 'Altro'), ospiteId, voceId,
      data: dataValida(fd.get('data')) ? String(fd.get('data')) : oggi(),
      mime: blob.type || file.type || 'application/octet-stream', dim: blob.size, blob,

    d.daSmistare = !d.ospiteId && !d.voceId;
    await salva('documenti', d);
    avvisa('Documento aggiornato');
    render();
  }
};

  async 'elimina-doc'(el) {
    const d = documento(el.dataset.id);
    if (!d || !confirm('Eliminare il documento "' + d.nome + '" da questo telefono?')) return;
    await togli('documenti', d.id);
    avvisa('Documento eliminato');
    vai('#/archivio', true);
  },

  async 'togli-pin'() {
    if (!confirm('Togliere il PIN? Chiunque prenda il telefono sbloccato potrà aprire l\'app.')) return;
    await DB.del('kv', 'pin');
    delete S.kv.pin;
    avvisa('PIN tolto');
    render();
  },

  async 'attiva-notifiche'() {
    if (!('Notification' in window)) { avvisa('Questo browser non supporta le notifiche'); return; }
    const p = await Notification.requestPermission();
    if (p === 'granted') { await registraAvvisiBackground(); avvisa('Notifiche attive'); }
    else avvisa('Notifiche non attivate');
    render();
  },

  async 'prova-notifica'() {
    if (!('Notification' in window) || Notification.permission !== 'granted') { avvisa('Prima attiva le notifiche'); return; }
    await mostraNotifica('Kenosis', 'Le notifiche funzionano su questo telefono.');
  },

  async esporta() { await esportaCopia(); },

  async 'carica-esempio'() {
    if ((S.voci.length || S.ospiti.length) && !confirm('Aggiungo i dati di esempio a quelli che ci sono già?')) return;
    await caricaEsempio();
    avvisa('Dati di esempio caricati');
    vai('#/oggi');
  },

  async 'cancella-tutto'() {
    if (!confirm('Cancellare TUTTI i dati da questo telefono? Se non hai una copia di sicurezza, non si possono recuperare.')) return;
    if (!confirm('Sei sicuro? Questa operazione non si può annullare.')) return;
    for (const s of STORES) await DB.clear(s);
    await carica();
    bloccato = false;
    vai('#/oggi', true);
  }
};

/* ============================================== copia di sicurezza */

async function esportaCopia() {
  avvisa('Preparo la copia…');
  const documenti = [];
  for (const d of S.documenti) {
    const copia = Object.assign({}, d);
    delete copia.blob;
    copia.b64 = d.blob ? await blobInBase64(d.blob) : null;
    documenti.push(copia);
  }
  const contenuto = { app: 'kenosis', formato: 1, creato: adesso(), da: utente(), voci: S.voci, eventi: S.eventi, ospiti: S.ospiti, farmaci: S.farmaci, documenti };
  const blob = new Blob([JSON.stringify(contenuto)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kenosis-copia-' + oggi() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  await setKV('ultimoBackup', oggi());
  avvisa('Copia salvata nei Download');
  render();
}

async function importaCopia(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { avvisa('Questo file non è una copia valida'); return; }
  if (!j || j.app !== 'kenosis') { avvisa('Questo file non è una copia di Kenosis'); return; }
  const quando = j.creato ? fmtLungo(j.creato.slice(0, 10)) : 'data sconosciuta';
  if (!confirm('Ripristinare la copia del ' + quando + '? I dati attuali su questo telefono verranno sostituiti.')) return;
  for (const s of ['voci', 'eventi', 'ospiti', 'farmaci', 'documenti']) await DB.clear(s);
  for (const s of ['voci', 'eventi', 'ospiti', 'farmaci']) for (const o of (j[s] || [])) await DB.put(s, o);
  for (const d of (j.documenti || [])) {
    const copia = Object.assign({}, d);
    const b64 = copia.b64;
    delete copia.b64;
    copia.blob = b64 ? await base64InBlob(b64) : null;
    await DB.put('documenti', copia);
  }
  await carica();
  dopoModifica();
  avvisa('Copia ripristinata');
  vai('#/oggi', true);
}

/* ========================================================== PIN */

async function hashPin(pin, sale) {
  const dati = new TextEncoder().encode(sale + ':' + pin);
  const h = await crypto.subtle.digest('SHA-256', dati);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
let nascostoDa = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { nascostoDa = Date.now(); return; }
  // Non ridisegnare al ritorno: chi torna dalla fotocamera perderebbe la foto appena scelta.
  if (S.kv.pin && nascostoDa && Date.now() - nascostoDa > 5 * 60 * 1000) { bloccato = true; render(); }
});

/* ========================================================== avvisi */

async function mostraNotifica(titolo, corpo) {
  const opz = { body: corpo, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'kenosis' };
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) await reg.showNotification(titolo, opz); else new Notification(titolo, opz);
  } catch (e) { avvisa('Notifica non riuscita su questo browser'); }
}
async function registraAvvisiBackground() {
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!('periodicSync' in reg)) return;
    const perm = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (perm.state !== 'granted') return;
    await reg.periodicSync.register('kenosis-avvisi', { minInterval: 12 * 60 * 60 * 1000 });
  } catch (e) { /* non supportato: pazienza */ }
}
// Nella versione APK (Capacitor) gli avvisi vengono programmati all'orario esatto.
async function programmaAvvisiNativi() {
  const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if (!LN) return;
  try {
    const pend = await LN.getPending();
    if (pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    const notifiche = [];
    let n = 1;
    for (const v of attive()) {
      const giorno = piuGiorni(v.prossima, -(v.avviso || 0));
      const at = aData(giorno); at.setHours(9, 0, 0, 0);
      if (at > new Date()) notifiche.push({ id: n++, title: v.nome, body: (v.avviso ? 'Scade ' + fmtLungo(v.prossima) : 'È per oggi') + (v.responsabile ? ' · ' + v.responsabile : ''), schedule: { at } });
    }
    if (notifiche.length) await LN.schedule({ notifications: notifiche.slice(0, 60) });
  } catch (e) { /* ignorato */ }
}
function dopoModifica() { programmaAvvisiNativi(); }

/* ============================================================ eventi */

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const f = azioni[el.dataset.action];
  if (f) { try { await f(el); } catch (err) { console.error(err); avvisa('Qualcosa non ha funzionato: riprova'); } }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  form.querySelectorAll('.err').forEach(x => { x.textContent = ''; });
  const f = moduli[form.dataset.form];
  if (f) { try { await f(form); } catch (err) { console.error(err); avvisa('Qualcosa non ha funzionato: riprova'); } }
});
document.addEventListener('input', e => {
  const err = e.target.closest('.field') && e.target.closest('.field').querySelector('.err');
  if (err) err.textContent = '';
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'ric') { const box = document.getElementById('ric-altro'); if (box) box.classList.toggle('hidden', t.value !== 'altro'); }
  if (t.name === 'pagato') { const box = document.getElementById('box-importo'); if (box) box.classList.toggle('hidden', !t.checked); }
  if (t.type === 'file' && t.name !== 'importa') {
    const form = t.closest('form');
    if (t.files[0]) form.querySelectorAll('input[type=file]').forEach(i => { if (i !== t) i.value = ''; });
    const lab = form.querySelector('[data-nomefile]');
    if (lab) lab.textContent = t.files[0] ? 'Scelto: ' + t.files[0].name : 'Nessun file scelto.';
    const nome = form.querySelector('input[name=nome]');
    if (nome && !nome.value && t.files[0]) nome.value = t.files[0].name.replace(/\.[^.]+$/, '').slice(0, 80);
    const err = document.getElementById('err-file');
    if (err) err.textContent = '';
  }
  if (t.name === 'importa' && t.files[0]) { await importaCopia(t.files[0]); t.value = ''; }
  if (t.name === 'utente-set') { await setKV('utente', t.value); avvisa('Ora questo telefono è di ' + t.value); }
});

/* ============================================================ avvio */

(async function avvio() {
  persistente = await apriDB();
  await carica();
  bloccato = !!S.kv.pin;
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { await navigator.serviceWorker.register('sw.js'); if (window.Notification && Notification.permission === 'granted') registraAvvisiBackground(); } catch (e) { /* anteprima senza service worker */ }
  }
  programmaAvvisiNativi();
})();
