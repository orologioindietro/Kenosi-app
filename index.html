<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kenosis">
<title>Kenosis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- tema: tutti i colori sono qui, per cambiarli basta questo blocco ---------- */
:root{
  --ground:#F5F1EA; --card:#FFFFFF; --ink:#1F2523; --ink2:#5E655F; --line:#E4DED3; --line2:#EEE9E0; --btnline:#CEC5B6;
  --green:#245A52; --greenbg:#E2EEEA; --greenink:#1B463F; --greenline:#C3DCD4;
  --rust:#AE4524; --rustbg:#FCEFE9; --rustline:#F1D2C4; --rustink:#7A3A22;
  --amber:#6B4708; --amberbg:#FBF1DE; --amberline:#ECDAB3;
  --plum:#5A3A6B; --plumbg:#F0E8F4;
  --effie:#D07A50; --effie2:#F3CFB1; --acqua:#5DA9CF;
  --col:600px; --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--green)}
button{font:inherit;color:inherit}
#app{max-width:var(--col);margin:0 auto;min-height:100vh;padding-bottom:calc(160px + env(safe-area-inset-bottom))}
body.grande #app,body.grande nav.bottom .in,body.grande .fab,body.grande #toast{zoom:1.14}
@media (min-width:900px){:root{--col:780px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}}

/* testata */
.top{display:flex;align-items:flex-start;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 18px 10px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.12;overflow-wrap:anywhere}
.top.piccola h1{font-size:25px}
.top .sub{font-size:15px;color:var(--ink2);margin-top:5px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.icon-btn{width:46px;height:46px;flex:none;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:0}
.icon-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.txt-btn{min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:16px;color:var(--green);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;flex:none}
.txt-btn.on{background:var(--green);color:#fff;border-color:var(--green)}

.pad{padding:0 16px;display:flex;flex-direction:column;gap:9px}
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 2px}
.sec h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.sec.rust h2{color:var(--rust)}
.sec.amber h2{color:var(--amber)}
.sec.green h2{color:var(--green)}
.sec .destra{margin-left:auto;font-size:15px;font-weight:700;text-decoration:none}
.badge{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--ink2);color:#fff}
.badge.rust{background:var(--rust)}
.badge.amber{background:var(--amber)}
.badge.green{background:var(--green)}

/* righe */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:66px;text-decoration:none;color:inherit;width:100%;text-align:left;font:inherit}
button.row{cursor:pointer}
.row-rust{background:var(--rustbg);border-color:var(--rustline)}
.row-amber{background:var(--amberbg);border-color:var(--amberline)}
.row-ok{background:var(--greenbg);border-color:var(--greenline)}
.row-done{opacity:.72}
.row-main{flex:1;min-width:0;text-decoration:none;color:inherit;display:block}
.row-title{display:block;font-size:17px;font-weight:650;line-height:1.28;color:var(--ink);overflow-wrap:anywhere}
.row-meta{display:block;font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.35}
.row-rust .row-meta{color:var(--rustink)}
.row-amber .row-meta{color:var(--amber)}
.row-ok .row-meta{color:var(--greenink)}
.row-when{font-size:14px;font-weight:700;color:var(--ink2);flex:none;text-align:right;max-width:38%}
.t-rust{color:var(--rust)!important}
.t-green{color:var(--green)!important}
.check{width:48px;height:48px;flex:none;border-radius:24px;border:1.5px solid var(--btnline);background:var(--card);color:var(--green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.avatar{width:46px;height:46px;flex:none;border-radius:23px;background:var(--plumbg);color:var(--plum);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.dicon{width:42px;height:42px;flex:none;border-radius:12px;background:var(--greenbg);color:var(--greenink);display:flex;align-items:center;justify-content:center}
.dicon.rust{background:var(--rustbg);color:var(--rust)}
.dicon.amber{background:var(--amberbg);color:var(--amber)}
.dicon.plum{background:var(--plumbg);color:var(--plum)}

/* gruppi stile iPhone */
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group>.gi{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:64px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left;font:inherit;cursor:pointer;border-left:0;border-right:0;border-top:0}
.group>.gi:last-child{border-bottom:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2);font-size:16px}
.kv:last-child{border-bottom:0}
.kv .k{width:128px;flex:none;color:var(--ink2);font-size:15px}
.kv .v{flex:1;font-weight:650;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--greenbg);color:var(--greenink)}
.tag.plum{background:var(--plumbg);color:var(--plum)}
.tag.rust{background:var(--rust);color:#fff}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.grey{background:var(--line2);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 8px}

/* pulsanti */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 18px;border-radius:14px;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;border:1px solid var(--btnline);background:var(--card);color:var(--ink);width:100%;text-align:center;line-height:1.2}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{color:var(--rust);border-color:var(--rustline);background:var(--card)}
.btn-sm{min-height:50px;font-size:16px}
.btn:disabled{opacity:.55}
.two{display:flex;gap:8px}
.two>*{flex:1;width:auto}
.fab{position:fixed;right:max(16px,calc((100vw - var(--col)) / 2 + 16px));bottom:calc(92px + env(safe-area-inset-bottom));height:60px;padding:0 22px 0 18px;border-radius:30px;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 6px 18px rgba(31,37,35,.25);z-index:6}

/* moduli */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;display:inline-flex}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.chips span{display:inline-flex;align-items:center;min-height:48px;padding:0 15px;border-radius:12px;border:1px solid var(--btnline);background:var(--card);font-size:16px;font-weight:650}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--green);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.field>label,.field>.lab{font-size:16px;font-weight:750;color:var(--ink)}
.hint{font-size:14px;color:var(--ink2);line-height:1.45}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],input[type=tel],select,textarea{font:inherit;font-size:17px;padding:12px 13px;border:1px solid var(--btnline);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-height:52px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--greenline);border-color:var(--green)}
.inline{display:flex;gap:8px;align-items:center}
.inline>*{flex:1}
.inline .lbl{flex:none;font-size:16px;font-weight:650}
.err{color:var(--rust);font-size:15px;font-weight:750;margin:0}
.err:empty{display:none}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.filebtns{display:flex;gap:8px}
.filebtns label{position:relative;overflow:hidden;flex:1}
.filebtns input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.stepper{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.stepper .nome{flex:1;font-weight:650}
.stepper input{width:64px;min-height:46px;text-align:center;padding:6px;flex:none}
.stepper button{width:46px;height:46px;border-radius:23px;border:1px solid var(--btnline);background:var(--card);font-size:22px;font-weight:700;cursor:pointer;flex:none;line-height:1}
.orari{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.orari .ora{display:inline-flex;align-items:center;gap:4px;padding:0 6px 0 14px;min-height:48px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
.orari .ora button{width:36px;height:36px;border:0;background:none;color:#fff;font-size:20px;cursor:pointer}
.orari input{width:130px;flex:none}

/* segmenti e ricerca */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg a,.seg button{flex:none;text-align:center;font-size:15px;font-weight:700;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.seg a.on,.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cerca{position:relative}
.cerca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.cerca input{padding-left:44px;border-radius:14px;background:var(--card)}

/* riquadri */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;min-height:122px}
.tile b{font-size:17px;line-height:1.2}
.tile small{font-size:14px;color:var(--ink2);line-height:1.35}
.tile.rust{background:var(--rustbg);border-color:var(--rustline)}
.tile.rust small{color:var(--rustink);font-weight:700}
.tile.nuovo{border-style:dashed;align-items:center;justify-content:center;color:var(--green);font-weight:800}
.tile .ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.tile.mod{padding-top:56px}
.tile.mod .dicon{display:none}
.tile .ctl button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tile .ctl .meno{background:var(--rust);border-color:var(--rust);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h3{margin:0 0 6px;font-size:18px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:14px;font-size:15px;line-height:1.45;border:1px solid}
.banner svg{flex:none;margin-top:2px}
.banner.amber{background:var(--amberbg);border-color:var(--amberline);color:var(--amber)}
.banner.rust{background:var(--rustbg);border-color:var(--rustline);color:var(--rustink)}
.banner.green{background:var(--greenbg);border-color:var(--greenline);color:var(--greenink)}
.banner a{color:inherit;font-weight:800}
.mx{margin:0 16px 8px}
.empty{font-size:16px;color:var(--ink2);margin:4px 2px 6px}
.muted{color:var(--ink2)}
.hidden{display:none!important}
.syncline{display:block;text-align:center;font-size:14px;color:var(--ink2);margin:16px 0 2px;text-decoration:none}
.docimg{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;display:block}

/* Effie */
.effie{display:flex;align-items:flex-end;gap:10px;margin:2px 16px 6px}
.effie svg{flex:none}
.bolla{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 15px;font-size:16px;line-height:1.45}
.bolla b{font-weight:800}

/* terapia */
.dose{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.dose.ok{background:var(--greenbg);border-color:var(--greenline)}
.dose.no{background:var(--amberbg);border-color:var(--amberline)}
.dose .testa{display:flex;gap:10px;align-items:flex-start}
.dose .nome{font-size:18px;font-weight:750}
.dose .quanto{font-size:15px;color:var(--ink2);margin-top:2px}
.dose .esito{font-size:15px;font-weight:700}
.dose .bottoni{display:flex;gap:8px}
.dose .bottoni>*{flex:1}
.ospite-testa{display:flex;align-items:center;gap:10px;margin:18px 2px 0}
.ospite-testa b{font-size:19px}
.ospite-testa .btn{width:auto;min-height:44px;font-size:15px;margin-left:auto;padding:0 14px}

/* grafico */
.grafico{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 4px}
.grafico svg{display:block;width:100%;height:auto}

/* barra in basso */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.bottom .in{display:flex;width:100%;max-width:var(--col)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:12.5px;font-weight:700;min-height:54px}
nav.bottom a.on{color:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 10px 10px 18px;border-radius:16px;font-size:16px;font-weight:650;width:max-content;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;display:flex;align-items:center;gap:12px;min-height:52px}
#toast.show{opacity:1;pointer-events:auto}
#toast button{background:#fff;color:var(--ink);border:0;border-radius:11px;font-weight:800;padding:0 14px;min-height:40px;cursor:pointer}
#toast button.hidden{display:none}
.lockwrap{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
body.drag::after{content:"Lascia qui il file";position:fixed;inset:12px;border:3px dashed var(--green);border-radius:20px;background:rgba(226,238,234,.94);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--greenink);z-index:20;pointer-events:none}
.cal12{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cal12 .m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;color:var(--ink2)}
.cal12 .m b{display:block;font-size:16px;color:var(--ink);margin-top:1px}
.cal12 .m.si{background:var(--greenbg);border-color:var(--greenline);color:var(--greenink)}
@media (min-width:900px){.cal12{grid-template-columns:repeat(12,minmax(0,1fr))}}
.settimana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.settimana .g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;min-height:84px}
.settimana .g b{display:block;font-size:14px;margin-bottom:4px}
.settimana .g.oggi{border-color:var(--green);border-width:2px}
.settimana .g span{display:block;background:var(--greenbg);color:var(--greenink);border-radius:6px;margin:3px 3px 0;padding:2px 0;font-weight:700;font-size:11px}
.giorno-testa{font-size:15px;font-weight:800;color:var(--ink2);margin:18px 2px 0;text-transform:capitalize}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"><span id="toast-t"></span><button type="button" id="toast-b" class="hidden">Annulla</button></div>
<script>
'use strict';

/* =========================================================== costanti */

const moduli = {};   // gestori dei moduli (data-form)
const azioni = {};   // gestori dei pulsanti (data-action)


const VERSIONE = '0.3 (prova)';
const UTENTI = ['Rita', 'Michele', 'Vincenzo'];
const RESPONSABILI = ['Rita', 'Michele', 'Entrambi'];
const CATEGORIE = ['Pagamenti', 'Servizi della casa', 'Salute ospiti', 'Personale', 'Autorizzazioni e certificati', 'Ospiti', 'Altro'];
// categorie della versione precedente, ancora valide nei dati già inseriti
const CATEGORIE_VECCHIE = { 'Bollette e utenze': 'Pagamenti', 'Assicurazioni': 'Pagamenti', 'Quote e adesioni': 'Pagamenti', 'Servizi': 'Servizi della casa', 'Farmaci': 'Salute ospiti' };
const TIPI_DOC = ['Referto', 'Prescrizione', 'Impegnativa', 'Bolletta', 'Ricevuta', 'Polizza', 'Contratto', "Documento d'identità", 'Esenzione o invalidità', 'Altro'];
const UNITA_FARMACO = ['compresse', 'capsule', 'bustine', 'gocce', 'ml', 'fiale', 'cerotti', 'dosi', 'applicazioni'];
const RICORRENZE = [
  ['', 'Una volta sola'], ['1-settimane', 'Ogni settimana'], ['1-mesi', 'Ogni mese'],
  ['2-mesi', 'Ogni 2 mesi'], ['3-mesi', 'Ogni 3 mesi'], ['6-mesi', 'Ogni 6 mesi'],
  ['1-anni', 'Ogni anno'], ['altro', 'Altro…']

const AVVISI = [[0, 'Il giorno stesso'], [1, '1 giorno prima'], [3, '3 giorni prima'], [7, '1 settimana prima'], [30, '1 mese prima']];

const MOTIVI_NONDATO = ['Rifiutato', 'Fuori casa', 'Ricoverato', 'Sospeso dal medico', 'Finito, da ricomprare', 'Altro'];
const TIPI_VISITA = ['Medico di base', 'Esami del sangue', 'Cardiologo', 'Diabetologo', 'Psichiatra', 'Neurologo', 'Dentista', 'Oculista', 'Fisioterapia', 'Altro'];
const PARAMETRI = [
  { k: 'pressione', nome: 'Pressione', u: 'mmHg', ph: 'es. 130/80', doppio: true },
  { k: 'glicemia', nome: 'Glicemia', u: 'mg/dl', ph: 'es. 110' },
  { k: 'peso', nome: 'Peso', u: 'kg', ph: 'es. 72,5' },
  { k: 'saturazione', nome: 'Saturazione', u: '%', ph: 'es. 97' },
  { k: 'temperatura', nome: 'Temperatura', u: '°C', ph: 'es. 36,6' },
  { k: 'battito', nome: 'Battito', u: 'bpm', ph: 'es. 72' }
];
const GIORNI_BREVI = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
const ORDINE_SETTIMANA = [1, 2, 3, 4, 5, 6, 0];

// Tipi di servizio: ognuno ha la sua schermata specializzata.
const TIPI_SERVIZIO = [
  ['pagamenti', 'Pagamenti', 'Bollette, assicurazioni, commercialista: scadenze e ricevute'],
  ['spesa', 'Spesa', 'Lista delle cose da comprare, scontrini'],
  ['lavanderia', 'Lavanderia', 'Cosa si consegna, di chi, cosa deve ancora tornare'],
  ['pulizie', 'Pulizie', 'Stanze e zone, con l\'ultima volta che sono state fatte'],
  ['rifiuti', 'Rifiuti', 'Calendario della raccolta e avviso la sera prima'],
  ['manutenzioni', 'Manutenzioni', 'Guasti da sistemare e controlli periodici'],
  ['trasporti', 'Trasporti', 'Accompagnamenti e uscite'],
  ['farmacia', 'Farmacia', 'Farmaci da ordinare, anche su WhatsApp'],
  ['semplice', 'Semplice', 'Solo "fatto", con note e foto']
];

function esc(s) {

}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8).padEnd(6, '0'); }
function adesso() { return new Date().toISOString(); }
const pad = n => String(n).padStart(2, '0');
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function aData(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function dataValida(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(aData(s)); }
function oraValida(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')); }
function oggi() { return iso(new Date()); }
function oraAdesso() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function piuGiorni(s, n) { const d = aData(s); d.setDate(d.getDate() + n); return iso(d); }
function piuMesi(s, n) {
  const d = aData(s); const giorno = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(giorno, ultimo)); return iso(d);
}
function giorniTra(a, b) { return Math.round((aData(b) - aData(a)) / 86400000); }
function piuMinuti(data, ora, n) {
  const [y, m, d] = data.split('-').map(Number); const [h, mi] = ora.split(':').map(Number);
  const x = new Date(y, m - 1, d, h, mi + n);
  return { data: iso(x), ora: pad(x.getHours()) + ':' + pad(x.getMinutes()) };
}
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const MESI_L = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const GIORNI_L = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
function fmt(s) {
  if (!s) return '—';
  const n = giorniTra(oggi(), s);
  if (n === 0) return 'oggi';
  if (n === 1) return 'domani';
  if (n === -1) return 'ieri';
  const d = aData(s);
  return d.getDate() + ' ' + MESI[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtLungo(s) { const d = aData(s); return GIORNI_L[d.getDay()] + ' ' + d.getDate() + ' ' + MESI_L[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtGiorno(s) {
  const n = giorniTra(oggi(), s);
  if (n === 0) return 'Oggi';
  if (n === -1) return 'Ieri';
  if (n === 1) return 'Domani';
  const d = aData(s);
  return GIORNI_L[d.getDay()] + ' ' + d.getDate() + ' ' + MESI_L[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtOra(o) { return o ? String(o).replace(/^0(\d)/, '$1') : ''; }
function euro(n) { return n == null || isNaN(n) ? '' : Number(n).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' }); }
function numero(x) { const n = parseFloat(String(x == null ? '' : x).trim().replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(n) ? null : n; }
function numIt(n) { return n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ','); }
function iniziali(nome) { return String(nome || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join(''); }
const SINGOLARE = { compresse: 'compressa', capsule: 'capsula', bustine: 'bustina', gocce: 'goccia', fiale: 'fiala', cerotti: 'cerotto', dosi: 'dose', applicazioni: 'applicazione' };
function quantita(n, u) { u = u || 'unità'; return numIt(n) + ' ' + (Number(n) === 1 && SINGOLARE[u] ? SINGOLARE[u] : u); }
function plur(n, uno, tanti) { return n + ' ' + (n === 1 ? uno : tanti); }
function semplifica(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function saluto() { const h = new Date().getHours(); return h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }

function prossimaData(s, ric) {
  if (!ric) return null;
  const n = Math.max(1, parseInt(ric.ogni, 10) || 1);
  switch (ric.unita) {
    case 'giorni': return piuGiorni(s, n);
    case 'settimane': return piuGiorni(s, 7 * n);
    case 'mesi': return piuMesi(s, n);
    case 'anni': return piuMesi(s, 12 * n);
  }
  return null;
}
function descRic(ric) {
  if (!ric) return 'Una volta sola';
  const nomi = { giorni: ['giorno', 'giorni'], settimane: ['settimana', 'settimane'], mesi: ['mese', 'mesi'], anni: ['anno', 'anni'] }[ric.unita] || ['volta', 'volte'];
  return ric.ogni === 1 ? 'Ogni ' + nomi[0] : 'Ogni ' + ric.ogni + ' ' + nomi[1];
}
function descAvviso(n) { const t = AVVISI.find(a => a[0] === n); return t ? t[1] : n + ' giorni prima'; }
function leggiRic(fd) {
  const ricK = String(fd.get('ric') || '');
  if (ricK === 'altro') return { ogni: Math.max(1, parseInt(fd.get('ric_n'), 10) || 1), unita: String(fd.get('ric_u') || 'settimane') };
  if (ricK) { const [n, u] = ricK.split('-'); return { ogni: parseInt(n, 10), unita: u }; }
  return null;
}
function chiaveRic(ric) {
  if (!ric) return '';
  const k = ric.ogni + '-' + ric.unita;

const STORES_CONDIVISI = ['voci', 'eventi', 'ospiti', 'documenti', 'farmaci', 'servizi', 'somministrazioni', 'visite', 'parametri', 'lista'];

const memoria = {};
STORES.forEach(s => { memoria[s] = new Map(); });

function apriDB() {
  return new Promise(resolve => {
    try {
      if (!('indexedDB' in window)) return resolve(false);
      const r = indexedDB.open('kenosis', 3);
      r.onupgradeneeded = () => {
        const d = r.result;
        STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      };
      r.onsuccess = () => {
        idb = r.result;
        idb.onversionchange = () => { idb.close(); location.reload(); };
        resolve(true);
      };
      r.onerror = () => resolve(false);
      r.onblocked = () => setTimeout(() => resolve(false), 8000);
    } catch (e) { resolve(false); }
  });
}
function transazione(store, modo, fn) {
  return new Promise((resolve, reject) => {
    const t = idb.transaction(store, modo);
    const req = fn(t.objectStore(store));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const DB = {
  all(s) { return idb ? transazione(s, 'readonly', os => os.getAll()) : Promise.resolve([...memoria[s].values()]); },
  get(s, id) { return idb ? transazione(s, 'readonly', os => os.get(id)) : Promise.resolve(memoria[s].get(id)); },
  put(s, o) { if (!idb) { memoria[s].set(o.id, o); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.put(o)); },
  del(s, id) { if (!idb) { memoria[s].delete(id); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.delete(id)); },
  clear(s) { if (!idb) { memoria[s].clear(); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.clear()); }
};

const S = { kv: {} };
const CACHE = {};   // indici ricalcolati solo quando cambia un archivio
STORES_CONDIVISI.forEach(s => { S[s] = []; });
let persistente = false;
let bloccato = false;

async function carica() {
  for (const s of STORES_CONDIVISI) { S[s] = await DB.all(s); delete CACHE[s]; }
  S.kv = {};
  (await DB.all('kv')).forEach(x => { S.kv[x.id] = x.v; });
  await semina();
}
// I servizi di partenza si mettono una volta sola per telefono, senza inviarli.
async function semina() {
  if (S.kv.seminato) return;
  for (const b of SERVIZI_BASE) {
    if (S.servizi.some(x => x.id === b.id)) continue;
    const o = JSON.parse(JSON.stringify(b));
    o.agg = ANTICO;
    await DB.put('servizi', o);
    S.servizi.push(o);
  }
  S.kv.seminato = true;
  await DB.put('kv', { id: 'seminato', v: true });
}
async function salva(store, obj, opz = {}) {
  if (!opz.remoto) {
    obj.agg = adesso();
    obj.da = obj.da || utente();
  }
  await DB.put(store, obj);
  delete CACHE[store];
  const i = S[store].findIndex(x => x.id === obj.id);
  if (i >= 0) S[store][i] = obj; else S[store].push(obj);
  if (!opz.remoto) await mettiInCoda(store, obj.id, false);
}
async function togli(store, id, opz = {}) {
  await DB.del(store, id);
  delete CACHE[store];
  S[store] = S[store].filter(x => x.id !== id);
  if (!opz.remoto) await mettiInCoda(store, id, true);
}
// Elimina con la possibilità di annullare per qualche secondo.
async function eliminaConAnnulla(elenco, msg, poi) {
  const copie = elenco.map(([store, o]) => [store, JSON.parse(JSON.stringify(Object.assign({}, o, { blob: undefined }))), o.blob]);
  for (const [store, o] of elenco) await togli(store, o.id);
  dopoModifica();
  if (poi) poi();
  avvisa(msg, async () => {
    for (const [store, o, blob] of copie) {
      if (blob) o.blob = blob;
      if (store === 'documenti') { delete o.fileSu; delete o.fileGrande; }   // il file va ricaricato
      await salva(store, o);
    }
    dopoModifica();
    render();
    avvisa('Ripristinato');
  });
}

function stato(v) {
  const n = giorniTra(oggi(), v.prossima);
  if (n < 0) return 'ritardo';
  if (n === 0) return 'oggi';
  if (n <= 7) return 'settimana';

}

  while (n && n <= dataFatto && giri++ < 1000) n = prossimaData(n, v.ric);
  return n;
}

// Controlli prima di segnare un pagamento: evita di pagare due volte.
function controlliPagamento(v, importo, data) {
  const avvisi = [];
  if (!v) return avvisi;
  if (v.domiciliato) avvisi.push('Questo si paga da solo con l\'addebito in banca: non va pagato a mano.');
  if (v.attiva === false) avvisi.push('Risulta già chiuso' + (v.chiusaIl ? ' il ' + fmtLungo(v.chiusaIl) : '') + '.');
  const finestra = e => Math.abs(giorniTra(e.data, data)) <= 45;
  const stessi = S.eventi.filter(e => e.tipo === 'pagato' && finestra(e));
  const proprio = stessi.find(e => e.voceId === v.id);
  if (proprio) avvisi.push('Risulta già pagato il ' + fmtLungo(proprio.data) + (proprio.chi ? ' da ' + proprio.chi : '') + (proprio.importo != null ? ' (' + euro(proprio.importo) + ')' : '') + '.');
  if (importo != null) {
    const simile = stessi.find(e => e.voceId !== v.id && e.importo != null && Math.abs(e.importo - importo) < 0.01 &&
      ((e.voceId && voce(e.voceId) && (voce(e.voceId).pag || voce(e.voceId).nome) === (v.pag || v.nome)) || (e.nota && semplifica(e.nota).includes(semplifica(v.pag || v.nome)))));
    if (simile) avvisi.push('Il ' + fmtLungo(simile.data) + (simile.chi ? ' ' + simile.chi : '') + ' ha già pagato ' + euro(simile.importo) + ' per ' + ((voce(simile.voceId) || {}).nome || simile.nota) + '. È lo stesso pagamento?');
  }
  return avvisi;
}
// Un avviso appena arrivato: c'è già qualcosa di uguale aperto?
function giaInserito(pag, importo, scadenza) {
  return attive().find(v => ePagamento(v) && (v.pag || v.nome) === pag && importo != null && v.importo != null &&
    Math.abs(v.importo - importo) < 0.01 && Math.abs(giorniTra(v.prossima, scadenza)) <= 20) || null;
}

/* ================================================= terapia */

const IN_TERAPIA = f => Array.isArray(f.orari);
function farmacoAttivo(f, d) {
  const o = ospite(f.ospiteId);
  if (f.sospeso || (o && o.attivo === false)) return false;
  if (f.dal && f.dal > d) return false;
  if (f.al && f.al < d) return false;
  return true;
}
function programmato(f, d) {
  if (!IN_TERAPIA(f) || f.giorni === 'bisogno' || !f.orari.length || !farmacoAttivo(f, d)) return false;
  if (Array.isArray(f.giorni)) return f.giorni.includes(aData(d).getDay());
  return true;
}
function smId(f, d, ora) { return 'sm' + f.id + d.replace(/-/g, '') + ora.replace(':', ''); }
function indiceSomm() {
  if (!CACHE.somministrazioni) CACHE.somministrazioni = new Map(S.somministrazioni.map(x => [x.id, x]));
  return CACHE.somministrazioni;
}
// Tutte le dosi previste in un giorno, raggruppate per orario.
function slotDel(d, ospiteId) {
  const mappa = new Map();
  for (const f of S.farmaci) {
    if (ospiteId && f.ospiteId !== ospiteId) continue;
    if (!programmato(f, d)) continue;
    for (const ora of f.orari) {
      if (!mappa.has(ora)) mappa.set(ora, []);
      mappa.get(ora).push(f);
    }
  }
  const idx = indiceSomm();
  return [...mappa.keys()].sort().map(ora => {
    const dosi = mappa.get(ora).map(f => ({ f, sm: idx.get(smId(f, d, ora)) || null }));
    const dati = dosi.filter(x => x.sm && x.sm.esito === 'dato').length;
    const nonDati = dosi.filter(x => x.sm && x.sm.esito === 'nondato').length;
    return { data: d, ora, dosi, dati, nonDati, mancano: dosi.length - dati - nonDati };
  });
}
function descGiorni(f) {
  if (f.giorni === 'bisogno') return 'Al bisogno';
  if (Array.isArray(f.giorni)) return ORDINE_SETTIMANA.filter(g => f.giorni.includes(g)).map(g => GIORNI_BREVI[g]).join(', ');
  return 'Tutti i giorni';
}
function descOrari(f) {
  if (f.giorni === 'bisogno') return 'Al bisogno';
  return (f.orari || []).map(fmtOra).join(' · ') + (Array.isArray(f.giorni) ? ' (' + descGiorni(f) + ')' : '');
}
function usoAlGiorno(f) {
  if (!IN_TERAPIA(f)) return Number(f.alGiorno) || 0;
  if (f.giorni === 'bisogno') return Number(f.alGiorno) || 0;
  const q = Number(f.qta) || 0;
  const frazione = Array.isArray(f.giorni) ? f.giorni.length / 7 : 1;
  return q * f.orari.length * frazione;
}
// Scorta: dall'ultima conta tolgo le dosi segnate come date (stima per i vecchi farmaci).
function scorta(f, rif) {
  rif = rif || oggi();
  let rimaste;
  const base = Number(f.inCasa) || 0;
  if (IN_TERAPIA(f)) {
    const da = f.contatoQuando || (f.contatoIl ? f.contatoIl + 'T00:00:00.000Z' : '');
    const usate = S.somministrazioni.filter(x => x.farmacoId === f.id && x.esito === 'dato' && (x.quando || '') >= da)
      .reduce((a, x) => a + (Number(x.qta) || 0), 0);
    rimaste = base - usate;
    // per i giorni futuri, aggiungo il consumo previsto
    if (rif > oggi()) rimaste -= usoAlGiorno(f) * giorniTra(oggi(), rif);
  } else {
    const passati = Math.max(0, giorniTra(f.contatoIl || rif, rif));
    rimaste = base - passati * (Number(f.alGiorno) || 0);
  }
  rimaste = Math.max(0, Math.round(rimaste * 10) / 10);
  const uso = usoAlGiorno(f);
  const giorni = uso > 0 ? Math.floor(rimaste / uso) : null;
  let scad = null;
  if (f.scadenza) {
    const n = giorniTra(rif, f.scadenza);
    scad = n < 0 ? 'scaduto' : n <= 30 ? '30' : n <= 60 ? '60' : null;
  }
  const soglia = f.soglia == null ? 7 : Number(f.soglia);
  const attivo = farmacoAttivo(f, rif);
  return { rimaste, giorni, scad, uso, daRiordinare: attivo && giorni !== null && giorni <= soglia, finito: attivo && rimaste <= 0 && uso > 0 };
}
const stimaFarmaco = scorta;
function farmaciDaControllare() {
  return S.farmaci.filter(f => farmacoAttivo(f, oggi())).map(f => ({ f, s: scorta(f) })).filter(x => x.s.daRiordinare || x.s.scad === 'scaduto' || x.s.scad === '30');
}

/* ================================================= visite e parametri */

const visitePreviste = () => S.visite.filter(v => v.stato === 'prevista' && v.data).sort((a, b) => (a.data + (a.ora || '')).localeCompare(b.data + (b.ora || '')));
function parametro(k) { return PARAMETRI.find(p => p.k === k) || { k, nome: k, u: '', ph: '' }; }
function valoriParametro(p) {
  const nums = String(p.valore || '').split('/').map(numero);
  return nums.filter(n => n != null);
}
function misure(ospiteId, k) {
  return S.parametri.filter(p => p.ospiteId === ospiteId && p.tipo === k).sort((a, b) => (a.data + (a.ora || '')).localeCompare(b.data + (b.ora || '')));
}

/* ================================================= servizi della casa */

function rifiutiDi(d) {
  const sv = servizioDiTipo('rifiuti');
  if (!sv || !sv.conf || !sv.conf.calendario) return [];
  return sv.conf.calendario[aData(d).getDay()] || [];
}
// La sera prima del passaggio si mette fuori.
const rifiutiStasera = d => rifiutiDi(piuGiorni(d || oggi(), 1));
const lavanderiaFuori = () => S.eventi.filter(e => e.tipo === 'lavanderia' && e.fuori && !e.rientrato).sort(recenti);
const guastiAperti = () => S.eventi.filter(e => e.tipo === 'guasto' && e.stato !== 'risolto').sort(recenti);
const trasportiPrevisti = () => S.eventi.filter(e => e.tipo === 'trasporto' && !e.fatto).sort((a, b) => (a.data + (a.ora || '')).localeCompare(b.data + (b.ora || '')));

/* ================================================= riepilogo di oggi */

function riepilogo() {
  const t = oggi();
  const att = attive().sort(perData);
  return {
    ritardo: att.filter(v => v.prossima < t),
    diOggi: att.filter(v => v.prossima === t),
    inArrivo: att.filter(v => { const n = giorniTra(t, v.prossima); return n > 0 && n <= Math.max(v.avviso || 0, 1); }),
    settimana: att.filter(v => { const n = giorniTra(t, v.prossima); return n > 0 && n <= 7; }),
    farmaci: farmaciDaControllare(),
    visite: visitePreviste().filter(v => giorniTra(t, v.data) <= Math.max(1, v.avviso || 0)),
    trasporti: trasportiPrevisti().filter(e => e.data <= piuGiorni(t, 1)),
    slot: slotDel(t),
    rifiuti: rifiutiStasera(t),
    rifiutiFatto: S.eventi.some(e => e.tipo === 'rifiuti' && e.data === t),
    lavanderia: lavanderiaFuori(),
    guasti: guastiAperti()
  };
}
function fraseEffie(r) {
  const pezzi = [];
  const mancano = r.slot.filter(s => s.mancano);
  if (mancano.length) pezzi.push('terapia alle ' + mancano.map(s => fmtOra(s.ora)).join(', ').replace(/, ([^,]*)$/, ' e $1'));
  const scad = r.ritardo.length + r.diOggi.length;
  if (scad) pezzi.push(plur(scad, 'cosa da fare', 'cose da fare') + (r.ritardo.length ? ' (' + r.ritardo.length + ' in ritardo)' : ''));
  const vis = r.visite.filter(v => v.data === oggi()).length;
  if (vis) pezzi.push(plur(vis, 'visita', 'visite'));
  if (r.rifiuti.length && !r.rifiutiFatto) pezzi.push('stasera fuori ' + r.rifiuti.join(', ').toLowerCase());
  if (r.farmaci.length) pezzi.push(plur(r.farmaci.length, 'farmaco da ordinare', 'farmaci da ordinare'));
  const nome = utente() && utente() !== 'Vincenzo' ? ' ' + utente() : '';
  if (!pezzi.length) return '<b>' + saluto() + nome + '!</b> Per oggi è tutto in ordine.';
  return '<b>' + saluto() + nome + '.</b> Oggi: ' + esc(pezzi.join(' · ')) + '.';
}

/* ================================================= momenti per gli avvisi */
// Quando far suonare il telefono nei prossimi giorni. Al servizio arrivano solo
// data, ora e una lettera; il testo resta sul telefono.

function momenti(giorni = 14) {
  const out = [];
  const t0 = oggi();
  const ora0 = oraAdesso();
  const c = S.kv.sync || {};
  const oraMattino = c.ora || '08:30';
  const mie = mieVoci();
  const aggiungi = (d, ora, x, testo, k) => {
    if (d === t0 && ora <= ora0) return;
    out.push({ t: d + 'T' + ora, x, testo, k: k || null });
  };
  for (let i = 0; i < giorni; i++) {
    const d = piuGiorni(t0, i);
    const scad = mie.filter(v => giorniTra(d, v.prossima) <= 0).length;
    const avvisi = mie.filter(v => { const n = giorniTra(d, v.prossima); return n > 0 && n <= (v.avviso || 0); }).length;
    const vis = visitePreviste().filter(v => v.data === d).length;
    const visArrivo = visitePreviste().filter(v => { const n = giorniTra(d, v.data); return n > 0 && n <= Math.max(1, v.avviso || 0); }).length;
    const slots = slotDel(d);
    const pezzi = [];
    if (scad) pezzi.push(plur(scad, 'cosa da fare', 'cose da fare'));
    if (avvisi) pezzi.push(plur(avvisi, 'scadenza in arrivo', 'scadenze in arrivo'));
    if (vis) pezzi.push(plur(vis, 'visita', 'visite'));
    if (visArrivo) pezzi.push(plur(visArrivo, 'visita in arrivo', 'visite in arrivo'));
    if (i === 0) { const fd = farmaciDaControllare().length; if (fd) pezzi.push(plur(fd, 'farmaco da ordinare', 'farmaci da ordinare')); }
    if (pezzi.length) aggiungi(d, oraMattino, 'm', 'Oggi: ' + pezzi.join(' · '));
    for (const s of slots) {
      if (!s.mancano) continue;   // già tutto segnato
      aggiungi(d, s.ora, 't', 'È l\'ora della terapia delle ' + fmtOra(s.ora) + ': ' + plur(s.dosi.length, 'farmaco', 'farmaci') + ' da dare');
      const dopo = piuMinuti(d, s.ora, 30);
      aggiungi(dopo.data, dopo.ora, 's', 'Terapia delle ' + fmtOra(s.ora) + ': c\'è ancora qualcosa da segnare', d + 'T' + s.ora);
    }
    const fuori = rifiutiStasera(d);
    const sv = servizioDiTipo('rifiuti');
    if (fuori.length && sv) aggiungi(d, (sv.conf && sv.conf.ora) || '20:00', 'r', 'Stasera porta fuori: ' + fuori.join(', ').toLowerCase());
    for (const v of visitePreviste().filter(v => v.data === d && v.ora)) {
      const p = piuMinuti(d, v.ora, -60);
      aggiungi(p.data, p.ora, 'v', 'Tra un\'ora c\'è una visita');
    }
    for (const e of trasportiPrevisti().filter(e => e.data === d && e.ora)) {
      const p = piuMinuti(d, e.ora, -60);
      aggiungi(p.data, p.ora, 'v', 'Tra un\'ora c\'è un accompagnamento');
    }
  }
  return out.sort((a, b) => a.t.localeCompare(b.t)).slice(0, 700);
}

let toastTimer = null;
let toastAnnulla = null;
function avvisa(msg, annulla) {
  const t = document.getElementById('toast');
  document.getElementById('toast-t').textContent = msg;
  const b = document.getElementById('toast-b');
  toastAnnulla = annulla || null;
  b.classList.toggle('hidden', !annulla);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastAnnulla = null; }, annulla ? 7000 : 2800);
}
document.getElementById('toast-b').addEventListener('click', async () => {

});
function errore(id, msg) {

function calendario(eventi) {
  const ora = new Date();
  const mesi = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(ora.getFullYear(), ora.getMonth() - i, 1);
    const k = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const n = eventi.filter(e => String(e.data).slice(0, 7) === k).length;
    mesi.push({ mese: MESI[d.getMonth()], lungo: MESI_L[d.getMonth()] + ' ' + d.getFullYear(), n });
  }
  return '<div class="cal12" role="list" aria-label="Ultimi 12 mesi">' + mesi.map(m =>
    '<div role="listitem" class="m' + (m.n ? ' si' : '') + '" aria-label="' + esc(m.lungo + ': ' + (m.n ? plur(m.n, 'volta', 'volte') : 'niente')) + '">' +
    esc(m.mese) + '<b aria-hidden="true">' + (m.n ? (m.n > 1 ? m.n : '✓') : '–') + '</b></div>').join('') + '</div>';
}

function vOspiti(q) {
  const ex = q.get('vista') === 'ex';
  const destra = '<a class="icon-btn primary" href="#/nuovo-ospite" aria-label="Aggiungi un ospite">' + ic('plus') + '</a>';
  const lista = ex ? S.ospiti.filter(o => o.attivo === false).sort(perNome) : ospitiAttivi();
  let h = testata(ex ? 'Non più ospiti' : 'Ospiti', { sub: ex ? '' : plur(lista.length, 'ospite', 'ospiti'), destra, indietro: ex }) + '<main class="pad">';
  if (!lista.length) h += '<p class="empty">' + (ex ? 'Nessuno.' : 'Nessun ospite ancora.') + '</p>' + (ex ? '' : '<a class="btn btn-primary" href="#/nuovo-ospite">' + ic('plus') + ' Aggiungi un ospite</a>');
  const t = oggi();
  h += lista.map(o => {
    const slots = slotDel(t, o.id);
    const mancano = slots.filter(s => s.mancano && s.ora <= oraAdesso()).length;
    const vs = attive().filter(v => v.ospiteId === o.id);
    const rit = vs.filter(v => stato(v) === 'ritardo').length;
    const pv = visitePreviste().find(v => v.ospiteId === o.id);
    const nf = S.farmaci.filter(f => f.ospiteId === o.id && farmacoAttivo(f, t)).length;
    const pezzi = [];
    if (mancano) pezzi.push('terapia da segnare');
    if (rit) pezzi.push(plur(rit, 'cosa in ritardo', 'cose in ritardo'));
    if (pv) pezzi.push((pv.tipo || 'visita') + ' ' + fmt(pv.data));
    if (!pezzi.length) pezzi.push(nf ? plur(nf, 'farmaco in terapia', 'farmaci in terapia') : 'nessuna terapia inserita');
    return '<a class="row ' + (mancano || rit ? 'row-rust' : '') + '" href="#/ospite/' + o.id + '"><span class="avatar">' + esc(iniziali(o.nome)) + '</span><span class="row-main"><span class="row-title">' + esc(o.nome) + '</span><span class="row-meta">' + esc(pezzi.join(' · ')) + '</span></span>' + ic('chev', 20) + '</a>';
  }).join('');
  const nEx = S.ospiti.filter(o => o.attivo === false).length;
  if (!ex && nEx) h += '<a class="btn btn-sm" style="margin-top:10px" href="#/ospiti?vista=ex">Non più ospiti (' + nEx + ')</a>';
  return h + '</main>' + barra('ospiti');
}

  const prossimoSlot = slots.find(s => s.mancano);
  const pv = visitePreviste().find(v => v.ospiteId === o.id);
  const ultimeVis = S.visite.filter(v => v.ospiteId === o.id && v.stato === 'fatta').length;
  const ultimaMisura = S.parametri.filter(p => p.ospiteId === o.id).sort(recenti)[0];

function prossimoCodice() {
  let n = 1;
  const usati = new Set(S.ospiti.map(o => o.codice));
  while (usati.has('OSP-' + pad(n))) n++;
  return 'OSP-' + pad(n);
}
moduli.ospite = async form => {
  const fd = new FormData(form);

  const nascita = String(fd.get('nascita') || '');
  const o = Object.assign({}, vecchio || { creato: adesso(), attivo: true }, {
    id: vecchio ? vecchio.id : uid(), nome,

  });

};

azioni['elimina-ospite'] = async el => {

  const tutto = [['ospiti', o]];
  for (const st of ['farmaci', 'visite', 'parametri', 'documenti', 'somministrazioni']) S[st].filter(x => x.ospiteId === o.id).forEach(x => tutto.push([st, x]));

};

function vOspiteTerapia(o) {

  let h = testata('Terapia', { indietro: true, sub: o.nome }) + '<main class="pad">';

  const slots = slotDel(t, o.id);
  if (slots.length) h += sezione('Oggi') + slots.map(s => rigaSlot(s, { ospite: o.id })).join('');
  h += sezione('Farmaci in terapia', attivi.length) + (attivi.length ? attivi.map(f => rigaFarmaco(f, { ospite: false })).join('') : '<p class="empty">Nessun farmaco a orario.</p>');
  if (bisogno.length) {
    h += sezione('Al bisogno', bisogno.length) + bisogno.map(f => '<div class="row"><a class="row-main" href="#/farmaco/' + f.id + '"><span class="row-title">' + esc(f.nome) + '</span><span class="row-meta">' + esc((f.dose || '') + (f.note ? ' · ' + f.note : '')) + '</span></a>' +
      '<button class="btn btn-sm" style="width:auto" data-action="dato-bisogno" data-f="' + f.id + '">Dato adesso</button></div>').join('');
  }
  h += '<a class="btn btn-primary" style="margin-top:10px" href="#/nuovo-farmaco?ospite=' + o.id + '">' + ic('plus', 21) + ' Aggiungi un farmaco</a>';
  h += '<a class="btn btn-sm" href="#/registro-terapia?ospite=' + o.id + '">' + ic('book', 20) + ' Registro: quando è stata data</a>';
  if (altri.length) h += sezione('Sospesi o finiti', altri.length) + altri.map(f => rigaFarmaco(f, { ospite: false })).join('');
  return h + '</main>' + barra('ospiti');
}

    campo('incasa', 'Quante ce ne sono adesso in casa?', '<input type="number" id="f-incasa" name="inCasa" min="0" step="any" inputmode="decimal" value="' + esc(f ? s.rimaste : '') + '">') +
    campo('confezione', 'Quante in una confezione? (facoltativo)', '<input type="number" id="f-confezione" name="confezione" min="0" step="any" inputmode="decimal" value="' + esc(f && f.confezione ? f.confezione : '') + '">', 'Così quando arriva dalla farmacia basta scrivere quante confezioni.') +
    campo('soglia', 'Avvisami quando restano (giorni)', '<input type="number" id="f-soglia" name="soglia" min="0" max="90" inputmode="numeric" value="' + esc(f ? (f.soglia == null ? 7 : f.soglia) : 7) + '">', 'Il tempo per chiedere la ricetta e ordinare.') +

    bottoniFine() + '</form></main>';

}
moduli.farmaco = async form => {
  const fd = new FormData(form);
  const nome = String(fd.get('nome') || '').trim();
  const ospiteId = String(fd.get('ospite') || '');
  const tipo = String(fd.get('giorni_tipo') || 'tutti');
  const orari = [...new Set(fd.getAll('ora').map(String).concat(oraValida(fd.get('ora_extra')) ? [String(fd.get('ora_extra'))] : []))].filter(oraValida).sort();
  const qta = numero(fd.get('qta'));
  const inCasa = numero(fd.get('inCasa'));
  if (!nome) { errore('err-nome', 'Scrivi il nome del farmaco.'); return; }
  if (!ospiteId) { errore('err-ospite', 'Scegli l\'ospite.'); return; }
  if (tipo !== 'bisogno' && !orari.length) { errore('err-ora', 'Scegli almeno un orario.'); return; }
  if (tipo !== 'bisogno' && (qta == null || qta < 0)) { errore('err-qta', 'Scrivi quante ogni volta (dalla prescrizione).'); return; }
  const giorni = tipo === 'bisogno' ? 'bisogno' : tipo === 'alcuni' ? fd.getAll('giorno').map(Number) : 'tutti';
  if (Array.isArray(giorni) && !giorni.length) { errore('err-ora', 'Scegli in quali giorni.'); return; }
  const vecchio = form.dataset.id ? farmaco(form.dataset.id) : null;
  const sPrima = vecchio ? scorta(vecchio) : null;
  const dal = String(fd.get('dal') || ''), al = String(fd.get('al') || ''), scad = String(fd.get('scadenza') || '');
  const soglia = parseInt(fd.get('soglia'), 10);
  const f = Object.assign({}, vecchio || { creato: adesso() }, {
    id: vecchio ? vecchio.id : uid(), nome, ospiteId,
    dose: String(fd.get('dose') || '').trim() || null,
    giorni, orari: tipo === 'bisogno' ? [] : orari, qta: qta == null ? 1 : qta,
    unita: String(fd.get('unita') || (vecchio && vecchio.unita) || 'compresse'),
    dal: dataValida(dal) ? dal : null, al: dataValida(al) ? al : null,
    medico: String(fd.get('medico') || '').trim() || null,
    confezione: numero(fd.get('confezione')) || null,
    scadenza: dataValida(scad) ? scad : null,
    soglia: isNaN(soglia) ? 7 : soglia,
    note: String(fd.get('note') || '').trim() || null
  });
  // la scorta si riparte da adesso solo se è stata cambiata a mano
  if (!vecchio || inCasa == null || !sPrima || Math.abs(inCasa - sPrima.rimaste) > 0.001) {
    f.inCasa = inCasa == null ? 0 : inCasa;
    f.contatoQuando = adesso();
    f.contatoIl = oggi();
  }
  delete f.alGiorno;
  await salva('farmaci', f);
  dopoModifica();
  avvisa('Farmaco salvato');
  vai('#/farmaco/' + f.id, true);
};
moduli.ritiro = async form => {
  const f = farmaco(form.dataset.id);
  if (!f) return;
  const fd = new FormData(form);
  let n = numero(fd.get('quante'));
  const conf = numero(fd.get('confezioni'));
  if ((n == null || n <= 0) && conf && f.confezione) n = conf * f.confezione;
  if (n == null || n <= 0) { errore('err-quante', 'Scrivi quante ne sono arrivate.'); return; }
  const s = scorta(f);
  f.inCasa = s.rimaste + n;
  f.contatoQuando = adesso();
  f.contatoIl = oggi();
  f.ordinatoIl = null;
  const scad = String(fd.get('scadenza') || '');

  await salva('eventi', { id: uid(), tipo: 'farmacia', servizio: (servizioDiTipo('farmacia') || {}).id || null, ospiteId: f.ospiteId, data: oggi(), ora: oraAdesso(), chi: utente(), nota: 'Arrivato: ' + f.nome + ' (' + quantita(n, f.unita) + ')', creato: adesso() });

};

/* --------------------------------------------- il giro della terapia */

function vGiro(data, hhmm, q) {
  const ora = String(hhmm || '').replace(/^(\d\d)(\d\d)$/, '$1:$2');
  if (!dataValida(data) || !oraValida(ora)) return nonTrovato();
  const filtro = q.get('ospite');
  const tutti = slotDel(data);
  const s = slotDel(data, filtro || undefined).find(x => x.ora === ora);
  const i = tutti.findIndex(x => x.ora === ora);
  const prec = tutti[i - 1], succ = tutti[i + 1];
  const nav = '<div class="two" style="margin-bottom:4px">' +
    (prec ? '<a class="btn btn-sm" href="#/giro/' + data + '/' + prec.ora.replace(':', '') + '">' + ic('back', 18) + ' ' + fmtOra(prec.ora) + '</a>' : '<span></span>') +
    (succ ? '<a class="btn btn-sm" href="#/giro/' + data + '/' + succ.ora.replace(':', '') + '">' + fmtOra(succ.ora) + ' ' + ic('chev', 18) + '</a>' : '<span></span>') + '</div>';
  let h = testata('Terapia delle ' + fmtOra(ora), { indietro: true, sub: fmtGiorno(data) + (filtro && ospite(filtro) ? ' · ' + ospite(filtro).nome : '') }) + '<main class="pad">';
  if (!filtro) h += nav;
  if (!s) return h + '<p class="empty">A quest\'ora non c\'è niente da dare.</p></main>' + barra('oggi');
  if (!s.mancano) h += banner('green', 'Tutto segnato per le ' + fmtOra(ora) + '.', 'check');
  else h += banner('amber', 'Segna <b>dopo</b> averla data davvero. Se ci sono dubbi sulla dose, chiedi al medico.');
  const perOspite = new Map();
  for (const d of s.dosi) { if (!perOspite.has(d.f.ospiteId)) perOspite.set(d.f.ospiteId, []); perOspite.get(d.f.ospiteId).push(d); }
  const ordine = [...perOspite.keys()].sort((a, b) => ((ospite(a) || {}).nome || '').localeCompare((ospite(b) || {}).nome || ''));
  for (const oid of ordine) {
    const o = ospite(oid);
    const dosi = perOspite.get(oid);
    const mancano = dosi.filter(d => !d.sm).length;
    h += '<div class="ospite-testa"><span class="avatar">' + esc(iniziali(o ? o.nome : '?')) + '</span><b>' + esc(o ? o.nome : 'Ospite') + '</b>' +
      (mancano > 1 ? '<button class="btn btn-sm" data-action="tutti-dati" data-o="' + oid + '" data-d="' + data + '" data-ora="' + ora + '">Tutte date</button>' : '') + '</div>';
    if (o && o.note) h += '<p class="hint" style="margin:0 2px;color:var(--amber);font-weight:700">' + esc(o.note.slice(0, 140)) + '</p>';
    h += dosi.map(({ f, sm }) => {
      const quanto = f.dose || (f.qta != null ? quantita(f.qta, f.unita) : '');
      if (sm) {
        const quando = sm.quando ? new Date(sm.quando).toTimeString().slice(0, 5) : '';
        return '<div class="dose ' + (sm.esito === 'dato' ? 'ok' : 'no') + '"><div class="testa"><div style="flex:1"><div class="nome">' + esc(f.nome) + '</div><div class="quanto">' + esc(quanto) + '</div></div></div>' +
          '<div class="esito">' + (sm.esito === 'dato' ? '✓ Dato' : '✗ Non dato' + (sm.motivo ? ': ' + esc(sm.motivo.toLowerCase()) : '')) + (sm.chi ? ' da ' + esc(sm.chi) : '') + (quando ? ' alle ' + quando : '') + '</div>' +
          '<button class="btn btn-sm" data-action="annulla-somm" data-id="' + sm.id + '">Correggi</button></div>';
      }
      const s2 = scorta(f);
      return '<div class="dose"><div class="testa"><div style="flex:1"><div class="nome">' + esc(f.nome) + '</div><div class="quanto">' + esc(quanto) + '</div>' +
        (f.note ? '<div class="quanto">' + esc(f.note) + '</div>' : '') + (s2.finito ? '<div class="quanto t-rust">Scorta finita secondo l\'app</div>' : '') + '</div></div>' +
        '<div class="bottoni"><button class="btn btn-primary" data-action="dato" data-f="' + f.id + '" data-d="' + data + '" data-ora="' + ora + '">' + ic('check', 21, 2.6) + ' Dato</button>' +
        '<a class="btn" href="#/nondato?f=' + f.id + '&d=' + data + '&o=' + ora.replace(':', '') + '">Non dato</a></div></div>';
    }).join('');
  }
  return h + '</main>' + barra('oggi');
}
function nuovaSomm(f, data, ora, esito, motivo) {
  return { id: smId(f, data, ora), farmacoId: f.id, ospiteId: f.ospiteId, data, ora, esito, motivo: motivo || null, chi: utente(), quando: adesso(), qta: esito === 'dato' ? Number(f.qta) || 0 : 0, creato: adesso() };
}
async function dopoSomm(data, ora) {
  const s = slotDel(data).find(x => x.ora === ora);
  if (s && !s.mancano) chiudiSlot(data + 'T' + ora);
  dopoModifica();
}

function vRegistroTerapia(q) {
  const filtro = q.get('ospite');
  const giorni = Math.min(90, parseInt(q.get('giorni'), 10) || 14);
  const o = ospite(filtro);
  let h = testata('Registro della terapia', { indietro: true, sub: (o ? o.nome + ' · ' : '') + 'ultimi ' + giorni + ' giorni' }) + '<main class="pad">';
  if (!o) h += '<div class="seg">' + '<a class="on" href="#/registro-terapia">Tutti</a>' + ospitiAttivi().map(x => '<a href="#/registro-terapia?ospite=' + x.id + '">' + esc(x.nome.split(' ')[0]) + '</a>').join('') + '</div>';
  for (let i = 0; i < giorni; i++) {
    const d = piuGiorni(oggi(), -i);
    const slots = slotDel(d, filtro || undefined);
    const bisogno = S.somministrazioni.filter(x => x.bisogno && x.data === d && (!filtro || x.ospiteId === filtro));
    if (!slots.length && !bisogno.length) continue;
    h += '<div class="giorno-testa">' + esc(fmtGiorno(d)) + '</div><div class="group">';
    for (const s of slots) {
      const nd = s.dosi.filter(x => x.sm && x.sm.esito === 'nondato');
      const mancano = s.mancano && (d < oggi() || s.ora <= oraAdesso());
      const chi = [...new Set(s.dosi.filter(x => x.sm).map(x => x.sm.chi).filter(Boolean))].join(', ');
      h += '<a class="gi" href="#/giro/' + d + '/' + s.ora.replace(':', '') + (filtro ? '?ospite=' + filtro : '') + '"><span class="dicon ' + (mancano ? 'rust' : nd.length ? 'amber' : '') + '">' + ic(mancano ? 'warn' : 'check', 20) + '</span>' +
        '<span class="row-main"><span class="row-title">Ore ' + fmtOra(s.ora) + ' · ' + s.dati + ' su ' + s.dosi.length + ' date</span><span class="row-meta">' +
        esc((mancano ? s.mancano + ' non segnate · ' : '') + (nd.length ? nd.map(x => x.f.nome + ' (' + (x.sm.motivo || 'non dato').toLowerCase() + ')').join(', ') + ' · ' : '') + (chi ? 'segnato da ' + chi : '')) + '</span></span>' + ic('chev', 20) + '</a>';
    }
    h += bisogno.map(x => '<div class="gi" style="cursor:default"><span class="dicon plum">' + ic('pill', 20) + '</span><span class="row-main"><span class="row-title">Al bisogno · ore ' + fmtOra(x.ora) + '</span><span class="row-meta">' + esc(((farmaco(x.farmacoId) || {}).nome || '') + (filtro ? '' : ' · ' + ((ospite(x.ospiteId) || {}).nome || '')) + (x.chi ? ' · ' + x.chi : '')) + '</span></span></div>').join('');
    h += '</div>';
  }
  if (giorni < 90) h += '<a class="btn btn-sm" style="margin-top:12px" href="#/registro-terapia?giorni=' + (giorni === 14 ? 30 : 90) + (filtro ? '&ospite=' + filtro : '') + '">Mostra più giorni</a>';
  return h + '</main>' + barra('ospiti');
}

function grafico(serie, colori) {
  const W = 340, H = 170, P = 30;
  const tutti = serie.flatMap(s => s.punti.map(p => p.y));
  if (tutti.length < 2) return '';
  let min = Math.min(...tutti), max = Math.max(...tutti);
  if (max - min < 1) { max += 1; min -= 1; }
  const marg = (max - min) * .15;
  min -= marg; max += marg;
  const n = Math.max(...serie.map(s => s.punti.length));
  const x = i => P + (n === 1 ? 0 : i * (W - P - 10) / (n - 1));
  const y = v => H - 20 - (v - min) * (H - 40) / (max - min);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Andamento">';
  for (let k = 0; k <= 2; k++) {
    const v = min + (max - min) * k / 2;
    svg += '<line x1="' + P + '" x2="' + (W - 6) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E4DED3"/><text x="2" y="' + (y(v) + 4) + '" font-size="11" fill="#5E655F">' + Math.round(v) + '</text>';
  }
  serie.forEach((s, j) => {
    const pts = s.punti.map((p, i) => x(i) + ',' + y(p.y)).join(' ');
    svg += '<polyline points="' + pts + '" fill="none" stroke="' + colori[j] + '" stroke-width="2.5" stroke-linejoin="round"/>';
    s.punti.forEach((p, i) => { svg += '<circle cx="' + x(i) + '" cy="' + y(p.y) + '" r="3.5" fill="' + colori[j] + '"/>'; });
  });
  const pr = serie[0].punti;
  svg += '<text x="' + P + '" y="' + (H - 4) + '" font-size="11" fill="#5E655F">' + esc(fmt(pr[0].d)) + '</text><text x="' + (W - 6) + '" y="' + (H - 4) + '" font-size="11" fill="#5E655F" text-anchor="end">' + esc(fmt(pr[pr.length - 1].d)) + '</text>';
  return '<div class="grafico">' + svg + '</svg>' + (serie.length > 1 ? '<div class="hint" style="padding:0 6px 6px">' + serie.map((s, j) => '<span style="color:' + colori[j] + ';font-weight:800">●</span> ' + esc(s.nome)).join('  ') + '</div>' : '') + '</div>';
}
function vParametro(ospiteId, tipo) {

      : [{ nome: p.nome, punti: ultimi.map((x, i) => ({ d: x.data, y: vals[i][0] })).filter(z => z.y != null) }];
    h += grafico(serie.filter(s => s.punti.length >= 2), ['#245A52', '#D07A50']);

  return h + '</main>' + barra('ospiti');
}

function riassuntoServizio(sv) {
  const voci = vociServizio(sv.id);
  const rit = voci.filter(v => stato(v) === 'ritardo').length;
  switch (sv.tipo) {
    case 'pagamenti': {
      const p = attive().filter(ePagamento);
      const r = p.filter(v => stato(v) === 'ritardo' && !v.domiciliato).length;
      const prossimi = p.filter(v => !v.domiciliato && giorniTra(oggi(), v.prossima) <= 30).length;
      return { urgente: r > 0, testo: r ? plur(r, 'in ritardo', 'in ritardo') : prossimi ? prossimi + ' da pagare entro 30 giorni' : 'niente in scadenza' };
    }
    case 'spesa': {
      const n = S.lista.filter(x => x.servizio === sv.id && !x.preso).length;
      return { testo: n ? plur(n, 'cosa da comprare', 'cose da comprare') : 'lista vuota' };
    }
    case 'lavanderia': {
      const n = lavanderiaFuori().filter(e => e.servizio === sv.id).length;
      return { testo: n ? plur(n, 'consegna fuori', 'consegne fuori') : 'niente fuori' };
    }
    case 'rifiuti': {
      const r = rifiutiStasera();
      return { testo: r.length ? 'stasera: ' + r.join(', ').toLowerCase() : 'stasera niente' };
    }
    case 'manutenzioni': {
      const n = guastiAperti().filter(e => e.servizio === sv.id).length;
      return { urgente: rit > 0, testo: n ? plur(n, 'guasto da sistemare', 'guasti da sistemare') : rit ? 'controllo in ritardo' : 'tutto a posto' };
    }
    case 'trasporti': {
      const p = prossimiAccompagnamenti()[0];
      return { testo: p ? 'prossimo ' + fmt(p.data) : 'nessuno in programma' };
    }
    case 'farmacia': {
      const n = farmaciDaControllare().length;
      return { urgente: farmaciDaControllare().some(x => x.s.finito || x.s.scad === 'scaduto'), testo: n ? plur(n, 'da ordinare o controllare', 'da ordinare o controllare') : 'scorte a posto' };
    }
  }
  const ult = S.eventi.filter(e => sid(e.servizio) === sv.id).sort(recenti)[0];
  return { urgente: rit > 0, testo: rit ? 'in ritardo' : voci[0] ? 'prossima ' + fmt(voci[0].prossima) : ult ? 'ultima ' + fmt(ult.data) : 'tocca per segnare' };
}

async function spostaServizio(id, dir) {
  const lista = serviziOrdinati();
  const i = lista.findIndex(s => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  for (let k = 0; k < lista.length; k++) if (lista[k].ordine !== k + 1) { lista[k].ordine = k + 1; await salva('servizi', lista[k]); }
  render();
}

function vPagamenti(sv, q) {
  const cat = q.get('cat') || '';
  const tutti = attive().filter(ePagamento).filter(v => !cat || (v.pag || 'Altro') === cat).sort(perData);
  const manuali = tutti.filter(v => !v.domiciliato);
  const rit = manuali.filter(v => v.prossima < oggi());
  const presto = manuali.filter(v => v.prossima >= oggi() && giorniTra(oggi(), v.prossima) <= 30);
  const dopo = manuali.filter(v => giorniTra(oggi(), v.prossima) > 30);
  const dom = tutti.filter(v => v.domiciliato);
  const totale = presto.concat(rit).reduce((a, v) => a + (v.importo || 0), 0);
  const cats = [...new Set(attive().filter(ePagamento).map(v => v.pag || 'Altro'))].sort();
  let h = testaServizio(sv, rit.length ? plur(rit.length, 'pagamento in ritardo', 'pagamenti in ritardo') : presto.length ? presto.length + ' da pagare entro 30 giorni' + (totale ? ' · ' + euro(totale) : '') : 'Niente da pagare a breve') + '<main class="pad">';
  h += '<a class="btn btn-primary" href="#/avviso-pagamento">' + ic('plus', 21) + ' È arrivato un avviso di pagamento</a>' +
    '<a class="btn btn-sm" href="#/nuova-voce?servizio=' + sv.id + '&pag=1">' + ic('cal', 20) + ' Pagamento che si ripete (assicurazione, quote…)</a>';
  if (cats.length > 1) h += '<div class="seg" style="margin-top:6px"><a class="' + (cat ? '' : 'on') + '" href="#/servizio/' + sv.id + '">Tutti</a>' + cats.map(c => '<a class="' + (c === cat ? 'on' : '') + '" href="#/servizio/' + sv.id + '?cat=' + encodeURIComponent(c) + '">' + esc(c) + '</a>').join('') + '</div>';
  if (rit.length) h += sezione('In ritardo', rit.length, 'rust') + rit.map(v => rigaVoce(v)).join('');
  h += sezione('Da pagare entro 30 giorni', presto.length) + (presto.length ? presto.map(v => rigaVoce(v)).join('') : '<p class="empty">Niente.</p>');
  if (dopo.length) h += sezione('Più avanti', dopo.length) + dopo.map(v => rigaVoce(v)).join('');
  if (dom.length) h += sezione('Si pagano da soli', dom.length) + '<p class="hint" style="margin:0 2px">Addebito in banca: non vanno pagati a mano. Basta controllare che l\'addebito ci sia.</p>' + dom.map(v => rigaVoce(v)).join('');
  const pagati = S.eventi.filter(e => e.tipo === 'pagato').sort(recenti);

  h += '<a class="btn btn-sm" href="#/fatto?servizio=' + sv.id + '">' + ic('plus', 20) + ' Aggiungi un pagamento già fatto</a>';
  return h + '</main>' + barra('servizi');
}

/* ---------- spesa */
function vSpesa(sv) {
  const lista = S.lista.filter(x => x.servizio === sv.id);
  const daPrendere = lista.filter(x => !x.preso).sort((a, b) => (a.creato || '').localeCompare(b.creato || ''));
  const presi = lista.filter(x => x.preso);
  const nomi = new Set(lista.map(x => semplifica(x.testo)));
  const conta = {};
  S.eventi.filter(e => e.tipo === 'spesa' && Array.isArray(e.articoli)).forEach(e => e.articoli.forEach(a => { const k = String(a).trim(); if (k && !nomi.has(semplifica(k))) conta[k] = (conta[k] || 0) + 1; }));
  const suggeriti = Object.keys(conta).sort((a, b) => conta[b] - conta[a]).slice(0, 10);
  let h = testaServizio(sv, daPrendere.length ? plur(daPrendere.length, 'cosa da comprare', 'cose da comprare') : 'La lista è vuota') + '<main class="pad">';
  h += '<form data-form="lista-add" data-servizio="' + sv.id + '" novalidate class="two"><input type="text" name="testo" id="f-testo" placeholder="Cosa serve? es. latte, 2 kg mele" maxlength="80" autocomplete="off" aria-label="Cosa serve"><button class="btn btn-primary" type="submit" style="flex:none;width:auto">' + ic('plus', 22) + '</button></form>';
  if (suggeriti.length) h += '<div class="chips">' + suggeriti.map(s => '<button class="txt-btn" style="color:var(--ink)" data-action="lista-sugg" data-servizio="' + sv.id + '" data-t="' + esc(s) + '">+ ' + esc(s) + '</button>').join('') + '</div>';
  const riga = x => '<div class="row ' + (x.preso ? 'row-done' : '') + '"><button class="check ' + (x.preso ? 'on' : '') + '" data-action="lista-toggle" data-id="' + x.id + '" aria-label="' + (x.preso ? 'Non ancora preso: ' : 'Preso: ') + esc(x.testo) + '">' + ic('check', 22, 2.6) + '</button>' +
    '<span class="row-main"><span class="row-title" style="' + (x.preso ? 'text-decoration:line-through' : '') + '">' + esc(x.testo) + '</span>' + (x.chi ? '<span class="row-meta">aggiunto da ' + esc(x.chi) + '</span>' : '') + '</span>' +
    '<button class="icon-btn" data-action="lista-del" data-id="' + x.id + '" aria-label="Togli ' + esc(x.testo) + '">' + ic('x', 18) + '</button></div>';
  h += sezione('Da comprare', daPrendere.length) + (daPrendere.length ? daPrendere.map(riga).join('') : '<p class="empty">Niente. Scrivi qui sopra quello che manca: lo vedono tutti.</p>');
  if (presi.length) h += sezione('Già nel carrello', presi.length, 'green') + presi.map(riga).join('') +
    '<a class="btn btn-primary" href="#/spesa-fatta?servizio=' + sv.id + '">' + ic('check', 21, 2.6) + ' Spesa fatta</a>';
  h += scadenzeServizio(sv, 'Spesa fissa (es. ogni settimana)') + storicoServizio(sv, 6);
  return h + '</main>' + barra('servizi');
}

function numeroWhatsApp(t) {

}

/* ========================================================== Diario */

function testoEvento(e) {
  const v = e.voceId ? voce(e.voceId) : null;
  const sv = servizio(e.servizio);
  const o = ospite(e.ospiteId);
  const chi = e.chi ? e.chi : '';
  switch (e.tipo) {
    case 'nota': return { icona: 'note', titolo: e.testo || '', meta: [chi, o ? o.nome : null].filter(Boolean).join(' · '), f: 'note', href: '#/nota?id=' + e.id, lungo: true };
    case 'spesa': return { icona: 'cart', titolo: 'Spesa' + (e.articoli && e.articoli.length ? ': ' + e.articoli.join(', ') : ''), meta: [chi, e.importo != null ? euro(e.importo) : null, e.nota].filter(Boolean).join(' · '), f: 'servizi' };
    case 'lavanderia': return { icona: 'shirt', titolo: 'Lavanderia: ' + descCapi(e), meta: [chi, o ? o.nome : 'della casa', e.fuori ? (e.rientrato ? 'rientrato ' + fmt(e.rientrato) : 'ancora fuori') : 'lavato in casa'].filter(Boolean).join(' · '), f: 'servizi' };
    case 'pulizia': return { icona: 'spark', titolo: 'Pulizie: ' + (e.zona || ''), meta: chi, f: 'servizi' };
    case 'rifiuti': return { icona: 'trash', titolo: 'Rifiuti fuori' + (e.nota ? ': ' + e.nota : ''), meta: chi, f: 'servizi' };
    case 'guasto': return { icona: 'tool', titolo: 'Guasto: ' + e.cosa, meta: [STATI_GUASTO[e.stato], e.dove, chi, e.importo != null ? euro(e.importo) : null].filter(Boolean).join(' · '), f: 'servizi', href: '#/guasto?id=' + e.id };
    case 'trasporto': return { icona: 'car', titolo: 'Accompagnamento: ' + (e.dove || ''), meta: [o ? o.nome : null, e.accompagna, e.fatto ? 'fatto' : 'in programma'].filter(Boolean).join(' · '), f: 'servizi', href: '#/trasporto?id=' + e.id };
    case 'farmacia': return { icona: 'pill', titolo: e.nota || 'Farmacia', meta: chi, f: 'terapia' };
  }
  const pag = e.tipo === 'pagato';
  const titolo = v ? v.nome : e.nota && (!sv || pag) ? e.nota : (sv ? sv.nome : 'Attività') + (e.nota && sv ? ': ' + e.nota : '');
  return { icona: pag ? 'bolt' : 'check', titolo, meta: [(pag ? 'Pagato' : 'Fatto') + (chi ? ' da ' + chi : ''), e.importo != null ? euro(e.importo) : null, v && e.nota ? e.nota : null, o ? o.nome : null].filter(Boolean).join(' · '),
    f: pag ? 'pagamenti' : 'servizi', href: v ? '#/voce/' + v.id : null };
}
function rigaDiario(it, gruppo) {
  const cerca = semplifica(it.titolo + ' ' + it.meta + ' ' + (it.extra || ''));
  const dentro = '<span class="dicon ' + (it.cls || '') + '">' + ic(it.icona, 20) + '</span><span class="row-main"><span class="row-title" style="' + (it.lungo ? 'white-space:pre-wrap;font-weight:500' : '') + '">' + esc(it.titolo) + '</span>' +
    '<span class="row-meta">' + esc((it.ora ? fmtOra(it.ora) + ' · ' : '') + it.meta) + '</span></span>';
  const attr = ' data-cerca="' + esc(cerca) + '"' + (gruppo ? ' data-in="' + gruppo + '"' : '');
  return it.href ? '<a class="row"' + attr + ' href="' + it.href + '">' + dentro + ic('chev', 20) + '</a>' : '<div class="row"' + attr + '>' + dentro + '</div>';
}
function rigaDiarioEvento(e) {
  const t = testoEvento(e);
  return rigaDiario(Object.assign(t, { ora: e.ora, meta: (giorniTra(e.data, oggi()) ? fmt(e.data) + ' · ' : '') + t.meta }));
}

function vociDiario(filtroOspite, filtroServizio) {
  const out = [];
  for (const e of S.eventi) {
    if (e.tipo === 'trasporto' && !e.fatto) continue;
    if (filtroOspite && e.ospiteId !== filtroOspite) continue;
    if (filtroServizio && sid(e.servizio) !== filtroServizio) continue;
    out.push(Object.assign(testoEvento(e), { data: e.data, ora: e.ora, ord: (e.data || '') + (e.ora || '') + (e.creato || '') }));
  }
  if (filtroServizio) return out;
  // terapia: una riga per ogni orario, non una per farmaco
  const slot = new Map();
  for (const x of S.somministrazioni) {
    if (filtroOspite && x.ospiteId !== filtroOspite) continue;
    if (x.bisogno) {
      const f = farmaco(x.farmacoId), o = ospite(x.ospiteId);
      out.push({ icona: 'pill', titolo: 'Al bisogno: ' + (f ? f.nome : 'farmaco'), meta: [o ? o.nome : null, x.chi].filter(Boolean).join(' · '), f: 'terapia', data: x.data, ora: x.ora, ord: x.data + x.ora, cls: 'plum' });
      continue;
    }
    const k = x.data + 'T' + x.ora;
    if (!slot.has(k)) slot.set(k, []);
    slot.get(k).push(x);
  }
  for (const [k, xs] of slot) {
    const [d, ora] = k.split('T');
    const nd = xs.filter(x => x.esito === 'nondato');
    const chi = [...new Set(xs.map(x => x.chi).filter(Boolean))].join(', ');
    const nomi = nd.map(x => ((farmaco(x.farmacoId) || {}).nome || '') + (filtroOspite ? '' : ' a ' + ((ospite(x.ospiteId) || {}).nome || '')) + ' (' + (x.motivo || '').toLowerCase() + ')');
    out.push({ icona: 'pill', cls: nd.length ? 'amber' : 'plum', titolo: 'Terapia delle ' + fmtOra(ora) + ': ' + plur(xs.length - nd.length, 'farmaco dato', 'farmaci dati') + (nd.length ? ', ' + nd.length + ' non ' + (nd.length === 1 ? 'dato' : 'dati') : ''),
      meta: (nomi.length ? nomi.join(', ') + ' · ' : '') + (chi ? 'segnato da ' + chi : ''), extra: xs.map(x => (farmaco(x.farmacoId) || {}).nome + ' ' + ((ospite(x.ospiteId) || {}).nome || '')).join(' '),
      f: 'terapia', data: d, ora, ord: d + ora, href: '#/giro/' + d + '/' + ora.replace(':', '') + (filtroOspite ? '?ospite=' + filtroOspite : '') });
  }
  for (const v of S.visite) {
    if (v.stato !== 'fatta' || (filtroOspite && v.ospiteId !== filtroOspite)) continue;
    const o = ospite(v.ospiteId);
    out.push({ icona: 'steth', titolo: 'Visita: ' + (v.tipo || '') + (o && !filtroOspite ? ' — ' + o.nome : ''), meta: (v.esito || '') + (v.fattaChi ? ' · ' + v.fattaChi : ''), f: 'salute', data: v.data, ora: v.ora, ord: v.data + (v.ora || ''), href: '#/visita/' + v.id });
  }
  for (const p of S.parametri) {
    if (filtroOspite && p.ospiteId !== filtroOspite) continue;
    const o = ospite(p.ospiteId), par = parametro(p.tipo);
    out.push({ icona: 'heart', titolo: par.nome + ' ' + p.valore + ' ' + par.u + (o && !filtroOspite ? ' — ' + o.nome : ''), meta: [p.chi, p.nota].filter(Boolean).join(' · '), f: 'salute', data: p.data, ora: p.ora, ord: p.data + (p.ora || ''), href: '#/parametro/' + p.ospiteId + '/' + encodeURIComponent(p.tipo) });
  }
  return out;
}

const FILTRI_DIARIO = [['', 'Tutto'], ['note', 'Note'], ['terapia', 'Terapia'], ['salute', 'Visite e misure'], ['pagamenti', 'Pagamenti'], ['servizi', 'Casa']];
function vDiario(q) {
  const f = q.get('f') || '';
  const filtroOspite = q.get('ospite') || '';
  const filtroServizio = q.get('servizio') || '';
  const o = ospite(filtroOspite), sv = servizio(filtroServizio);
  const base = '#/diario?' + (filtroOspite ? 'ospite=' + filtroOspite + '&' : '') + (filtroServizio ? 'servizio=' + filtroServizio + '&' : '');
  let items = vociDiario(filtroOspite, sv ? sv.id : '').filter(x => !f || x.f === f).filter(x => x.data && x.data <= piuGiorni(oggi(), 1));
  items.sort((a, b) => (b.ord || '').localeCompare(a.ord || ''));
  const troppi = items.length > 1500;
  items = items.slice(0, 1500);
  const destra = '<a class="icon-btn primary" href="#/nota' + (filtroOspite ? '?ospite=' + filtroOspite : '') + '" aria-label="Scrivi una nota">' + ic('plus') + '</a>';
  let h = testata(o ? 'Diario di ' + o.nome : sv ? sv.nome + ': diario' : 'Diario', { sub: 'Cosa è stato fatto e cosa è successo', destra, indietro: !!(o || sv) }) + '<main class="pad">';
  h += '<a class="btn btn-primary" href="#/nota' + (filtroOspite ? '?ospite=' + filtroOspite : '') + '">' + ic('edit', 21) + ' Scrivi nel diario</a>';
  h += ricercaBox('Cerca: una parola, un nome, una cosa');
  if (!sv) h += '<div class="seg">' + FILTRI_DIARIO.map(([k, l]) => '<a class="' + (k === f ? 'on' : '') + '" href="' + base + (k ? 'f=' + k : '') + '">' + l + '</a>').join('') + '</div>';
  let giorno = '', n = 0;
  for (const it of items) {
    if (it.data !== giorno) { if (giorno) h += '</div>'; giorno = it.data; n++; h += '<div data-gruppo="g' + n + '"><div class="giorno-testa">' + esc(fmtGiorno(giorno)) + '</div>'; }
    h += rigaDiario(it, 'g' + n);
  }
  if (giorno) h += '</div>';
  if (!items.length) h += '<p class="empty">Ancora niente qui. Quando segnate qualcosa, compare nel diario.</p>';
  h += '<p class="empty hidden" id="nessun-risultato">Nessun risultato. Prova con un\'altra parola.</p>';
  if (troppi) h += '<p class="hint">Sono mostrate le 1500 cose più recenti.</p>';
  return h + '</main>' + barra('diario');
}

async function esportaCopia() {
  avvisa('Preparo la copia…');
  const contenuto = { app: 'kenosis', formato: 2, versione: VERSIONE, creato: adesso(), da: utente() };
  for (const s of STORES_CONDIVISI) {
    if (s === 'documenti') {
      contenuto.documenti = [];
      for (const d of S.documenti) {
        const copia = Object.assign({}, d);
        delete copia.blob;
        copia.b64 = d.blob ? await blobInBase64(d.blob) : null;
        contenuto.documenti.push(copia);
      }
    } else contenuto[s] = S[s];
  }
  const blob = new Blob([JSON.stringify(contenuto)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kenosis-copia-' + oggi() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  await setKV('ultimoBackup', oggi());
  avvisa('Copia salvata nei Download');
  render();
}
async function importaCopia(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { avvisa('Questo file non è una copia valida'); return; }
  if (!j || j.app !== 'kenosis') { avvisa('Questo file non è una copia di Kenosis'); return; }
  const quando = j.creato ? fmtLungo(j.creato.slice(0, 10)) : 'data sconosciuta';
  if (!confirm('Ripristinare la copia del ' + quando + '? I dati attuali su questo telefono verranno sostituiti.' +
    (collegato() ? '\n\nIl dispositivo è collegato: la copia sostituirà i dati anche sugli ALTRI dispositivi.' : ''))) return;
  const prima = {};
  for (const s of STORES_CONDIVISI) prima[s] = S[s].map(x => x.id);
  for (const s of STORES_CONDIVISI) await DB.clear(s);
  for (const s of STORES_CONDIVISI) {
    if (s === 'documenti') continue;
    for (const o of (j[s] || [])) await DB.put(s, o);
  }
  for (const d of (j.documenti || [])) {
    const copia = Object.assign({}, d);
    const b64 = copia.b64;
    delete copia.b64;
    copia.blob = b64 ? await base64InBlob(b64) : null;
    await DB.put('documenti', copia);
  }
  if (!(j.servizi || []).length) { await DB.del('kv', 'seminato'); }
  await carica();
  if (collegato()) {
    const t = adesso();
    for (const st of STORES_CONDIVISI) {
      for (const o of S[st]) {
        o.agg = t;
        if (st === 'documenti') { delete o.fileSu; delete o.fileGrande; }
        await DB.put(st, o);
      }
      const ora = new Set(S[st].map(x => x.id));
      for (const id of prima[st]) if (!ora.has(id)) await DB.put('coda', { id: st + ':' + id, s: st, rid: id, x: true, t, n: uid() });
    }
    await accodaTutto();
    programmaSync(500);
  }
  dopoModifica();
  avvisa('Copia ripristinata');
  vai('#/oggi', true);
}

async function hashPin(pin, sale) {
  const dati = new TextEncoder().encode(sale + ':' + pin);
  const h = await crypto.subtle.digest('SHA-256', dati);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
