/* ============================================== copia di sicurezza */

async function esportaCopia() {
  avvisa('Preparo la copia…');
  const contenuto = { app: 'kenosis', formato: 2, versione: VERSIONE, creato: adesso(), da: utente() };
  for (const s of STORES_CONDIVISI) {
    if (s === 'documenti') {
      contenuto.documenti = [];
      for (const d of S.documenti) {
        const copia = Object.assign({}, d);
        delete copia.blob;
        copia.b64 = d.blob ? await blobInBase64(d.blob) : null;
        contenuto.documenti.push(copia);
      }
    } else contenuto[s] = S[s];
  }
  const nome = 'kenosis-copia-' + oggi() + '.json';
  const blob = new Blob([JSON.stringify(contenuto)], { type: 'application/json' });
  // Sul telefono si usa "Condividi → Salva su File": così si sa se la copia è stata salvata davvero.
  try {
    const file = new File([blob], nome, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Copia di sicurezza Kenosis' });
      await setKV('ultimoBackup', oggi());
      avvisa('Copia salvata');
      render();
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') { avvisa('Copia non salvata'); return; }
    /* altrimenti si scarica come file, qui sotto */
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  // l'app non può sapere se il file è stato salvato: lo chiede, invece di darlo per fatto
  if (await conferma('Hai trovato il file?', 'Si chiama «' + nome + '» e dovrebbe essere nella cartella Download. Portane una copia sul PC della comunità.', 'Sì, c\'è', { no: 'No, non lo trovo' })) {
    await setKV('ultimoBackup', oggi());
    avvisa('Bene: copia fatta');
  } else avvisa('Riprova, o chiedi a Vincenzo');
  render();
}
async function importaCopia(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { avvisa('Questo file non è una copia valida'); return; }
  if (!j || j.app !== 'kenosis') { avvisa('Questo file non è una copia di Kenosis'); return; }
  // Prima si controlla e si prepara tutto: se qualcosa non va, i dati attuali restano intatti.
  const nuovi = {};
  try {
    for (const s of STORES_CONDIVISI) {
      if (j[s] != null && !Array.isArray(j[s])) throw new Error('formato');
      if (s === 'documenti') {
        nuovi.documenti = [];
        for (const d of (j.documenti || [])) {
          const copia = Object.assign({}, d);
          const b64 = copia.b64;
          delete copia.b64;
          copia.blob = b64 ? await base64InBlob(b64) : null;
          nuovi.documenti.push(copia);
        }
      } else nuovi[s] = (j[s] || []).filter(o => o && o.id);
    }
  } catch (e) { avvisa('La copia è rovinata: non ho cambiato niente'); return; }
  const quando = j.creato ? fmtLungo(giornoDi(j.creato)) : 'data sconosciuta';
  const n = STORES_CONDIVISI.reduce((a, s) => a + nuovi[s].length, 0);
  if (!(await conferma('Ripristinare la copia del ' + quando + '?', 'Contiene ' + n + ' elementi. I dati attuali su questo telefono verranno sostituiti.' +
    (collegato() ? '\n\nATTENZIONE: il telefono è collegato, quindi la copia sostituirà i dati anche sugli ALTRI telefoni. Quello che è stato segnato dopo il ' + quando + ' andrà perso.' : ''), 'Sì, ripristina', { pericolo: true }))) return;
  const prima = {};
  for (const s of STORES_CONDIVISI) prima[s] = S[s].slice();
  const scrivi = async dati => {
    for (const s of STORES_CONDIVISI) await DB.clear(s);
    for (const s of STORES_CONDIVISI) for (const o of dati[s]) await DB.put(s, o);
  };
  try { await scrivi(nuovi); }
  catch (e) {
    // memoria piena o altro errore a metà: si rimettono i dati di prima
    try { await scrivi(prima); } catch (e2) { /* restano quelli in memoria fino alla chiusura */ }
    await carica();
    avvisa('Ripristino non riuscito: ho rimesso i dati di prima');
    render();
    return;
  }
  if (!nuovi.servizi.length) { await DB.del('kv', 'seminato'); }
  await carica();
  if (collegato()) {
    const t = adesso();
    for (const st of STORES_CONDIVISI) {
      for (const o of S[st]) {
        o.agg = t;
        if (st === 'documenti') { delete o.fileSu; delete o.fileGrande; }
        await DB.put(st, o);
      }
      const ora = new Set(S[st].map(x => x.id));
      for (const o of prima[st]) if (!ora.has(o.id)) await DB.put('coda', { id: st + ':' + o.id, s: st, rid: o.id, x: true, t, n: uid() });
    }
    await accodaTutto();
    programmaSync(500);
  }
  dopoModifica();
  avvisa('Copia ripristinata');
  vai('#/oggi', true);
}

async function hashPin(pin, sale) {
  const dati = new TextEncoder().encode(sale + ':' + pin);
  const h = await crypto.subtle.digest('SHA-256', dati);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ================================================ sincronizzazione */
// Ogni record e ogni file vengono cifrati QUI, sul dispositivo, con una chiave
// che nasce dalla password e non esce mai. Il servizio online vede solo testo
// illeggibile, più i giorni in cui mandare il promemoria (senza dire cosa).

const SY = { inCorso: false, stato: '', errore: '', inCoda: 0, push: null, timer: null, ancora: false, scaricando: new Set() };
const MAX_FILE_SYNC = 1400 * 1024;
const INDIRIZZO_SERVIZIO = 'https://kenosis-sync.cs-effata.workers.dev';   // già scritto, basta la password
const conn = () => S.kv.sync || null;
const collegato = () => !!(S.kv.sync && S.kv.syncChiave && S.kv.syncToken);

function inB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function daB64(t) {
  const s = atob(t);
  const b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
function daB64url(t) { return daB64(t.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((t.length + 3) % 4)); }

const CIFRA = {
  hex(b) { return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); },
  async deriva(password, sale) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
    const par = uso => ({ name: 'PBKDF2', salt: enc.encode(sale + '|' + uso), iterations: 310000, hash: 'SHA-256' });
    const chiave = await crypto.subtle.deriveKey(par('cifratura'), base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const token = CIFRA.hex(await crypto.subtle.deriveBits(par('accesso'), base, 256));
    return { chiave, token };
  },
  async bytes(chiave, dati, id) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(id) }, chiave, dati));
    const out = new Uint8Array(12 + c.length);
    out.set(iv);
    out.set(c, 12);
    return inB64(out);
  },
  async apriBytes(chiave, testo, id) {
    const b = daB64(testo);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12), additionalData: new TextEncoder().encode(id) }, chiave, b.subarray(12)));
  },
  oggetto(chiave, obj, id) { return CIFRA.bytes(chiave, new TextEncoder().encode(JSON.stringify(obj)), id); },
  async apriOggetto(chiave, testo, id) { return JSON.parse(new TextDecoder().decode(await CIFRA.apriBytes(chiave, testo, id))); }
};

async function api(metodo, percorso, corpo, opz = {}) {
  const base = opz.url || (conn() && conn().url);
  const h = {};
  const token = opz.senzaToken ? null : (opz.token || S.kv.syncToken);
  if (token) h['X-Kenosis-Token'] = token;
  let body;
  if (corpo !== undefined) {
    if (opz.testo) { h['Content-Type'] = 'text/plain'; body = corpo; }
    else { h['Content-Type'] = 'application/json'; body = JSON.stringify(corpo); }
  }
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), opz.attesa || 30000);
  let r;
  try { r = await fetch(base + percorso, { method: metodo, headers: h, body, signal: ctrl.signal, cache: 'no-store' }); }
  finally { clearTimeout(t); }
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return opz.testo || opz.rispostaTesto ? r.text() : r.json();
}

async function contaCoda() { SY.inCoda = collegato() ? (await DB.all('coda')).length : 0; }

async function mettiInCoda(store, id, cancellato) {
  if (!STORES_CONDIVISI.includes(store) || !collegato()) return;
  // Per una cancellazione conta il momento in cui è stata fatta, non quello in cui parte.
  await DB.put('coda', { id: store + ':' + id, s: store, rid: id, x: !!cancellato, t: adesso(), n: uid() });
  await contaCoda();
  aggiornaStatoSync();
  programmaSync(800);
}

async function accodaTutto() {
  for (const s of STORES_CONDIVISI) for (const o of S[s]) await DB.put('coda', { id: s + ':' + o.id, s, rid: o.id, x: false, n: uid() });
  await contaCoda();
}

function programmaSync(ms) {
  if (!collegato()) return;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(sincronizza, ms);
}

function perInvio(store, o) {
  const c = Object.assign({}, o);
  if (store === 'documenti') { c.haFile = !!(o.blob || o.fileSu); delete c.blob; }
  return c;
}

// I file partono dopo i dati e uno alla volta: se uno non passa (rete debole, file grosso)
// non blocca più il resto, e le medicine segnate arrivano comunque agli altri telefoni.
async function caricaFileMancanti() {
  let falliti = 0;
  for (const d of S.documenti.slice()) {
    if (!d.blob || d.fileSu || d.fileGrande) continue;
    if (d.blob.size > MAX_FILE_SYNC) { d.fileGrande = true; await salva('documenti', d); continue; }
    try {
      const testo = await CIFRA.bytes(S.kv.syncChiave, new Uint8Array(await d.blob.arrayBuffer()), 'file:' + d.id);
      await api('PUT', '/api/file/' + d.id, testo, { testo: true, attesa: 120000 });
      d.fileSu = true;
      await salva('documenti', d);
    } catch (e) { falliti++; }
  }
  SY.fileInAttesa = falliti;
}

async function applicaRemoto(rec) {
  let p;
  try { p = await CIFRA.apriOggetto(S.kv.syncChiave, rec.dati, rec.id); } catch (e) { return false; }
  const store = p.s;
  if (!STORES_CONDIVISI.includes(store)) return false;
  const inCoda = await DB.get('coda', store + ':' + rec.id);
  const loc = S[store].find(x => x.id === rec.id);
  if (p.x) {
    if (!loc) { if (inCoda) await DB.del('coda', inCoda.id); return false; }
    if (inCoda && !inCoda.x && (loc.agg || '') > (p.agg || '')) return false;
    await togli(store, rec.id, { remoto: true });
    if (inCoda) await DB.del('coda', inCoda.id);
    return true;
  }
  const o = p.o;
  if (!o || o.id !== rec.id) return false;
  if (loc && (loc.agg || '') >= (o.agg || '')) {
    if ((loc.agg || '') > (o.agg || '') && !inCoda) await mettiInCoda(store, loc.id, false);
    return false;
  }
  if (store === 'documenti' && loc && loc.blob) o.blob = loc.blob;
  await salva(store, o, { remoto: true });
  if (inCoda) await DB.del('coda', inCoda.id);
  return true;
}

async function sincronizza() {
  if (!collegato()) return;
  if (SY.inCorso) { SY.ancora = true; return; }
  if (!navigator.onLine) { SY.stato = 'rete'; aggiornaStatoSync(); return; }
  SY.inCorso = true;
  SY.stato = 'in corso';
  aggiornaStatoSync();
  let cambiato = false;
  try {
    await inviaChiusure();
    const coda = await DB.all('coda');
    const pacchi = [];
    for (const q of coda) {
      const o = q.x ? null : (S[q.s] || []).find(x => x.id === q.rid);
      if (!q.x && !o) { await DB.del('coda', q.id); continue; }
      const agg = q.x ? (q.t || adesso()) : (o.agg || adesso());
      const contenuto = q.x ? { s: q.s, id: q.rid, x: 1, agg } : { s: q.s, o: perInvio(q.s, o) };
      pacchi.push({ q, r: { id: q.rid, agg, dati: await CIFRA.oggetto(S.kv.syncChiave, contenuto, q.rid) } });
    }
    for (let i = 0; i < pacchi.length; i += 100) {
      const parte = pacchi.slice(i, i + 100);
      await api('POST', '/api/invia', { dispositivo: conn().dispositivo, record: parte.map(p => p.r) });
      for (const p of parte) {
        if (p.q.x && p.q.s === 'documenti') api('DELETE', '/api/file/' + p.q.rid).catch(() => {});
        const ancora = await DB.get('coda', p.q.id);
        if (ancora && ancora.n === p.q.n) await DB.del('coda', p.q.id);
      }
    }
    const c = conn();
    let da = c.ultimo || 0;
    for (let giro = 0; giro < 100; giro++) {
      const r = await api('GET', '/api/cambi?da=' + da);
      for (const rec of r.record) if (await applicaRemoto(rec)) cambiato = true;
      da = r.ultimo;
      if (!r.altri) break;
    }
    c.ultimo = da;
    c.ultimaSync = adesso();
    await setKV('sync', c);
    SY.stato = 'ok';
    SY.errore = '';
    aggiornaDispositivo().catch(() => {});
    await caricaFileMancanti();
    if (SY.fileInAttesa) SY.errore = plur(SY.fileInAttesa, 'file non ancora inviato', 'file non ancora inviati') + ': riprovo più tardi';
  } catch (e) {
    SY.stato = e.status === 401 ? 'password' : (e.name === 'AbortError' || e instanceof TypeError) ? 'rete' : 'errore';
    SY.errore = e.message || String(e);
  } finally {
    SY.inCorso = false;
    await contaCoda();
    aggiornaStatoSync();
    if (cambiato) { dopoModifica(); ridisegnaSePossibile(); }
    if (SY.ancora) { SY.ancora = false; programmaSync(300); }
  }
}

async function scollegaDispositivo() {
  const c = conn();
  clearTimeout(SY.timer);
  if (c && S.kv.syncToken) {
    try {
      const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
      const sub = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
      if (sub) await sub.unsubscribe();
    } catch (e) { /* pazienza */ }
    try { await api('DELETE', '/api/dispositivo/' + c.dispositivo, undefined, { attesa: 8000 }); } catch (e) { /* il servizio lo dimenticherà da solo */ }
  }
  if (c) await setKV('syncUrl', c.url);
  for (const k of ['sync', 'syncChiave', 'syncToken', 'syncDisp', 'syncDispQuando']) { await DB.del('kv', k); delete S.kv[k]; }
  await DB.clear('coda');
  SY.stato = ''; SY.inCoda = 0; SY.push = null;
}

// Mai ridisegnare sotto le dita: se qualcuno ha appena toccato lo schermo, o c'è una domanda
// aperta, si aspetta un attimo (un pulsante che si sposta mentre lo tocchi fa segnare la cosa sbagliata).
let ultimoTocco = 0, timerRidisegno = null;
document.addEventListener('pointerdown', () => { ultimoTocco = Date.now(); }, true);
function ridisegnaSePossibile() {
  if (bloccato || !utente()) return;
  clearTimeout(timerRidisegno);
  if (document.querySelector('.velo') || Date.now() - ultimoTocco < 2500) { timerRidisegno = setTimeout(ridisegnaSePossibile, 1500); return; }
  // si ridisegna, tranne se qualcuno sta scrivendo in un modulo
  if (formSporco) avvisa('Sono arrivati aggiornamenti dagli altri dispositivi');
  else render();
}

function tempoFa(quando) {
  const s = Math.round((Date.now() - Date.parse(quando)) / 1000);
  if (s < 60) return 'adesso';
  if (s < 3600) return Math.floor(s / 60) + ' min fa';
  if (s < 86400) return Math.floor(s / 3600) + ' h fa';
  return 'il ' + fmt(quando.slice(0, 10));
}
function testoStatoSync() {
  if (!collegato()) return '';
  const coda = SY.inCoda ? plur(SY.inCoda, 'modifica', 'modifiche') + ' da inviare' : '';
  if (SY.stato === 'in corso') return 'Sincronizzo…';
  if (SY.stato === 'password') return 'La password non è più valida: ricollega il dispositivo';
  if (!navigator.onLine || SY.stato === 'rete') return 'Senza rete' + (coda ? ': ' + coda : '');
  if (SY.stato === 'errore') return 'Sincronizzazione non riuscita, riprovo' + (coda ? ' · ' + coda : '');
  if (coda) return coda;
  const u = conn().ultimaSync;
  return u ? 'Sincronizzato ' + tempoFa(u) : 'In attesa della prima sincronizzazione';
}
function aggiornaStatoSync() {
  document.querySelectorAll('[data-stato-sync]').forEach(el => { el.textContent = testoStatoSync(); });
}

async function aggiornaDispositivo(forza) {
  const c = conn();
  if (!c) return;
  let sub = null;
  if ('serviceWorker' in navigator && 'PushManager' in window && window.Notification && Notification.permission === 'granted') {
    try {
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('nessun service worker')), 4000))]);
      sub = await reg.pushManager.getSubscription();
      if (!sub && (!SY.pushNo || forza)) {
        try {
          const { chiave } = await api('GET', '/api/push-chiave');
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: daB64url(chiave) });
          SY.pushNo = false;
        } catch (e) { SY.pushNo = true; }
      }
    } catch (e) { sub = null; }
  }
  const mm = momenti();
  await setKV('momenti', mm);
  const dati = { id: c.dispositivo, sub: sub ? sub.toJSON() : null, ora: c.ora || '08:30', momenti: mm.map(m => m.t + '|' + m.x + (m.k ? '|' + m.k : '')), novita: !!c.novita };
  const impronta = JSON.stringify(dati);
  SY.push = !!sub;
  if (!forza && impronta === S.kv.syncDisp && Date.now() - (S.kv.syncDispQuando || 0) < 6 * 3600 * 1000) return;
  await api('POST', '/api/dispositivo', dati);
  await setKV('syncDisp', impronta);
  await setKV('syncDispQuando', Date.now());
}

async function inviaChiusure() {
  const l = S.kv.chiusure || [];
  if (!l.length) return;
  const resto = [];
  for (const k of l) { try { await api('POST', '/api/chiudi', { k }); } catch (e) { resto.push(k); } }
  await setKV('chiusure', resto);
}

function scaricaFile(id) {
  if (SY.scaricando.has(id)) return;
  SY.scaricando.add(id);
  setTimeout(async () => {
    try {
      const d = documento(id);
      if (!d || d.blob) return;
      const testo = await api('GET', '/api/file/' + id, undefined, { rispostaTesto: true, attesa: 120000 });
      const bytes = await CIFRA.apriBytes(S.kv.syncChiave, testo, 'file:' + id);
      d.blob = new Blob([bytes], { type: d.mime || 'application/octet-stream' });
      await salva('documenti', d, { remoto: true });
      if (location.hash === '#/doc/' + id) render();
    } catch (e) {
      const el = document.querySelector('[data-scarica="' + id + '"]');
      if (el) el.textContent = 'Non riesco a scaricare il file adesso: riprova quando c\'è rete.';
    } finally { SY.scaricando.delete(id); }
  }, 0);
}

moduli.collega = async function (form) {
    const fd = new FormData(form);
    let url = String(fd.get('url') || '').trim().replace(/\/+$/, '');
    const pw = String(fd.get('password') || '');
    const conferma = String(fd.get('conferma') || '');
    const errore = (campo, t) => { const el = document.getElementById('err-' + campo); if (el) el.textContent = t; };
    if (!url) { errore('url', 'Scrivi l\'indirizzo del servizio.'); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!/^https:\/\//i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url)) { errore('url', 'L\'indirizzo deve iniziare con https://'); return; }
    if (pw.length < 10) { errore('password', 'Almeno 10 caratteri.'); return; }
    const pulsante = form.querySelector('button[type=submit]');
    pulsante.disabled = true;
    pulsante.textContent = 'Collegamento…';
    try {
      let st;
      try { st = await api('GET', '/api/stato', undefined, { url, senzaToken: true, attesa: 15000 }); }
      catch (e) { errore('url', 'Non riesco a raggiungere questo indirizzo. Controlla che sia scritto giusto e che ci sia rete.'); return; }
      if (!st || typeof st.pronto !== 'boolean') { errore('url', 'A questo indirizzo non c\'è il servizio di Kenosis.'); return; }
      const ciSonoDati = STORES_CONDIVISI.some(s => S[s].some(x => x.agg !== ANTICO));
      let sale = st.sale, primo = false;
      if (!st.pronto) {
        if (conferma !== pw) { errore('conferma', 'Le due password non coincidono. Questo è il primo dispositivo: ripetila per sicurezza.'); return; }
        sale = CIFRA.hex(crypto.getRandomValues(new Uint8Array(16)));
        primo = true;
      }
      pulsante.textContent = 'Preparo la chiave…';
      const { chiave, token } = await CIFRA.deriva(pw, sale);
      if (primo) {
        try { await api('POST', '/api/crea', { sale, token }, { url, senzaToken: true }); }
        catch (e) {
          if (e.status === 409) errore('password', 'Nel frattempo un altro dispositivo ha creato lo spazio: premi di nuovo Collega con la stessa password.');
          else errore('url', 'Il servizio non ha accettato la richiesta. Riprova tra poco.');
          return;
        }
      } else {
        try { await api('POST', '/api/verifica', {}, { url, token }); }
        catch (e) {
          if (e.status === 401) errore('password', 'Password sbagliata: deve essere la stessa usata sugli altri dispositivi.');
          else errore('url', 'Il servizio non risponde. Riprova tra poco.');
          return;
        }
      }
      let invia = true;
      if (ciSonoDati) {
        // Una domanda con le risposte scritte per esteso: con OK/Annulla era facile mandare
        // a tutti i dati di prova premendo "Annulla" per tornare indietro.
        const esempi = datiDiEsempio().length;
        const scelta = await chiedi({ titolo: 'Su questo telefono ci sono già dei dati', icona: 'info',
          testo: '<p>Cosa sono?' + (esempi ? ' (Tra questi ci sono ' + plur(esempi, 'cosa di esempio', 'cose di esempio') + '.)' : '') + '</p>',
          scelte: primo
            ? [{ valore: 'veri', testo: 'Sono dati veri: mettili nello spazio condiviso', tipo: 'primary' }, { valore: 'prova', testo: 'Sono di prova: cancellali da questo telefono', tipo: 'danger' }]
            : [{ valore: 'prova', testo: 'Sono di prova: tieni solo quelli condivisi', tipo: 'primary' }, { valore: 'veri', testo: 'Sono dati veri: aggiungili a quelli condivisi' }],
          annulla: 'Non collegare adesso' });
        if (!scelta) { errore('password', 'Collegamento annullato: non è cambiato niente.'); return; }
        invia = scelta === 'veri';
      }
      await setKV('syncChiave', chiave);
      await setKV('syncToken', token);
      await setKV('sync', { url, ultimo: 0, dispositivo: uid(), ora: '08:30', novita: false, ultimaSync: null });
      await DB.clear('coda');
      if (ciSonoDati && !invia) {
        for (const s of STORES_CONDIVISI) await DB.clear(s);
        await DB.del('kv', 'seminato');
        await carica();
      } else if (ciSonoDati) {
        for (const d of S.documenti) { delete d.fileSu; delete d.fileGrande; await DB.put('documenti', d); }
        await accodaTutto();
      }
      await contaCoda();
      avvisa(primo ? 'Spazio condiviso creato: ora collega gli altri dispositivi' : 'Dispositivo collegato');
      render();
      await sincronizza();
      render();
    } finally {
      if (pulsante.isConnected) { pulsante.disabled = false; pulsante.textContent = 'Collega'; }
    }
  };

moduli['sync-avvisi'] = async function (form) {
    const fd = new FormData(form);
    const c = conn();
    if (!c) return;
    let permesso = window.Notification ? Notification.permission : 'denied';
    if (permesso === 'default') permesso = await Notification.requestPermission();
    const ora = String(fd.get('ora') || '');
    c.ora = /^\d{2}:\d{2}$/.test(ora) ? ora : '08:30';
    c.novita = fd.get('novita') === 'on';
    await setKV('sync', c);
    try {
      await aggiornaDispositivo(true);
      if (permesso === 'denied') avvisa('Impostazioni salvate, ma le notifiche sono bloccate: riattivale dalle impostazioni del browser');
      else avvisa(SY.push ? 'Promemoria attivi alle ' + c.ora : 'Impostazioni salvate');
    } catch (e) {
      avvisa('Salvato qui: lo comunico al servizio appena c\'è rete');
    }
    render();
  };

let ultimaRotta = '';
let formSporco = false;   // qualcuno sta scrivendo: non ridisegnare sotto le dita
function render() {
  formSporco = false;
  urlAperti.forEach(u => URL.revokeObjectURL(u));
  urlAperti = [];
  document.body.classList.toggle('grande', !!S.kv.grande);
  const app = document.getElementById('app');
  let html;
  const { parti, q } = rotta();
  if (bloccato) html = vBlocco();
  else if (!utente()) html = vBenvenuto();
  else {
    const f = VISTE[parti[0]] || VISTE.oggi;
    try { html = f(parti, q); } catch (e) { console.error(e); html = nonTrovato(); }
  }
  app.innerHTML = html;
  if (fileInSospeso) {
    if (!app.querySelector('input[type=file]') && parti[0] !== 'aggiungi') fileInSospeso = null;
    else {
      app.querySelectorAll('[data-nomefile]').forEach(el => { el.textContent = 'File portato qui: ' + fileInSospeso.name; });
      const nome = app.querySelector('input[name=nome]');
      if (nome && !nome.value) nome.value = fileInSospeso.name.replace(/\.[^.]+$/, '').slice(0, 80);
    }
  }
  if (location.hash !== ultimaRotta) { window.scrollTo(0, 0); ultimaRotta = location.hash; }
  const c = document.getElementById('cerca');
  if (c && SY_CERCA[location.hash.split('?')[0]]) { c.value = SY_CERCA[location.hash.split('?')[0]]; filtraRicerca(c.value); }
}
const SY_CERCA = {};
function vai(hash, sostituisci) {
  if (sostituisci) { history.replaceState(null, '', hash); render(); }
  else if (location.hash === hash) render();
  else location.hash = hash;
}
let navigato = false;
function indietro() {
  if (navigato && history.length > 1) history.back();
  else vai('#/oggi', true);
}
window.addEventListener('hashchange', () => { navigato = true; render(); });

/* ricerca dentro la pagina (Diario, Archivio): filtra senza ridisegnare */
function filtraRicerca(t) {
  const parole = semplifica(t).split(/\s+/).filter(Boolean);
  let visibili = 0;
  document.querySelectorAll('[data-cerca]').forEach(el => {
    const ok = parole.every(p => el.dataset.cerca.includes(p));
    el.classList.toggle('hidden', !ok);
    if (ok) visibili++;
  });
  document.querySelectorAll('[data-gruppo]').forEach(g => {
    const qualcuno = [...document.querySelectorAll('[data-cerca][data-in="' + g.dataset.gruppo + '"]')].some(el => !el.classList.contains('hidden'));
    g.classList.toggle('hidden', !qualcuno);
  });
  const nessuno = document.getElementById('nessun-risultato');
  if (nessuno) nessuno.classList.toggle('hidden', visibili > 0 || !parole.length);
}

/* ========================================================== file */

async function comprimi(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const lato = 1800;
    const scala = Math.min(1, lato / Math.max(bmp.width, bmp.height));
    if (scala === 1 && file.size < 1200000) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scala);
    c.height = Math.round(bmp.height * scala);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    return b || file;
  } catch (e) { return file; }
}
let fileInSospeso = null;
function fileScelto(form) {
  const ins = form.querySelectorAll('input[type=file]');
  for (const i of ins) if (i.files && i.files[0]) return i.files[0];
  return fileInSospeso;
}
// Salva il file scelto in un modulo come documento dell'archivio.
async function salvaFileDelModulo(form, dati) {
  const file = fileScelto(form);
  if (!file) return null;
  const blob = await comprimi(file);
  const d = Object.assign({
    id: uid(), tipo: 'Altro', ospiteId: null, voceId: null, data: oggi(), creato: adesso(), daSmistare: false
  }, dati, { mime: blob.type || file.type || 'application/octet-stream', dim: blob.size, blob });
  d.nome = String(d.nome || file.name.replace(/\.[^.]+$/, '') || 'Documento').slice(0, 80);
  await salva('documenti', d);
  fileInSospeso = null;
  return d.id;
}
function blobInBase64(b) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(b);
  });
}
async function base64InBlob(dataUrl) {
  const [testa, corpo] = dataUrl.split(',');
  const mime = (testa.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(corpo);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

  e.preventDefault();

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  if (form.dataset.occupato) return;
  form.querySelectorAll('.err').forEach(x => { x.textContent = ''; });
  const f = moduli[form.dataset.form];
  if (!f) return;
  form.dataset.occupato = '1';
  try { await f(form, e); } catch (err) { console.error(err); avvisa('Qualcosa non ha funzionato: riprova'); }

});
document.addEventListener('input', e => {

document.addEventListener('change', async e => {
  const t = e.target;
  const mostra = (id, si) => { const box = document.getElementById(id); if (box) box.classList.toggle('hidden', !si); };
  if (t.name === 'pag') mostra('box-altro-pag', t.value === 'Altro');
  if (t.name === 'ric') mostra('ric-altro', t.value === 'altro');
  if (t.name === 'pagato') mostra('box-importo', t.checked);
  if (t.name === 'giorni_tipo') { mostra('box-giorni', t.value === 'alcuni'); mostra('box-orari', t.value !== 'bisogno'); mostra('box-bisogno', t.value === 'bisogno'); }
  if (t.name === 'tipo_visita') mostra('box-altro-visita', t.value === 'Altro');
  if (t.name === 'tipo_par') { mostra('box-altro-par', t.value === 'altro'); const p = parametro(t.value); const i = document.getElementById('f-valore'); if (i) i.placeholder = p.ph || ''; const u = document.getElementById('unita-par'); if (u) u.textContent = p.u || ''; }
  if (t.type === 'file' && t.name !== 'importa') {
    const form = t.closest('form');
    if (t.files[0]) form.querySelectorAll('input[type=file]').forEach(i => { if (i !== t) i.value = ''; });
    const lab = form.querySelector('[data-nomefile]');
    if (lab) lab.textContent = t.files[0] ? 'Scelto: ' + t.files[0].name : '';
    const nome = form.querySelector('input[name=nome]');
    if (nome && !nome.value && t.files[0] && form.dataset.form === 'doc') nome.value = t.files[0].name.replace(/\.[^.]+$/, '').slice(0, 80);
    const err = document.getElementById('err-file');
    if (err) err.textContent = '';
  }
  if (t.name === 'importa' && t.files[0]) { await importaCopia(t.files[0]); t.value = ''; }
  if (t.name === 'utente-set') {
    const prima = utente();
    if (!(await conferma('Questo telefono adesso è di ' + t.value + '?', 'Da ora quello che segni da qui risulterà fatto da ' + t.value + '.', 'Sì, sono ' + t.value, { no: 'No, resta di ' + (prima || 'nessuno') }))) {
      const r = document.querySelector('input[name="utente-set"][value="' + prima + '"]');
      if (r) r.checked = true; else t.checked = false;
      return;
    }
    await setKV('utente', t.value);
    avvisa('Ora questo telefono è di ' + t.value);
    if (collegato()) aggiornaDispositivo(true).catch(() => {});
  }
  if (t.name === 'grande-set') { await setKV('grande', t.checked); render(); }
});

document.addEventListener('dragover', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  document.body.classList.add('drag');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
document.addEventListener('drop', e => {
  document.body.classList.remove('drag');
  if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  if (bloccato || !utente()) return;
  const f = e.dataTransfer.files[0];
  const input = document.querySelector('form input[type=file][name=file]');
  if (input) {
    const dt = new DataTransfer();
    dt.items.add(f);
    input.files = dt.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
    return;
  }
  fileInSospeso = f;
  vai('#/aggiungi');
});

(async function avvio() {
  persistente = await apriDB();
  // Si chiede al telefono di non cancellare mai l'archivio dell'app quando la memoria si riempie.
  try { if (persistente && navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* non supportato */ }
  await carica();
  bloccato = !!S.kv.pin;
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { await navigator.serviceWorker.register('sw.js'); if (window.Notification && Notification.permission === 'granted') registraAvvisiBackground(); } catch (e) { /* anteprima senza service worker */ }
  }
  dopoModifica();
  if (collegato()) { await contaCoda(); sincronizza(); }
  setInterval(() => { if (!document.hidden && collegato()) sincronizza(); }, 30 * 1000);
  // a mezzanotte e ogni tanto, Oggi si aggiorna da sola
  let giornoVisto = oggi();
  setInterval(() => {
    if (document.hidden || bloccato) return;
    if (oggi() !== giornoVisto) { giornoVisto = oggi(); dopoModifica(); }
    if (!document.querySelector('form[data-form]') && ['', 'oggi'].includes(rotta().parti[0] || '')) ridisegnaSePossibile();
  }, 60 * 1000);
})();
