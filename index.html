<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kenosis">
<title>Kenosis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- tema: tutti i colori sono qui, per cambiarli basta questo blocco ---------- */
:root{
  /* colori di kasakenosis.it (gli stessi di Effie): legno, crema, acqua */
  --ground:#F6F2EA; --card:#FFFDF9; --ink:#2B1B0B; --ink2:#7A6A58; --line:#E6DCCD; --line2:#F0E8DC; --btnline:#D9C9B5;
  --green:#4A2C0C; --greenbg:#E4F3FB; --greenink:#155E86; --greenline:#CFE7F5;
  --acqua:#2F9FD8;
  --ok:#2F7D4F; --okbg:#E5F4EA; --okline:#BFE3CC;
  --rust:#B5531C; --rustbg:#FDF0E7; --rustline:#F2D3BE; --rustink:#7E3A14;
  --amber:#6E5212; --amberbg:#FFF8E6; --amberline:#F2E2B8;
  --plum:#7A4A1C; --plumbg:#F3E6D6;
  --col:600px; --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--greenink)}
button{font:inherit;color:inherit}
#app{max-width:var(--col);margin:0 auto;min-height:100vh;padding-bottom:calc(160px + env(safe-area-inset-bottom))}
body.grande #app,body.grande nav.bottom .in,body.grande .fab,body.grande #toast{zoom:1.14}
@media (min-width:900px){:root{--col:780px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}}

/* testata */
.top{display:flex;align-items:flex-start;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 18px 10px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.12;overflow-wrap:anywhere}
.top.piccola h1{font-size:25px}
.top .sub{font-size:15px;color:var(--ink2);margin-top:5px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.icon-btn{width:46px;height:46px;flex:none;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:0}
.icon-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.txt-btn{min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:16px;color:var(--green);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;flex:none}
.txt-btn.on{background:var(--green);color:#fff;border-color:var(--green)}

.pad{padding:0 16px;display:flex;flex-direction:column;gap:9px}
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 2px}
.sec h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.sec.rust h2{color:var(--rust)}
.sec.amber h2{color:var(--amber)}
.sec.green h2{color:var(--ok)}
.sec .destra{margin-left:auto;font-size:15px;font-weight:700;text-decoration:none}
.badge{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--ink2);color:#fff}
.badge.rust{background:var(--rust)}
.badge.amber{background:var(--amber)}
.badge.green{background:var(--ok)}

/* righe */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:66px;text-decoration:none;color:inherit;width:100%;text-align:left;font:inherit}
button.row{cursor:pointer}
.row-rust{background:var(--rustbg);border-color:var(--rustline)}
.row-amber{background:var(--amberbg);border-color:var(--amberline)}
.row-ok{background:var(--okbg);border-color:var(--okline)}
.row-done{opacity:.72}
.row-main{flex:1;min-width:0;text-decoration:none;color:inherit;display:block}
.row-title{display:block;font-size:17px;font-weight:650;line-height:1.28;color:var(--ink);overflow-wrap:anywhere}
.row-meta{display:block;font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.35}
.row-rust .row-meta{color:var(--rustink)}
.row-amber .row-meta{color:var(--amber)}
.row-ok .row-meta{color:var(--ok)}
.row-when{font-size:14px;font-weight:700;color:var(--ink2);flex:none;text-align:right;max-width:38%}
.t-rust{color:var(--rust)!important}
.t-green{color:var(--green)!important}
.check{width:48px;height:48px;flex:none;border-radius:24px;border:1.5px solid var(--btnline);background:var(--card);color:var(--green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.avatar{width:46px;height:46px;flex:none;border-radius:23px;background:var(--plumbg);color:var(--plum);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.dicon{width:42px;height:42px;flex:none;border-radius:12px;background:var(--greenbg);color:var(--greenink);display:flex;align-items:center;justify-content:center}
.dicon.rust{background:var(--rustbg);color:var(--rust)}
.dicon.amber{background:var(--amberbg);color:var(--amber)}
.dicon.plum{background:var(--plumbg);color:var(--plum)}

/* gruppi stile iPhone */
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group>.gi{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:64px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left;font:inherit;cursor:pointer;border-left:0;border-right:0;border-top:0}
.group>.gi:last-child{border-bottom:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2);font-size:16px}
.kv:last-child{border-bottom:0}
.kv .k{width:128px;flex:none;color:var(--ink2);font-size:15px}
.kv .v{flex:1;font-weight:650;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--greenbg);color:var(--greenink)}
.tag.plum{background:var(--plumbg);color:var(--plum)}
.tag.rust{background:var(--rust);color:#fff}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.grey{background:var(--line2);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 8px}

/* pulsanti */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 18px;border-radius:14px;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;border:1px solid var(--btnline);background:var(--card);color:var(--ink);width:100%;text-align:center;line-height:1.2}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{color:var(--rust);border-color:var(--rustline);background:var(--card)}
.btn-sm{min-height:50px;font-size:16px}
.btn:disabled{opacity:.55}
.two{display:flex;gap:8px}
.two>*{flex:1;width:auto}
.fab{position:fixed;right:max(16px,calc((100vw - var(--col)) / 2 + 16px));bottom:calc(92px + env(safe-area-inset-bottom));height:60px;padding:0 22px 0 18px;border-radius:30px;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 6px 18px rgba(31,37,35,.25);z-index:6}

/* moduli */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;display:inline-flex}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.chips span{display:inline-flex;align-items:center;min-height:48px;padding:0 15px;border-radius:12px;border:1px solid var(--btnline);background:var(--card);font-size:16px;font-weight:650}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--acqua);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.field>label,.field>.lab{font-size:16px;font-weight:750;color:var(--ink)}
.hint{font-size:14px;color:var(--ink2);line-height:1.45}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],input[type=tel],select,textarea{font:inherit;font-size:17px;padding:12px 13px;border:1px solid var(--btnline);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-height:52px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--greenline);border-color:var(--acqua)}
.inline{display:flex;gap:8px;align-items:center}
.inline>*{flex:1}
.inline .lbl{flex:none;font-size:16px;font-weight:650}
.err{color:var(--rust);font-size:15px;font-weight:750;margin:0}
.err:empty{display:none}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.filebtns{display:flex;gap:8px}
.filebtns label{position:relative;overflow:hidden;flex:1}
.filebtns input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.stepper{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.stepper .nome{flex:1;font-weight:650}
.stepper input{width:64px;min-height:46px;text-align:center;padding:6px;flex:none}
.stepper button{width:46px;height:46px;border-radius:23px;border:1px solid var(--btnline);background:var(--card);font-size:22px;font-weight:700;cursor:pointer;flex:none;line-height:1}
.orari{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.orari .ora{display:inline-flex;align-items:center;gap:4px;padding:0 6px 0 14px;min-height:48px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
.orari .ora button{width:36px;height:36px;border:0;background:none;color:#fff;font-size:20px;cursor:pointer}
.orari input{width:130px;flex:none}

/* segmenti e ricerca */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg a,.seg button{flex:none;text-align:center;font-size:15px;font-weight:700;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.seg a.on,.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cerca{position:relative}
.cerca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.cerca input{padding-left:44px;border-radius:14px;background:var(--card)}

/* riquadri */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;min-height:122px}
.tile b{font-size:17px;line-height:1.2}
.tile small{font-size:14px;color:var(--ink2);line-height:1.35}
.tile.rust{background:var(--rustbg);border-color:var(--rustline)}
.tile.rust small{color:var(--rustink);font-weight:700}
.tile.nuovo{border-style:dashed;align-items:center;justify-content:center;color:var(--green);font-weight:800}
.tile .ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.tile.mod{padding-top:56px}
.tile.mod .dicon{display:none}
.tile .ctl button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tile .ctl .meno{background:var(--rust);border-color:var(--rust);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box h3{margin:0 0 6px;font-size:18px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:14px;font-size:15px;line-height:1.45;border:1px solid}
.banner svg{flex:none;margin-top:2px}
.banner.amber{background:var(--amberbg);border-color:var(--amberline);color:var(--amber)}
.banner.rust{background:var(--rustbg);border-color:var(--rustline);color:var(--rustink)}
.banner.green{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.banner a{color:inherit;font-weight:800}
.mx{margin:0 16px 8px}
.empty{font-size:16px;color:var(--ink2);margin:4px 2px 6px}
.muted{color:var(--ink2)}
.hidden{display:none!important}
.syncline{display:block;text-align:center;font-size:14px;color:var(--ink2);margin:16px 0 2px;text-decoration:none}
.docimg{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;display:block}

/* Effie (stessi movimenti del sito) */
.effie{display:flex;align-items:flex-end;gap:8px;margin:2px 16px 6px}
.ef-tocca{border:0;background:none;padding:0;cursor:pointer;flex:none;filter:drop-shadow(0 5px 9px rgba(60,35,10,.22))}
.ef{display:inline-block;flex:none}
.ef-svg{width:100%;height:100%;display:block;overflow:visible}
.ef-svg *{transform-box:fill-box}
.ef-svg .ef-all{transform-origin:50% 100%;animation:efRespira 3.2s ease-in-out infinite}
.ef-svg .ef-tilt{transform-origin:50% 85%}
.ef-svg .ef-eyes{transform-origin:50% 50%;animation:efOcchi 4.6s infinite}
.ef-svg .ef-sad,.ef-svg .ef-closed,.ef-svg .ef-z,.ef-svg .ef-splash,.ef-svg .ef-yawn,.ef-svg .ef-water,.ef-svg .ef-tear{opacity:0}
.ef.saluta .ef-all{animation:efDimena .9s ease-in-out 1}
.ef.saluta .ef-splash{animation:efSpruzzo .9s ease-out 1}
@keyframes efRespira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes efOcchi{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes efDimena{0%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.06,.95)}40%{transform:rotate(8deg) scale(.97,1.05)}60%{transform:rotate(-5deg) translateY(-6px)}80%{transform:rotate(3deg)}100%{transform:rotate(0)}}
@keyframes efSpruzzo{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.ef *{animation:none!important}}
.bolla{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 15px;font-size:16px;line-height:1.45;box-shadow:0 6px 18px rgba(60,35,10,.08)}
.bolla b{font-weight:800}

/* Oggi: una lista, un pulsante per cosa */
.cosa{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:74px}
.cosa.rust{background:var(--rustbg);border-color:var(--rustline)}
.cosa.rust .row-meta{color:var(--rustink)}
.cosa.adesso{border:2px solid var(--green)}
.cosa.amber{background:var(--amberbg);border-color:var(--amberline)}
.cosa-ora{width:56px;flex:none;font-size:19px;font-weight:800}
.cosa-link{flex:1;min-width:0;text-decoration:none;color:inherit;display:flex}
.cosa .row-title{font-size:18px}
.cosa .row-meta{font-size:15px}
.cosa-az{flex:none;min-height:52px;padding:0 16px;border-radius:14px;border:0;font-size:17px;font-weight:800;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer;font-family:inherit}
.cosa-az.ok{background:var(--ok);color:#fff}
.cosa-az.p{background:var(--green);color:#fff}
.gia{display:flex;align-items:center;gap:12px;padding:14px;background:var(--okbg);border:1px solid var(--okline);border-radius:18px;text-decoration:none;color:var(--ok)}
.gia b{flex:1;font-size:18px}
.gia .tondo{width:44px;height:44px;border-radius:22px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
/* riquadri grandi */
.riq{display:flex;flex-direction:column;gap:8px;padding:16px;min-height:142px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-decoration:none;color:inherit;position:relative}
.riq b{font-size:19px;line-height:1.2}
.riq small{font-size:15px;line-height:1.35;color:var(--ink2)}
.riq.rust{border-color:var(--rustline)}
.riq.rust small{color:var(--rust);font-weight:700}
.riq .dicon{width:50px;height:50px;border-radius:14px}
.scelta{display:flex;align-items:center;gap:16px;padding:16px;min-height:86px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-decoration:none;color:inherit}
.scelta .dicon{width:56px;height:56px;border-radius:16px}
.scelta .row-title{font-size:20px;font-weight:800}
/* opzioni che servono di rado */
details.altre{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
details.altre summary{cursor:pointer;padding:14px 16px;font-size:16px;font-weight:750;color:var(--greenink);list-style:none;min-height:50px;box-sizing:border-box}
details.altre summary::-webkit-details-marker{display:none}
details.altre summary::before{content:"＋ ";font-weight:800}
details.altre[open] summary::before{content:"− "}
.altre-in{padding:0 14px 14px}
.altre-in>.field:first-child{margin-top:4px}
.nota-card{padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;display:block}
.nota-card .testo{font-size:17px;line-height:1.45;white-space:pre-wrap}
.nota-card .chi{font-size:14px;color:var(--ink2);margin-top:8px}

/* terapia */
.dose{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.dose.ok{background:var(--okbg);border-color:var(--okline)}
.dose.no{background:var(--amberbg);border-color:var(--amberline)}
.dose .testa{display:flex;gap:10px;align-items:flex-start}
.dose .nome{font-size:18px;font-weight:750}
.dose .quanto{font-size:15px;color:var(--ink2);margin-top:2px}
.dose .esito{font-size:15px;font-weight:700}
.dose .bottoni{display:flex;gap:8px}
.dose .bottoni>*{flex:1}
.ospite-testa{display:flex;align-items:center;gap:10px;margin:18px 2px 0}
.ospite-testa b{font-size:19px}
.ospite-testa .btn{width:auto;min-height:44px;font-size:15px;margin-left:auto;padding:0 14px}

/* grafico */
.grafico{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 4px}
.grafico svg{display:block;width:100%;height:auto}

/* barra in basso */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.bottom .in{display:flex;width:100%;max-width:var(--col)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:12.5px;font-weight:700;min-height:54px}
nav.bottom a.on{color:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 10px 10px 18px;border-radius:16px;font-size:16px;font-weight:650;width:max-content;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;display:flex;align-items:center;gap:12px;min-height:52px}
#toast.show{opacity:1;pointer-events:auto}
#toast button{background:#fff;color:var(--ink);border:0;border-radius:11px;font-weight:800;padding:0 14px;min-height:40px;cursor:pointer}
#toast button.hidden{display:none}
.lockwrap{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
body.drag::after{content:"Lascia qui il file";position:fixed;inset:12px;border:3px dashed var(--acqua);border-radius:20px;background:rgba(228,243,251,.94);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--greenink);z-index:20;pointer-events:none}
.cal12{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cal12 .m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;color:var(--ink2)}
.cal12 .m b{display:block;font-size:16px;color:var(--ink);margin-top:1px}
.cal12 .m.si{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
@media (min-width:900px){.cal12{grid-template-columns:repeat(12,minmax(0,1fr))}}

function semplifica(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function saluto() { const h = new Date().getHours(); return h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }

function prossimaData(s, ric, giornoFisso) {
  if (!ric) return null;
  const n = Math.max(1, parseInt(ric.ogni, 10) || 1);
  switch (ric.unita) {
    case 'giorni': return piuGiorni(s, n);
    case 'settimane': return piuGiorni(s, 7 * n);

}
// Il giorno del mese a cui "ancorare" una scadenza mensile o annuale.

function finestraVoce(v) {

const STORES_CONDIVISI = ['voci', 'eventi', 'ospiti', 'documenti', 'farmaci', 'servizi', 'somministrazioni', 'visite', 'parametri', 'lista'];
const STORES = STORES_CONDIVISI.concat(['kv', 'coda']);
let idb = null;
const memoria = {};
STORES.forEach(s => { memoria[s] = new Map(); });

function apriDB() {
  return new Promise(resolve => {
    try {
      if (!('indexedDB' in window)) return resolve(false);
      const r = indexedDB.open('kenosis', 3);
      r.onupgradeneeded = () => {
        const d = r.result;
        STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      };
      r.onsuccess = () => {
        idb = r.result;
        idb.onversionchange = () => { idb.close(); location.reload(); };
        resolve(true);
      };
      r.onerror = () => resolve(false);
      r.onblocked = () => setTimeout(() => resolve(false), 8000);
    } catch (e) { resolve(false); }
  });
}
function transazione(store, modo, fn) {
  return new Promise((resolve, reject) => {
    const t = idb.transaction(store, modo);
    const req = fn(t.objectStore(store));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const DB = {
  all(s) { return idb ? transazione(s, 'readonly', os => os.getAll()) : Promise.resolve([...memoria[s].values()]); },
  get(s, id) { return idb ? transazione(s, 'readonly', os => os.get(id)) : Promise.resolve(memoria[s].get(id)); },
  put(s, o) { if (!idb) { memoria[s].set(o.id, o); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.put(o)); },
  del(s, id) { if (!idb) { memoria[s].delete(id); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.delete(id)); },
  clear(s) { if (!idb) { memoria[s].clear(); return Promise.resolve(); } return transazione(s, 'readwrite', os => os.clear()); }
};

const S = { kv: {} };

async function carica() {
  for (const s of STORES_CONDIVISI) { S[s] = await DB.all(s); delete CACHE[s]; }
  delete CACHE.scorte;
  S.kv = {};

}
// I servizi di partenza si mettono una volta sola per telefono, senza inviarli.
async function semina() {
  // nomi nuovi per i servizi di partenza mai toccati
  for (const [id, vecchio, nuovo] of [['srvmanutenzioni', 'Manutenzioni', 'Guasti'], ['srvtrasporti', 'Trasporti', 'Uscite']]) {
    const x = S.servizi.find(o => o.id === id);
    if (x && x.agg === ANTICO && x.nome === vecchio) { x.nome = nuovo; await DB.put('servizi', x); }
  }
  if (S.kv.seminato) return;
  for (const b of SERVIZI_BASE) {
    if (S.servizi.some(x => x.id === b.id)) continue;
    const o = JSON.parse(JSON.stringify(b));
    o.agg = ANTICO;
    await DB.put('servizi', o);
    S.servizi.push(o);
  }
  S.kv.seminato = true;
  await DB.put('kv', { id: 'seminato', v: true });
}
async function salva(store, obj, opz = {}) {
  if (!opz.remoto) {
    obj.agg = adesso();
    obj.da = obj.da || utente();
  }
  await DB.put(store, obj);
  delete CACHE[store];
  if (store === 'farmaci' || store === 'somministrazioni' || store === 'ospiti') delete CACHE.scorte;
  const i = S[store].findIndex(x => x.id === obj.id);
  if (i >= 0) S[store][i] = obj; else S[store].push(obj);
  if (!opz.remoto) await mettiInCoda(store, obj.id, false);
}
async function togli(store, id, opz = {}) {
  await DB.del(store, id);
  delete CACHE[store];
  if (store === 'farmaci' || store === 'somministrazioni' || store === 'ospiti') delete CACHE.scorte;
  S[store] = S[store].filter(x => x.id !== id);
  if (!opz.remoto) await mettiInCoda(store, id, true);
}
// Elimina con la possibilità di annullare per qualche secondo.
async function eliminaConAnnulla(elenco, msg, poi) {
  const copie = elenco.map(([store, o]) => [store, JSON.parse(JSON.stringify(Object.assign({}, o, { blob: undefined }))), o.blob]);
  for (const [store, o] of elenco) await togli(store, o.id);
  dopoModifica();
  if (poi) poi();
  avvisa(msg, async () => {
    for (const [store, o, blob] of copie) {
      if (blob) o.blob = blob;
      if (store === 'documenti') { delete o.fileSu; delete o.fileGrande; }   // il file va ricaricato
      await salva(store, o);
    }
    dopoModifica();
    render();
    avvisa('Ripristinato');
  });
}

/* ================================================= scadenze */

function stato(v) {

  if (n < 0) return 'ritardo';
  if (n === 0) return 'oggi';

}

}

// Controlli prima di segnare un pagamento: evita di pagare due volte.
function controlliPagamento(v, importo, data) {
  const avvisi = [];
  if (!v) return avvisi;
  // (un addebito in banca si segna con "Controllato": niente avviso, è l'azione giusta)
  if (v.attiva === false) avvisi.push('Risulta già chiuso' + (v.chiusaIl ? ' il ' + fmtLungo(v.chiusaIl) : '') + '.');
  const finestra = e => Math.abs(giorniTra(e.data, data)) <= 45;
  const stessi = S.eventi.filter(e => e.tipo === 'pagato' && finestra(e));
  // Stessa scadenza già pagata? Per quelle che si ripetono conta solo il periodo in corso,
  // così il pagamento del mese scorso non fa scattare l'avviso ogni mese.
  const proprio = S.eventi.find(e => e.tipo === 'pagato' && e.voceId === v.id &&
    (e.scadenza ? e.scadenza === v.prossima : Math.abs(giorniTra(e.data, data)) <= finestraVoce(v)));
  if (proprio) avvisi.push('Risulta già ' + (v.domiciliato ? 'controllato' : 'pagato') + ' il ' + fmtLungo(proprio.data) + (proprio.chi ? ' da ' + proprio.chi : '') + (proprio.importo != null ? ' (' + euro(proprio.importo) + ')' : '') + '.');
  if (importo != null) {
    const simile = stessi.find(e => e.voceId !== v.id && e.importo != null && Math.abs(e.importo - importo) < 0.01 &&
      ((e.voceId && voce(e.voceId) && (voce(e.voceId).pag || voce(e.voceId).nome) === (v.pag || v.nome)) || (e.nota && semplifica(e.nota).includes(semplifica(v.pag || v.nome)))));
    if (simile) avvisi.push('Il ' + fmtLungo(simile.data) + (simile.chi ? ' ' + simile.chi : '') + ' ha già pagato ' + euro(simile.importo) + ' per ' + ((voce(simile.voceId) || {}).nome || simile.nota) + '. È lo stesso pagamento?');
  }
  return avvisi;
}
// Un avviso appena arrivato: c'è già qualcosa di uguale aperto?
function giaInserito(pag, importo, scadenza) {
  return attive().find(v => ePagamento(v) && (v.pag || v.nome) === pag && importo != null && v.importo != null &&
    Math.abs(v.importo - importo) < 0.01 && Math.abs(giorniTra(v.prossima, scadenza)) <= 20) || null;
}

/* ================================================= terapia */

const IN_TERAPIA = f => Array.isArray(f.orari);
// I campi che fanno la terapia: se cambiano, la versione precedente resta nella storia del farmaco.
const CAMPI_TERAPIA = ['dose', 'giorni', 'orari', 'qta', 'unita', 'dal', 'al', 'maxGiorno', 'oreTra'];
// Un periodo {dal, al} vale dal giorno "dal" incluso al giorno "al" escluso (al vuoto = ancora in corso).
const inPeriodi = (lista, d) => Array.isArray(lista) && lista.some(p => p && p.dal && p.dal <= d && (!p.al || d < p.al));
// La terapia com'era in un certo giorno. Ogni modifica lascia la versione precedente in f.storia
// (valida fino al giorno "fino", escluso): così il registro dei giorni passati non cambia più.
function versioneAl(f, d) {
  if (Array.isArray(f.storia)) for (const v of f.storia) if (v && v.fino && d < v.fino) return v;
  return f;
}
function inizioVersione(f, v) { return v === f ? (f.versioneDa || f.creato) : (v.versioneDa || f.creato); }
function ospiteAttivo(o, d) {
  if (!o) return true;
  if (o.attivo === false && (!o.usciteIl || d >= o.usciteIl)) return false;
  return !inPeriodi(o.fuori, d);
}
function farmacoAttivo(f, d) {
  if (f.sospeso && (!f.sospesoIl || d >= f.sospesoIl)) return false;   // senza data (versioni vecchie): da sempre
  if (inPeriodi(f.pause, d)) return false;
  if (!ospiteAttivo(ospite(f.ospiteId), d)) return false;
  const v = versioneAl(f, d);
  if (v.dal && v.dal > d) return false;
  if (v.al && v.al < d) return false;
  return true;
}
function programmato(f, d) {
  const v = versioneAl(f, d);
  if (!Array.isArray(v.orari) || v.giorni === 'bisogno' || !v.orari.length || !farmacoAttivo(f, d)) return false;
  if (Array.isArray(v.giorni)) return v.giorni.includes(aData(d).getDay());
  return true;
}
// Una dose è "prevista" solo da quando il farmaco (o quella versione della terapia) è nell'app:
// niente dosi "mancanti" nei giorni in cui nessuno l'aveva ancora inserito.
function dosePrevista(f, v, d, ora) {
  const inizio = inizioVersione(f, v);
  if (!inizio) return true;
  const g = giornoDi(inizio);
  if (d < g) return false;
  if (d === g && minuti(ora) < minuti(oraDi(inizio)) - FINESTRA_DOSE) return false;
  return true;
}
function smId(f, d, ora) { return 'sm' + f.id + d.replace(/-/g, '') + ora.replace(':', ''); }
// Indici delle somministrazioni (per id, per giorno, per farmaco): si ricalcolano solo quando cambiano.
function sommIndice() {
  if (!CACHE.somministrazioni) {
    const perId = new Map(), perGiorno = new Map(), perFarmaco = new Map();
    for (const x of S.somministrazioni) {
      perId.set(x.id, x);
      if (!perGiorno.has(x.data)) perGiorno.set(x.data, []);
      perGiorno.get(x.data).push(x);
      if (!perFarmaco.has(x.farmacoId)) perFarmaco.set(x.farmacoId, []);
      perFarmaco.get(x.farmacoId).push(x);
    }
    CACHE.somministrazioni = { perId, perGiorno, perFarmaco };
  }
  return CACHE.somministrazioni;
}
function indiceSomm() { return sommIndice().perId; }
const sommDelGiorno = d => sommIndice().perGiorno.get(d) || [];
const sommDelFarmaco = id => sommIndice().perFarmaco.get(id) || [];
// Un farmaco eliminato che compare ancora in una registrazione: si mostra con i dati salvati allora.
function farmacoDaRegistrazione(x) {
  return farmaco(x.farmacoId) || { id: x.farmacoId, nome: x.nome || 'Farmaco eliminato', ospiteId: x.ospiteId, dose: x.dose || null, qta: x.qta, unita: x.unita, orari: [], eliminato: true };
}
// Tutte le dosi di un giorno, raggruppate per orario: quelle previste dalla terapia di quel giorno
// più quelle già segnate, che restano visibili anche se dopo la terapia è cambiata.
function slotDel(d, ospiteId) {
  const mappa = new Map();
  const metti = (ora, f) => { if (!mappa.has(ora)) mappa.set(ora, new Map()); if (!mappa.get(ora).has(f.id)) mappa.get(ora).set(f.id, f); };
  for (const f of S.farmaci) {
    if (ospiteId && f.ospiteId !== ospiteId) continue;
    if (!programmato(f, d)) continue;
    const v = versioneAl(f, d);
    for (const ora of v.orari) if (dosePrevista(f, v, d, ora)) metti(ora, f);
  }
  for (const x of sommDelGiorno(d)) {
    if (x.bisogno || !x.ora) continue;
    if (ospiteId && x.ospiteId !== ospiteId) continue;
    metti(x.ora, farmacoDaRegistrazione(x));
  }
  const idx = indiceSomm();
  return [...mappa.keys()].sort().map(ora => {
    const dosi = [...mappa.get(ora).values()].map(f => {
      let sm = idx.get(smId(f, d, ora)) || null;
      if (sm && ospiteId && sm.ospiteId && sm.ospiteId !== ospiteId) sm = null;
      return { f, sm };
    });
    const dati = dosi.filter(x => x.sm && x.sm.esito === 'dato').length;
    const nonDati = dosi.filter(x => x.sm && x.sm.esito === 'nondato').length;
    return { data: d, ora, dosi, dati, nonDati, mancano: dosi.length - dati - nonDati };

// Dosi dei giorni scorsi rimaste senza esito: non devono sparire dalla vista di chi arriva dopo.
function dosiDaChiarire(giorni = 3) {

  return out;

// Minuti di ritardo (positivi) o di anticipo (negativi) rispetto all'orario, per oggi.
const scartoMinuti = ora => minuti(oraAdesso()) - minuti(ora);
function descRitardo(min) {

}
function descGiorni(f) {

  return 'Tutti i giorni';
}
function descOrari(f) {
  if (f.giorni === 'bisogno') return 'Al bisogno';

}
// Quanto si dà ogni volta, in numeri: è lo stesso numero che toglie le medicine dalla scorta.
function quantoOgniVolta(f) { return f.qta != null ? quantita(f.qta, f.unita) : ''; }
// La terapia in una riga, da leggere accanto alla prescrizione.
function descTerapia(v) {
  if (v.giorni === 'bisogno') {
    const lim = [v.maxGiorno ? 'massimo ' + plur(Number(v.maxGiorno), 'volta', 'volte') + ' al giorno' : null, v.oreTra ? 'almeno ' + plur(Number(v.oreTra), 'ora', 'ore') + ' tra una e l\'altra' : null].filter(Boolean).join(', ');
    return 'Al bisogno: ' + quantoOgniVolta(v) + (lim ? ' · ' + lim : '') + (v.dose ? ' — «' + v.dose + '»' : '');
  }
  const orari = (v.orari || []).map(fmtOra);
  return quantoOgniVolta(v) + ' alle ' + (orari.length > 1 ? orari.slice(0, -1).join(', ') + ' e ' + orari[orari.length - 1] : orari.join('')) +
    ' · ' + descGiorni(v).toLowerCase() + (v.dal ? ' · dal ' + fmtD(v.dal) : '') + (v.al ? ' al ' + fmtD(v.al) : '') + (v.dose ? ' — «' + v.dose + '»' : '');
}
function usoAlGiorno(f) {
  if (!IN_TERAPIA(f)) return Number(f.alGiorno) || 0;
  if (f.giorni === 'bisogno') return Number(f.alGiorno) || 0;
  const q = Number(f.qta) || 0;
  const frazione = Array.isArray(f.giorni) ? f.giorni.length / 7 : 1;
  return q * f.orari.length * frazione;

// Scorta: dall'ultima conta tolgo le dosi segnate come date (stima per i vecchi farmaci).
function scorta(f, rif) {

  let rimaste;

    const passati = Math.max(0, giorniTra(f.contatoIl || rif, rif));
    rimaste = base - passati * (Number(f.alGiorno) || 0);
  }
  rimaste = Math.max(0, Math.round(rimaste * 10) / 10);
  const uso = usoAlGiorno(f);
  const giorni = uso > 0 ? Math.floor(rimaste / uso) : null;
  let scad = null;
  if (f.scadenza) {
    const n = giorniTra(rif, f.scadenza);
    scad = n < 0 ? 'scaduto' : n <= 30 ? '30' : n <= 60 ? '60' : null;
  }

// Quando far suonare il telefono nei prossimi giorni. Al servizio arrivano solo
// data, ora e una lettera; il testo resta sul telefono (e non contiene nomi).

function momenti(giorni = 14) {
  const out = [];
  const t0 = oggi();
  const ora0 = oraAdesso();
  const c = S.kv.sync || {};
  const oraMattino = c.ora || '08:30';
  const mie = mieVoci();
  const previste = visitePreviste();
  const aggiungi = (d, ora, x, testo, k) => {
    if (d === t0 && ora <= ora0) return;
    out.push({ t: d + 'T' + ora, x, testo, k: k || null });
  };
  for (let i = 0; i < giorni; i++) {
    const d = piuGiorni(t0, i);
    const scad = mie.filter(v => giorniTra(d, v.prossima) <= 0).length;
    const avvisi = mie.filter(v => { const n = giorniTra(d, v.prossima); return n > 0 && n <= (v.avviso || 0); }).length;
    const vis = previste.filter(v => v.data === d).length;
    const visArrivo = previste.filter(v => { const n = giorniTra(d, v.data); return n > 0 && n <= Math.max(1, v.avviso || 0); }).length;
    const slots = slotDel(d);
    const pezzi = [];
    if (i === 0) { const ch = dosiDaChiarire().length; if (ch) pezzi.push(plur(ch, 'medicina dei giorni scorsi da chiarire', 'medicine dei giorni scorsi da chiarire')); }
    if (scad) pezzi.push(plur(scad, 'cosa da fare', 'cose da fare'));
    if (avvisi) pezzi.push(plur(avvisi, 'scadenza in arrivo', 'scadenze in arrivo'));
    if (vis) pezzi.push(plur(vis, 'visita', 'visite'));
    if (visArrivo) pezzi.push(plur(visArrivo, 'visita in arrivo', 'visite in arrivo'));
    if (i === 0) { const fd = farmaciDaControllare().length; if (fd) pezzi.push(plur(fd, 'farmaco da ordinare', 'farmaci da ordinare')); }
    if (pezzi.length) aggiungi(d, oraMattino, 'm', 'Oggi: ' + pezzi.join(' · '));
    for (const s of slots) {
      if (!s.mancano) continue;   // già tutto segnato
      aggiungi(d, s.ora, 't', 'Medicine delle ' + fmtOra(s.ora) + ': ' + plur(s.mancano, 'medicina', 'medicine') + ' da dare');
      const dopo = piuMinuti(d, s.ora, 30);
      aggiungi(dopo.data, dopo.ora, 's', 'Medicine delle ' + fmtOra(s.ora) + ': qualcosa non è ancora segnato', d + 'T' + s.ora);
    }
    const fuori = rifiutiStasera(d);
    const sv = servizioDiTipo('rifiuti');
    if (fuori.length && sv) aggiungi(d, (sv.conf && sv.conf.ora) || '20:00', 'r', 'Stasera porta fuori: ' + fuori.join(', ').toLowerCase());
    for (const v of previste.filter(v => v.data === d && v.ora)) {
      const p = piuMinuti(d, v.ora, -60);
      aggiungi(p.data, p.ora, 'v', 'Tra un\'ora c\'è una visita');
    }
    // la sera prima di una visita a digiuno, un promemoria apposta
    if (previste.some(v => v.data === piuGiorni(d, 1) && /digiun/i.test((v.portare || '') + ' ' + (v.note || '')))) aggiungi(d, '20:00', 'v', 'Domani c\'è una visita a digiuno');
    for (const e of trasportiPrevisti().filter(e => e.data === d && e.ora)) {
      const p = piuMinuti(d, e.ora, -60);
      aggiungi(p.data, p.ora, 'v', 'Tra un\'ora c\'è un accompagnamento');
    }
  }
  return out.sort((a, b) => a.t.localeCompare(b.t)).slice(0, 700);
}

  const meta = [opz.ospite !== false && o ? o.nome : null, v.dove, v.accompagna ? 'accompagna ' + v.accompagna : null].filter(Boolean).join(' · ');
  const quando = fmt(v.data) + (v.ora ? ' ' + fmtOra(v.ora) : '');

    esc(passata ? 'Com\'è andata? Tocca per segnarlo' : fatta && v.esito ? v.esito.slice(0, 90) : v.stato === 'annullata' ? 'annullata' : meta) + '</span></span>' +
    '<span class="row-when">' + esc(quando) + '</span></a>';

function rigaSlot(s, opz = {}) {
  const oggiG = s.data === oggi();
  const ritardo = s.data < oggi() ? Infinity : oggiG ? scartoMinuti(s.ora) : -1;
  const finito = !s.mancano;
  const inRitardo = !finito && ritardo > 30;
  const cls = finito ? 'row-ok' : inRitardo ? 'row-rust' : '';
  const meta = finito ? 'Tutto segnato' + (s.nonDati ? ' · ' + s.nonDati + ' non date' : '')
    : (s.dati ? s.dati + ' date · ' : '') + plur(s.mancano, 'da dare', 'da dare') + (inRitardo && oggiG ? ' · ' + descRitardo(ritardo) : '');
  const passato = inRitardo;
  return '<a class="row ' + cls + '" href="#/giro/' + s.data + '/' + s.ora.replace(':', '') + (opz.ospite ? '?ospite=' + opz.ospite : '') + '">' +
    '<span class="dicon ' + (finito ? '' : passato ? 'rust' : 'plum') + '">' + ic(finito ? 'check' : 'clock', 21) + '</span>' +
    '<span class="row-main"><span class="row-title">Medicine delle ' + fmtOra(s.ora) + '</span><span class="row-meta">' + esc(meta) + '</span></span>' +
    '<span class="row-when">' + plur(s.dosi.length, 'farmaco', 'farmaci') + '</span>' + ic('chev', 20) + '</a>';
}

let toastTimer = null;
let toastAnnulla = null;
function avvisa(msg, annulla) {
  const t = document.getElementById('toast');
  document.getElementById('toast-t').textContent = msg;
  const b = document.getElementById('toast-b');
  toastAnnulla = annulla || null;
  b.classList.toggle('hidden', !annulla);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastAnnulla = null; }, annulla ? 7000 : 2800);
}
document.getElementById('toast-b').addEventListener('click', async () => {
  const f = toastAnnulla;
  toastAnnulla = null;
  document.getElementById('toast').classList.remove('show');
  if (f) await f();
});
function errore(id, msg) {
  const el = document.getElementById(id);
  if (el) el.textContent = msg;
  const campo = el && el.parentElement ? el.parentElement.querySelector('input:not([type=radio]):not([type=checkbox]),select,textarea') : null;
  if (campo) campo.focus();
  else if (el) el.scrollIntoView({ block: 'center' });
}

/* ===================================================== finestre di domanda */
// Al posto di OK/Annulla del browser: pulsanti grandi che dicono cosa succede.
// scelte: [{ valore, testo, tipo: 'primary' | 'ok' | 'danger' }]; "Annulla" (valore null) è sempre in fondo.
// Con opz.campo c'è anche una casella di testo: il risultato diventa { valore, nota }.
let finestraAperta = null;
// Una domanda aperta si chiude (come "Annulla") se si cambia pagina o se scatta il blocco col PIN:
// non deve restare utilizzabile sopra un'altra schermata.
function chiudiFinestre() { if (finestraAperta) finestraAperta(null); }
window.addEventListener('hashchange', chiudiFinestre);
function chiedi(opz) {
  chiudiFinestre();
  return new Promise(resolve => {
    const prima = document.activeElement;
    const velo = document.createElement('div');
    velo.className = 'velo';
    const scelte = (opz.scelte || []).concat(opz.senzaAnnulla ? [] : [{ valore: null, testo: opz.annulla || 'Annulla' }]);
    const cls = t => t === 'primary' ? 'btn-primary' : t === 'ok' ? 'btn-ok' : t === 'danger' ? 'btn-danger-pieno' : '';
    velo.innerHTML = '<div class="finestra" role="dialog" aria-modal="true" aria-labelledby="fin-t">' +
      (opz.icona ? '<div class="fin-ic ' + (opz.tono || '') + '">' + ic(opz.icona, 30) + '</div>' : '') +
      '<h2 id="fin-t">' + esc(opz.titolo || '') + '</h2>' + (opz.testo ? '<div class="fin-testo">' + opz.testo + '</div>' : '') +
      (opz.campo ? '<div class="field" style="margin-top:8px"><label for="fin-campo">' + esc(opz.campo.etichetta) + '</label>' +
        '<textarea id="fin-campo" maxlength="300" style="min-height:76px" placeholder="' + esc(opz.campo.ph || '') + '"></textarea><p class="err" id="fin-err"></p></div>' : '') +
      '<div class="fin-bottoni">' + scelte.map((s, i) => '<button type="button" class="btn ' + cls(s.tipo) + '" data-i="' + i + '">' + esc(s.testo) + '</button>').join('') + '</div></div>';
    const tasto = e => { if (e.key === 'Escape' && !opz.senzaAnnulla) { e.preventDefault(); chiudi(null); } };
    function chiudi(v) {
      if (finestraAperta === chiudi) finestraAperta = null;
      document.removeEventListener('keydown', tasto, true);
      velo.remove();
      document.body.classList.remove('con-velo');
      try { if (prima && prima.focus && prima.isConnected) prima.focus(); } catch (e) { /* niente */ }
      resolve(v);
    }
    velo.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (!b) { if (e.target === velo && !opz.senzaAnnulla) chiudi(null); return; }
      const s = scelte[Number(b.dataset.i)];
      if (!opz.campo) return chiudi(s.valore);
      if (s.valore === null) return chiudi(null);
      const campo = velo.querySelector('#fin-campo');
      const nota = campo.value.trim();
      if (opz.campo.controlla) {
        const err = opz.campo.controlla(nota, s.valore);
        if (err) { velo.querySelector('#fin-err').textContent = err; campo.focus(); return; }
      } else if (opz.campo.obbligatorio && !nota) {
        velo.querySelector('#fin-err').textContent = opz.campo.errore || 'Scrivi il motivo.'; campo.focus(); return;
      }
      chiudi({ valore: s.valore, nota });
    });
    document.addEventListener('keydown', tasto, true);
    finestraAperta = chiudi;
    document.body.appendChild(velo);
    document.body.classList.add('con-velo');
    const primo = opz.campo ? velo.querySelector('#fin-campo') : velo.querySelector('button[data-i]');
    if (primo) primo.focus({ preventScroll: true });
  });
}
// Domanda sì/no: il pulsante dice cosa succede ("Sì, elimina"), il no è sempre "No, lascia stare".
async function conferma(titolo, testo, si = 'Sì', opz = {}) {
  const v = await chiedi(Object.assign({ titolo, testo: testo ? '<p>' + esc(testo).replace(/\n/g, '<br>') + '</p>' : '',
    scelte: [{ valore: true, testo: si, tipo: opz.pericolo ? 'danger' : 'primary' }], annulla: opz.no || 'No, lascia stare' }, opz.extra || {}));
  return v === true;
}

let tentativiPin = 0, pinFermoFino = 0;
moduli.sblocca = async form => {
  if (Date.now() < pinFermoFino) { errore('err-pin', 'Troppi tentativi: riprova tra ' + Math.ceil((pinFermoFino - Date.now()) / 1000) + ' secondi.'); return; }

const nomiMancanti = s => [...new Set(s.dosi.filter(d => !d.sm).map(d => ((ospite(d.f.ospiteId) || {}).nome || '').split(' ')[0]))].filter(Boolean).join(', ');
// Cosa portare o sapere per una visita ("a digiuno!"), da leggere già nella lista.
function daSapereVisita(v) {
  const t = [v.portare, v.note].filter(Boolean).join(' · ');
  return t ? (t.length > 70 ? t.slice(0, 68) + '…' : t) : null;
}
// Tutto quello che c'è da fare oggi, in un'unica lista: prima le medicine in ritardo.
function coseDiOggi() {
  const t = oggi(), ora = oraAdesso();
  const cose = [];
  for (const s of slotDel(t)) {
    if (!s.mancano) continue;
    const nomi = nomiMancanti(s);
    const rit = scartoMinuti(s.ora);
    const inRitardo = rit > 30;
    cose.push({ ora: s.ora, titolo: 'Medicine delle ' + fmtOra(s.ora), meta: plur(s.mancano, 'da dare', 'da dare') + (nomi ? ' · ' + nomi : '') + (inRitardo ? ' · ' + descRitardo(rit) : ''),
      href: giroHref(s), azione: { href: giroHref(s), testo: 'Apri', tipo: 'p' }, medicine: true, cls: inRitardo ? 'rust' : '' });
  }
  for (const v of attive().filter(v => v.prossima <= t)) {
    const rit = v.prossima < t;
    const o = ospite(v.ospiteId);
    const meta = [v.importo != null ? euro(v.importo) : null, rit ? (ePagamento(v) ? 'scadeva ' : 'era per ') + fmt(v.prossima) : null,
      v.domiciliato ? 'addebito in banca: controlla che ci sia' : (v.responsabile && v.responsabile !== 'Entrambi' ? v.responsabile : null), o && !v.nome.includes(o.nome) ? o.nome : null].filter(Boolean).join(' · ');
    let azione;
    if (v.tipo === 'misura') azione = { href: '#/misura?voce=' + v.id, testo: 'Scrivi', tipo: 'p' };
    else if (v.domiciliato) azione = { href: '#/segna?voce=' + v.id, testo: 'Controllato' };
    else if (ePagamento(v)) azione = { href: '#/segna?voce=' + v.id, testo: 'Pagato' };
    else azione = { action: 'fatto-veloce', dati: { id: v.id }, testo: 'Fatto' };
    cose.push({ titolo: (ePagamento(v) && !v.domiciliato ? 'Pagare: ' : '') + v.nome, meta, href: '#/voce/' + v.id, azione, cls: rit ? 'rust' : '' });
  }
  for (const v of visitePreviste().filter(v => v.data <= t)) {
    const o = ospite(v.ospiteId);
    const prima = v.data < t;
    cose.push({ ora: prima ? null : v.ora, titolo: 'Visita: ' + (v.tipo || ''), meta: [o ? o.nome : null, prima ? 'era ' + fmt(v.data) + ': com\'è andata?' : v.accompagna && v.accompagna !== 'Da decidere' ? 'accompagna ' + v.accompagna : null, prima ? null : daSapereVisita(v)].filter(Boolean).join(' · '),
      href: '#/visita/' + v.id, azione: { href: '#/esito/' + v.id, testo: prima ? 'Scrivi' : 'Fatta' }, cls: prima ? 'amber' : '' });
  }
  for (const e of trasportiPrevisti().filter(e => e.data <= t)) {
    const o = ospite(e.ospiteId);
    cose.push({ ora: e.data === t ? e.ora : null, titolo: 'Uscita: ' + (e.dove || ''), meta: [o ? o.nome : null, e.accompagna && e.accompagna !== 'Da decidere' ? 'accompagna ' + e.accompagna : null].filter(Boolean).join(' · '),
      href: '#/trasporto?id=' + e.id, azione: { action: 'trasporto-fatto', dati: { id: e.id }, testo: 'Fatto' }, cls: e.data < t ? 'rust' : '' });
  }
  for (const e of guastiAperti().filter(e => e.urgente)) {
    cose.push({ titolo: 'Guasto urgente: ' + e.cosa, meta: [e.dove, STATI_GUASTO[e.stato], 'segnalato ' + fmt(e.data) + (e.chi ? ' da ' + e.chi : '')].filter(Boolean).join(' · '),
      href: '#/guasto?id=' + e.id, azione: { href: '#/guasto?id=' + e.id, testo: 'Apri', tipo: 'p' }, cls: 'rust' });
  }
  const fuori = rifiutiStasera(t);
  if (fuori.length && !S.eventi.some(e => e.tipo === 'rifiuti' && e.data === t)) {
    const sv = servizioDiTipo('rifiuti');
    cose.push({ ora: (sv && sv.conf && sv.conf.ora) || '20:00', titolo: 'Portare fuori: ' + fuori.join(', ').toLowerCase(), meta: 'Domani mattina passa la raccolta', azione: { action: 'rifiuti-fuori', dati: { servizio: sv ? sv.id : '' }, testo: 'Fatto' } });
  }
  const ordinare = farmaciDaControllare().filter(x => (x.s.daRiordinare || x.s.finito) && !x.f.ordinatoIl);
  if (ordinare.length) cose.push({ titolo: 'Ordinare le medicine', meta: ordinare.slice(0, 3).map(x => x.f.nome).join(', ') + (ordinare.length > 3 ? '…' : ''), azione: { href: '#/ordina', testo: 'Ordina', tipo: 'p' }, cls: 'amber' });
  const inAttesa = ordiniInRitardo();
  if (inAttesa.length) cose.push({ titolo: 'Medicine ordinate, non ancora arrivate', meta: inAttesa.slice(0, 3).map(f => f.nome + ' (ordinato ' + fmt(f.ordinatoIl) + ')').join(', ') + (inAttesa.length > 3 ? '…' : ''),

// Il riepilogo del turno lo prepara l'app: chi scrive aggiunge solo quello che serve davvero.
function riepilogoTurno() {
  const t = oggi(), ora = oraAdesso();
  const righe = [];
  const primoNome = id => ((ospite(id) || {}).nome || '').split(' ')[0];
  const slots = slotDel(t).filter(s => s.ora <= ora);
  const nonDate = [], senzaEsito = [];
  for (const s of slots) for (const d of s.dosi) {
    if (!d.sm) senzaEsito.push(d.f.nome + ' (' + primoNome(d.f.ospiteId) + ', ' + fmtOra(s.ora) + ')');
    else if (d.sm.esito === 'nondato') nonDate.push(d.f.nome + ' (' + primoNome(d.f.ospiteId) + ', ' + fmtOra(s.ora) + ': ' + String(d.sm.motivo || '').toLowerCase() + ')');
  }
  const dati = slots.reduce((a, s) => a + s.dati, 0);
  if (slots.length) righe.push('Medicine fin qui: ' + plur(dati, 'data', 'date') + (nonDate.length ? ', ' + nonDate.length + ' non date' : '') + (senzaEsito.length ? ', ' + senzaEsito.length + ' ancora da segnare' : '') + '.');
  if (nonDate.length) righe.push('Non date: ' + nonDate.join('; ') + '.');
  if (senzaEsito.length) righe.push('Da segnare: ' + senzaEsito.join('; ') + '.');
  const bisogno = sommDelGiorno(t).filter(x => x.bisogno && x.esito === 'dato');
  if (bisogno.length) righe.push('Al bisogno: ' + bisogno.map(x => ((farmaco(x.farmacoId) || {}).nome || x.nome || 'farmaco') + ' a ' + primoNome(x.ospiteId) + ' alle ' + fmtOra(x.ora)).join('; ') + '.');
  const restano = coseDiOggi().adesso.filter(c => !c.medicine).map(c => c.titolo);
  if (restano.length) righe.push('Ancora da fare: ' + restano.slice(0, 6).join('; ') + (restano.length > 6 ? '…' : '') + '.');
  const guasti = guastiAperti();
  if (guasti.length) righe.push('Guasti aperti: ' + guasti.map(g => g.cosa + (g.urgente ? ' (urgente)' : '')).join('; ') + '.');
  const visite = S.visite.filter(v => v.data === t);
  if (visite.length) righe.push('Visite di oggi: ' + visite.map(v => (v.tipo || 'visita') + ' di ' + primoNome(v.ospiteId) + (v.stato === 'fatta' ? ' (fatta)' : v.stato === 'annullata' ? ' (annullata)' : ' (da segnare)')).join('; ') + '.');
  return righe.join('\n');
}

function calendario(eventi) {
  const ora = new Date();
  const mesi = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(ora.getFullYear(), ora.getMonth() - i, 1);
    const k = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const n = eventi.filter(e => String(e.data).slice(0, 7) === k).length;
    mesi.push({ mese: MESI[d.getMonth()], lungo: MESI_L[d.getMonth()] + ' ' + d.getFullYear(), n });
  }
  return '<div class="cal12" role="list" aria-label="Ultimi 12 mesi">' + mesi.map(m =>
    '<div role="listitem" class="m' + (m.n ? ' si' : '') + '" aria-label="' + esc(m.lungo + ': ' + (m.n ? plur(m.n, 'volta', 'volte') : 'niente')) + '">' +
    esc(m.mese) + '<b aria-hidden="true">' + (m.n ? (m.n > 1 ? m.n : '✓') : '–') + '</b></div>').join('') + '</div>';
}

moduli.fatto = async (form, e) => {

  const servizioId = sel.startsWith('s:') ? sel.slice(2) : (v ? sid(v.servizio) : null);
  const pagato = fd.get('pagato') === 'on';
  const importo = pagato ? numero(fd.get('importo')) : null;
  const chi = String(fd.get('chi') || '');
  const docId = await salvaFileDelModulo(form, { nome: (pagato ? 'Ricevuta ' : 'Foto ') + (cosa || (v ? v.nome : (servizio(servizioId) || {}).nome) || '') + ' ' + fmt(data),
    tipo: pagato ? 'Ricevuta' : 'Altro', ospiteId: v ? v.ospiteId || null : null, voceId: v ? v.id : null, data });
  await salva('eventi', { id: uid(), voceId: v ? v.id : null, servizio: servizioId, ospiteId: v ? v.ospiteId || null : null, data,
    chi: chi === 'Non ricordo' ? null : chi, tipo: pagato ? 'pagato' : 'fatto', importo, nota: cosa || null, docId, creato: adesso(), passato: true });
  const poi = e && e.submitter ? e.submitter.value : 'fine';
  avvisa('Aggiunta al diario');
  if (poi === 'altra') {
    const n = (parseInt(new URLSearchParams(location.hash.split('?')[1] || '').get('fatte'), 10) || 0) + 1;
    vai('#/gia-fatto?sel=' + encodeURIComponent(sel) + '&fatte=' + n, true);
  } else if (v) vai('#/voce/' + v.id, true);

/* ========================================================== Ospiti */

function vOspiti(q) {
  const ex = q.get('vista') === 'ex';
  const destra = '<a class="icon-btn primary" href="#/nuovo-ospite" aria-label="Aggiungi un ospite">' + ic('plus') + '</a>';
  const lista = ex ? S.ospiti.filter(o => o.attivo === false).sort(perNome) : ospitiAttivi();
  let h = testata(ex ? 'Non più ospiti' : 'Ospiti', { sub: ex ? '' : plur(lista.length, 'ospite', 'ospiti'), destra, indietro: ex }) + '<main class="pad">';
  if (!lista.length) h += '<p class="empty">' + (ex ? 'Nessuno.' : 'Nessun ospite ancora.') + '</p>' + (ex ? '' : '<a class="btn btn-primary" href="#/nuovo-ospite">' + ic('plus') + ' Aggiungi un ospite</a>');
  const t = oggi();
  h += lista.map(o => {
    const slots = slotDel(t, o.id);
    const inRitardo = slots.filter(s => s.mancano && scartoMinuti(s.ora) > 30).length;
    const daDare = slots.filter(s => s.mancano && s.ora <= oraAdesso()).length;
    const vs = attive().filter(v => v.ospiteId === o.id);
    const rit = vs.filter(v => stato(v) === 'ritardo').length;
    const pv = visitePreviste().find(v => v.ospiteId === o.id);
    const nf = S.farmaci.filter(f => f.ospiteId === o.id && farmacoAttivo(f, t)).length;
    const pezzi = [];
    if (inRitardo) pezzi.push('medicine in ritardo');
    else if (daDare) pezzi.push('medicine da dare adesso');
    if (rit) pezzi.push(plur(rit, 'cosa in ritardo', 'cose in ritardo'));
    if (pv) pezzi.push((pv.tipo || 'visita') + ' ' + fmt(pv.data));
    if (!pezzi.length) pezzi.push(nf ? plur(nf, 'farmaco in terapia', 'farmaci in terapia') : 'nessuna terapia inserita');
    return '<a class="row ' + (inRitardo || rit ? 'row-rust' : '') + '" href="#/ospite/' + o.id + '">' + avatar(o) + '<span class="row-main"><span class="row-title">' + esc(o.nome) + '</span><span class="row-meta">' + esc(pezzi.join(' · ')) + '</span></span>' + ic('chev', 20) + '</a>';
  }).join('');
  const nEx = S.ospiti.filter(o => o.attivo === false).length;
  if (!ex && nEx) h += '<a class="btn btn-sm" style="margin-top:10px" href="#/ospiti?vista=ex">Non più ospiti (' + nEx + ')</a>';
  return h + '</main>' + barra('ospiti');
}

function vOspite(id, sotto, q) {
  const o = ospite(id);
  if (!o) return nonTrovato();
  switch (sotto) {
    case 'terapia': return vOspiteTerapia(o, q);
    case 'visite': return vOspiteVisite(o);
    case 'parametri': return vOspiteParametri(o);

function prossimoCodice() {
  let n = 1;
  const usati = new Set(S.ospiti.map(o => o.codice));
  while (usati.has('OSP-' + pad(n))) n++;
  return 'OSP-' + pad(n);
}
// Una foto quadrata piccola (circa 20 KB): sta dentro la scheda dell'ospite e viaggia cifrata con il resto.
async function fotoPiccola(file, lato = 240) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas');
  c.width = lato; c.height = lato;
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, lato, lato);
  return c.toDataURL('image/jpeg', 0.8);
}
moduli.ospite = async form => {
  const fd = new FormData(form);

  const codice = String(fd.get('codice') || '').trim() || prossimoCodice();
  if (S.ospiti.some(x => x.codice === codice && (!vecchio || x.id !== vecchio.id))) { errore('err-codice', 'Questo codice è già di un altro ospite.'); return; }
  const nascita = String(fd.get('nascita') || '');
  const o = Object.assign({}, vecchio || { creato: adesso(), attivo: true }, {
    id: vecchio ? vecchio.id : uid(), nome, codice,

    medico: String(fd.get('medico') || '').trim() || null,
    note: String(fd.get('note') || '').trim() || null
  });
  const file = fileScelto(form);

};

// La storia della terapia: com'è adesso e com'era prima, con chi l'ha cambiata e perché.
function storiaTerapia(f) {
  const righe = [];
  const inizio = giornoDi(f.versioneDa || f.creato);
  righe.push(rigaVersione((f.sospeso ? 'Sospesa' + (f.sospesoIl ? ' dal ' + fmtD(f.sospesoIl) : '') + (f.motivoSospensione ? ' — ' + f.motivoSospensione : '') + '. Prima: ' : 'Adesso') + (inizio ? ' (dal ' + fmtD(inizio) + ')' : ''), f, descCambio(f.cambio)));
  for (const p of (f.pause || []).slice().reverse()) righe.push('<div class="gi" style="cursor:default"><span class="row-main"><span class="row-title">Sospesa dal ' + esc(fmtD(p.dal)) + ' al ' + esc(fmtD(piuGiorni(p.al, -1))) + '</span>' + (p.motivo ? '<span class="row-meta">' + esc(p.motivo) + '</span>' : '') + '</span></div>');
  for (const v of (f.storia || []).slice().reverse()) {
    const da = giornoDi(v.versioneDa), a = piuGiorni(v.fino, -1);
    righe.push(rigaVersione(da && da > a ? 'Per poco, il ' + fmtD(da) + ' (cambiata subito)' : 'Dal ' + fmtD(da) + ' al ' + fmtD(a), v, descCambio(v.cambio)));
  }
  return '<div class="group storia">' + righe.join('') + '</div>';
}

// Per confrontare due versioni della terapia senza farsi ingannare da campi vuoti o dall'ordine.
function normTerapia(v) {
  const o = {};
  for (const k of CAMPI_TERAPIA) {
    let x = v[k];
    if (x === undefined || x === '' || (typeof x === 'number' && isNaN(x))) x = null;
    if (Array.isArray(x)) x = x.slice().sort();
    if (k === 'qta' || k === 'maxGiorno' || k === 'oreTra') x = x == null ? null : Number(x);
    o[k] = x;
  }
  return JSON.stringify(o);
}

async function controllaOrario(fs, d, ora, singolo) {
  const t = oggi();
  if (d > t) { await chiedi({ titolo: 'Non ancora', icona: 'clock', tono: 'amber', testo: '<p>Queste medicine sono di ' + esc(fmtGiorno(d).toLowerCase()) + ': si segnano quel giorno.</p>', annulla: 'Ho capito' }); return null; }
  const scarto = d === t ? scartoMinuti(ora) : null;
  if (d === t && Math.abs(scarto) <= FINESTRA_DOSE) return {};
  // le altre dosi dello stesso farmaco oggi, vicine a adesso: il rischio di raddoppiare è lì
  const avvisi = [];
  if (d === t) for (const f of fs) for (const s of slotDel(t, f.ospiteId)) {
    if (s.ora === ora || Math.abs(scartoMinuti(s.ora)) > 180) continue;
    const x = s.dosi.find(x => x.f.id === f.id);
    if (x) avvisi.push(f.nome + ': c\'è anche la dose delle ' + fmtOra(s.ora) + (x.sm ? (x.sm.esito === 'dato' ? ', già data' : ', non data') : ', ancora da dare') + '.');
  }
  const att = avvisi.length ? '<span class="att">' + avvisi.map(esc).join('<br>') + '</span>' : '';
  const quali = fs.length === 1 ? '<b>' + esc(fs[0].nome) + '</b>' : 'queste ' + fs.length + ' medicine (' + esc(fs.map(f => f.nome).join(', ')) + ')';
  if (d === t && scarto < -FINESTRA_DOSE) {
    const v = await chiedi({ titolo: 'È presto', icona: 'clock', tono: 'amber',
      testo: '<p>' + quali + ': è la dose delle <b>' + fmtOra(ora) + '</b> e sono le <b>' + fmtOra(oraAdesso()) + '</b>.</p><p>La stai dando adesso, in anticipo?</p>' + att,
      scelte: [{ valore: 'anticipo', testo: 'Sì, la do adesso', tipo: 'ok' }], annulla: 'No, torno indietro' });
    return v ? { fuoriOrario: 'anticipo' } : null;
  }
  const quando = d === t ? 'delle <b>' + fmtOra(ora) + '</b> e sono le <b>' + fmtOra(oraAdesso()) + '</b>' : 'di <b>' + esc(fmtGiorno(d).toLowerCase()) + ' alle ' + fmtOra(ora) + '</b>';
  const scelte = [{ valore: 'inorario', testo: d === t ? 'Era stata data in orario: non era segnata' : 'Era stata data: non era segnata', tipo: 'ok' }];
  if (d === t) scelte.push({ valore: 'ritardo', testo: 'La do adesso, in ritardo', tipo: 'primary' });
  if (singolo) scelte.push({ valore: 'nondato', testo: 'Non è stata data' });
  const v = await chiedi({ titolo: d === t ? 'Dose in ritardo' : 'Dose di un giorno passato', icona: 'warn', tono: 'rust',
    testo: '<p>' + quali + ': è la dose ' + quando + '.</p><p>Cosa è successo?</p>' + att +
      (d === t && scarto > 120 ? '<p class="hint" style="margin-top:10px">Se è passato molto tempo o è vicina la dose successiva, prima di darla chiedi al medico.</p>' : ''), scelte, annulla: 'Annulla' });
  if (!v) return null;
  if (v === 'nondato') return { nondato: true };
  return v === 'inorario' ? { segnataDopo: true } : { fuoriOrario: 'ritardo' };
}

  // un valore impossibile è quasi sempre un errore di battitura (366 invece di 36,6)
  const nums = valoriParametro({ valore });
  const fuori = tipo === 'pressione' ? nums.some((n, i) => LIMITI_PRESSIONE[i] && (n < LIMITI_PRESSIONE[i][0] || n > LIMITI_PRESSIONE[i][1]))
    : LIMITI_MISURE[tipo] ? nums.length !== 1 || nums[0] < LIMITI_MISURE[tipo][0] || nums[0] > LIMITI_MISURE[tipo][1] : false;
  if (fuori) {
    const p = parametro(tipo);
    const ok = await chiedi({ titolo: 'Valore insolito', icona: 'warn', tono: 'amber',
      testo: '<p>Hai scritto <b>' + esc(valore + ' ' + p.u) + '</b> per ' + esc(p.nome.toLowerCase()) + '. Controlla di averlo scritto bene' + (p.ph ? ' (' + esc(p.ph) + ')' : '') + '.</p><p>Se il valore è giusto ed è preoccupante, avvisa il medico.</p>',

function grafico(serie, colori) {
  const W = 340, H = 170, P = 30;
  const tutti = serie.flatMap(s => s.punti.map(p => p.y));
  if (tutti.length < 2) return '';
  let min = Math.min(...tutti), max = Math.max(...tutti);
  if (max - min < 1) { max += 1; min -= 1; }
  const marg = (max - min) * .15;
  min -= marg; max += marg;
  const n = Math.max(...serie.map(s => s.punti.length));
  const x = i => P + (n === 1 ? 0 : i * (W - P - 10) / (n - 1));
  const y = v => H - 20 - (v - min) * (H - 40) / (max - min);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Andamento">';
  for (let k = 0; k <= 2; k++) {
    const v = min + (max - min) * k / 2;
    svg += '<line x1="' + P + '" x2="' + (W - 6) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E4DED3"/><text x="2" y="' + (y(v) + 4) + '" font-size="11" fill="#5E655F">' + Math.round(v) + '</text>';
  }
  serie.forEach((s, j) => {
    const pts = s.punti.map((p, i) => x(i) + ',' + y(p.y)).join(' ');
    svg += '<polyline points="' + pts + '" fill="none" stroke="' + colori[j] + '" stroke-width="2.5" stroke-linejoin="round"/>';
    s.punti.forEach((p, i) => { svg += '<circle cx="' + x(i) + '" cy="' + y(p.y) + '" r="3.5" fill="' + colori[j] + '"/>'; });
  });
  const pr = serie[0].punti;
  svg += '<text x="' + P + '" y="' + (H - 4) + '" font-size="11" fill="#5E655F">' + esc(fmt(pr[0].d)) + '</text><text x="' + (W - 6) + '" y="' + (H - 4) + '" font-size="11" fill="#5E655F" text-anchor="end">' + esc(fmt(pr[pr.length - 1].d)) + '</text>';
  return '<div class="grafico">' + svg + '</svg>' + (serie.length > 1 ? '<div class="hint" style="padding:0 6px 6px">' + serie.map((s, j) => '<span style="color:' + colori[j] + ';font-weight:800">●</span> ' + esc(s.nome)).join('  ') + '</div>' : '') + '</div>';
}
function vParametro(ospiteId, tipo) {
  const o = ospite(ospiteId);
  if (!o) return nonTrovato();
  const p = parametro(tipo);
  const m = misure(o.id, tipo);
  let h = testata(p.nome, { indietro: true, sub: o.nome + (p.u ? ' · ' + p.u : '') }) + '<main class="pad">';
  h += '<a class="btn btn-primary" href="#/misura?ospite=' + o.id + '&tipo=' + encodeURIComponent(tipo) + '">' + ic('plus', 21) + ' Nuova misura</a>';
  const ultimi = m.slice(-20);
  if (ultimi.length >= 2) {
    const vals = ultimi.map(valoriParametro);
    const serie = p.doppio ? [{ nome: 'Massima', punti: ultimi.map((x, i) => ({ d: x.data, y: vals[i][0] })).filter(z => z.y != null) }, { nome: 'Minima', punti: ultimi.map((x, i) => ({ d: x.data, y: vals[i][1] })).filter(z => z.y != null) }]
      : [{ nome: p.nome, punti: ultimi.map((x, i) => ({ d: x.data, y: vals[i][0] })).filter(z => z.y != null) }];
    h += grafico(serie.filter(s => s.punti.length >= 2), ['#4A2C0C', '#2F9FD8']);

function riassuntoServizio(sv) {
  const voci = vociServizio(sv.id);
  const rit = voci.filter(v => stato(v) === 'ritardo').length;
  switch (sv.tipo) {
    case 'pagamenti': {
      const p = attive().filter(ePagamento);
      const r = p.filter(v => stato(v) === 'ritardo' && !v.domiciliato).length;
      const prossimi = p.filter(v => !v.domiciliato && giorniTra(oggi(), v.prossima) <= 30).length;
      return { urgente: r > 0, testo: r ? plur(r, 'in ritardo', 'in ritardo') : prossimi ? prossimi + ' da pagare entro 30 giorni' : 'niente in scadenza' };
    }
    case 'spesa': {
      const n = S.lista.filter(x => x.servizio === sv.id && !x.preso).length;
      return { testo: n ? plur(n, 'cosa da comprare', 'cose da comprare') : 'lista vuota' };
    }
    case 'lavanderia': {
      const n = lavanderiaFuori().filter(e => e.servizio === sv.id).length;
      return { testo: n ? plur(n, 'consegna fuori', 'consegne fuori') : 'niente fuori' };
    }
    case 'rifiuti': {
      const r = rifiutiStasera();
      return { testo: r.length ? 'stasera: ' + r.join(', ').toLowerCase() : 'stasera niente' };
    }
    case 'manutenzioni': {
      const n = guastiAperti().filter(e => e.servizio === sv.id).length;
      return { urgente: rit > 0, testo: n ? plur(n, 'guasto da sistemare', 'guasti da sistemare') : rit ? 'controllo in ritardo' : 'tutto a posto' };
    }
    case 'trasporti': {
      const p = prossimiAccompagnamenti()[0];
      return { testo: p ? 'prossimo ' + fmt(p.data) : 'nessuno in programma' };
    }
    case 'farmacia': {
      const n = farmaciDaControllare().length;
      return { urgente: farmaciDaControllare().some(x => x.s.finito || x.s.scad === 'scaduto'), testo: n ? plur(n, 'da ordinare o controllare', 'da ordinare o controllare') : 'scorte a posto' };
    }
  }
  const ult = S.eventi.filter(e => sid(e.servizio) === sv.id).sort(recenti)[0];
  return { urgente: rit > 0, testo: rit ? 'in ritardo' : voci[0] ? 'prossima ' + fmt(voci[0].prossima) : ult ? 'ultima ' + fmt(ult.data) : 'tocca per segnare' };
}

async function spostaServizio(id, dir) {
  const lista = serviziOrdinati();
  const i = lista.findIndex(s => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  for (let k = 0; k < lista.length; k++) if (lista[k].ordine !== k + 1) { lista[k].ordine = k + 1; await salva('servizi', lista[k]); }
  render();
}

function vPagamenti(sv, q) {
  const cat = q.get('cat') || '';
  const tutti = attive().filter(ePagamento).filter(v => !cat || (v.pag || 'Altro') === cat).sort(perData);
  const manuali = tutti.filter(v => !v.domiciliato);
  const rit = manuali.filter(v => v.prossima < oggi());
  const presto = manuali.filter(v => v.prossima >= oggi() && giorniTra(oggi(), v.prossima) <= 30);
  const dopo = manuali.filter(v => giorniTra(oggi(), v.prossima) > 30);
  const dom = tutti.filter(v => v.domiciliato);
  const totale = presto.concat(rit).reduce((a, v) => a + (v.importo || 0), 0);
  const cats = [...new Set(attive().filter(ePagamento).map(v => v.pag || 'Altro'))].sort();
  let h = testaServizio(sv, rit.length ? plur(rit.length, 'pagamento in ritardo', 'pagamenti in ritardo') : presto.length ? presto.length + ' da pagare entro 30 giorni' + (totale ? ' · ' + euro(totale) : '') : 'Niente da pagare a breve') + '<main class="pad">';
  h += '<a class="btn btn-primary" href="#/avviso-pagamento">' + ic('plus', 21) + ' È arrivato un avviso di pagamento</a>' +
    '<a class="btn btn-sm" href="#/nuova-voce?servizio=' + sv.id + '&pag=1">' + ic('cal', 20) + ' Pagamento che si ripete (assicurazione, quote…)</a>';
  if (cats.length > 1) h += '<div class="seg" style="margin-top:6px"><a class="' + (cat ? '' : 'on') + '" href="#/servizio/' + sv.id + '">Tutti</a>' + cats.map(c => '<a class="' + (c === cat ? 'on' : '') + '" href="#/servizio/' + sv.id + '?cat=' + encodeURIComponent(c) + '">' + esc(c) + '</a>').join('') + '</div>';
  if (rit.length) h += sezione('In ritardo', rit.length, 'rust') + rit.map(v => rigaVoce(v)).join('');
  h += sezione('Da pagare entro 30 giorni', presto.length) + (presto.length ? presto.map(v => rigaVoce(v)).join('') : '<p class="empty">Niente.</p>');
  if (dopo.length) h += sezione('Più avanti', dopo.length) + dopo.map(v => rigaVoce(v)).join('');
  if (dom.length) h += sezione('Si pagano da soli', dom.length) + '<p class="hint" style="margin:0 2px">Addebito in banca: non vanno pagati a mano. Basta controllare che l\'addebito ci sia.</p>' + dom.map(v => rigaVoce(v)).join('');
  const pagati = S.eventi.filter(e => e.tipo === 'pagato').sort(recenti);
  h += sezione('Pagati di recente', null, '', '<a class="destra" href="#/fatto?f=pagamenti">Tutti</a>') + (pagati.length ? pagati.slice(0, 8).map(rigaDiarioEvento).join('') : '<p class="empty">Ancora nessuno.</p>');
  h += '<a class="btn btn-sm" href="#/gia-fatto?servizio=' + sv.id + '">' + ic('plus', 20) + ' Aggiungi un pagamento già fatto</a>';
  return h + '</main>' + barra('casa');
}

/* ---------- spesa */
function vSpesa(sv) {
  const lista = S.lista.filter(x => x.servizio === sv.id);
  const daPrendere = lista.filter(x => !x.preso).sort((a, b) => (a.creato || '').localeCompare(b.creato || ''));
  const presi = lista.filter(x => x.preso);
  const nomi = new Set(lista.map(x => semplifica(x.testo)));
  const conta = {};
  S.eventi.filter(e => e.tipo === 'spesa' && Array.isArray(e.articoli)).forEach(e => e.articoli.forEach(a => { const k = String(a).trim(); if (k && !nomi.has(semplifica(k))) conta[k] = (conta[k] || 0) + 1; }));
  const suggeriti = Object.keys(conta).sort((a, b) => conta[b] - conta[a]).slice(0, 10);

function prossimiAccompagnamenti() {
  const vis = visitePreviste().filter(v => v.data >= oggi() && v.accompagna && !['Nessuno', 'Un familiare'].includes(v.accompagna)).map(v => ({ tipo: 'visita', data: v.data, ora: v.ora, v }));
  const tr = trasportiPrevisti().map(e => ({ tipo: 'trasporto', data: e.data, ora: e.ora, e }));
  return vis.concat(tr).sort((a, b) => (a.data + (a.ora || '')).localeCompare(b.data + (b.ora || '')));
}

function numeroWhatsApp(t) {
  let n = String(t || '').replace(/\D/g, '');

  if (n.length <= 11 && (n.startsWith('3') || n.startsWith('0'))) n = '39' + n;
  return n;
}

    case 'correzione': return { registro: true, icona: 'edit', cls: 'amber', titolo: e.nota || 'Correzione', meta: [chi, o ? o.nome : null].filter(Boolean).join(' · '), f: 'terapia' };
    case 'spesa': return { icona: 'cart', titolo: 'Spesa' + (e.articoli && e.articoli.length ? ': ' + e.articoli.join(', ') : ''), meta: [chi, e.importo != null ? euro(e.importo) : null, e.nota].filter(Boolean).join(' · '), f: 'servizi' };

    case 'pulizia': return { icona: 'spark', titolo: 'Pulizie: ' + (e.zona || ''), meta: chi, f: 'servizi' };
    case 'rifiuti': return { icona: 'trash', titolo: 'Rifiuti fuori' + (e.nota ? ': ' + e.nota : ''), meta: chi, f: 'servizi' };
    case 'guasto': return { icona: 'tool', titolo: 'Guasto: ' + e.cosa, meta: [STATI_GUASTO[e.stato], e.dove, chi, e.importo != null ? euro(e.importo) : null].filter(Boolean).join(' · '), f: 'servizi', href: '#/guasto?id=' + e.id };

// Tutto quello che è stato fatto e scritto: cose fatte, medicine, visite, misure, note, consegne.
function vociFatto(filtroOspite, filtroServizio) {
  const out = [];
  for (const e of S.eventi) {
    if ((e.tipo === 'trasporto' && !e.fatto) || (e.tipo === 'guasto' && e.stato !== 'risolto')) continue;
    if (filtroOspite && e.ospiteId !== filtroOspite) continue;
    if (filtroServizio && sid(e.servizio) !== filtroServizio) continue;
    out.push(Object.assign(testoEvento(e), { data: e.data, ora: e.ora, ord: (e.data || '') + (e.ora || '') + (e.creato || '') }));
  }
  if (filtroServizio) return out;
  // terapia: una riga per ogni orario, non una per farmaco
  const slot = new Map();
  for (const x of S.somministrazioni) {
    if (filtroOspite && x.ospiteId !== filtroOspite) continue;
    if (x.bisogno) {
      const f = farmaco(x.farmacoId), o = ospite(x.ospiteId);
      out.push({ icona: 'pill', titolo: 'Al bisogno: ' + (f ? f.nome : x.nome || 'farmaco'), meta: [o ? o.nome : null, x.chi, x.nota].filter(Boolean).join(' · '), f: 'terapia', data: x.data, ora: x.ora, ord: x.data + x.ora, cls: 'plum' });
      continue;
    }
    const k = x.data + 'T' + x.ora;
    if (!slot.has(k)) slot.set(k, []);
    slot.get(k).push(x);
  }
  for (const [k, xs] of slot) {
    const [d, ora] = k.split('T');
    const nd = xs.filter(x => x.esito === 'nondato');
    const chi = [...new Set(xs.map(x => x.chi).filter(Boolean))].join(', ');
    const nomeF = x => (farmaco(x.farmacoId) || {}).nome || x.nome || '';
    const nomi = nd.map(x => nomeF(x) + (filtroOspite ? '' : ' a ' + ((ospite(x.ospiteId) || {}).nome || '')) + ' (' + (x.motivo || '').toLowerCase() + ')');
    out.push({ icona: 'pill', cls: nd.length ? 'amber' : 'plum', titolo: 'Medicine delle ' + fmtOra(ora) + ': ' + plur(xs.length - nd.length, 'data', 'date') + (nd.length ? ', ' + nd.length + ' non ' + (nd.length === 1 ? 'data' : 'date') : ''),
      meta: (nomi.length ? nomi.join(', ') + ' · ' : '') + (chi ? 'segnato da ' + chi : ''), extra: xs.map(x => nomeF(x) + ' ' + ((ospite(x.ospiteId) || {}).nome || '')).join(' '),
      f: 'terapia', data: d, ora, ord: d + ora, href: '#/giro/' + d + '/' + ora.replace(':', '') + (filtroOspite ? '?ospite=' + filtroOspite : '') });
  }
  for (const v of S.visite) {
    if (v.stato !== 'fatta' || (filtroOspite && v.ospiteId !== filtroOspite)) continue;
    const o = ospite(v.ospiteId);
    out.push({ icona: 'steth', titolo: 'Visita: ' + (v.tipo || '') + (o && !filtroOspite ? ' — ' + o.nome : ''), meta: (v.esito || '') + (v.terapiaCambiata ? ' · terapia cambiata' : '') + (v.fattaChi ? ' · ' + v.fattaChi : ''), f: 'salute', data: v.data, ora: v.ora, ord: v.data + (v.ora || ''), href: '#/visita/' + v.id });
  }
  for (const p of S.parametri) {
    if (filtroOspite && p.ospiteId !== filtroOspite) continue;
    const o = ospite(p.ospiteId), par = parametro(p.tipo);
    out.push({ icona: 'heart', titolo: par.nome + ' ' + p.valore + ' ' + par.u + (o && !filtroOspite ? ' — ' + o.nome : ''), meta: [p.chi, p.nota].filter(Boolean).join(' · '), f: 'salute', data: p.data, ora: p.ora, ord: p.data + (p.ora || ''), href: '#/parametro/' + p.ospiteId + '/' + encodeURIComponent(p.tipo) });
  }
  return out;
}

const FILTRI_FATTO = [['', 'Tutto'], ['terapia', 'Medicine'], ['salute', 'Visite e misure'], ['note', 'Note e consegne'], ['pagamenti', 'Pagamenti'], ['servizi', 'Casa']];

  const o = ospite(filtroOspite), sv = servizio(filtroServizio);
  const base = '#/fatto?' + (filtroOspite ? 'ospite=' + filtroOspite + '&' : '') + (filtroServizio ? 'servizio=' + filtroServizio + '&' : '');
  let items = vociFatto(filtroOspite, sv ? sv.id : '').filter(x => !f || x.f === f).filter(x => x.data && x.data <= oggi());
  items.sort((a, b) => (b.ord || '').localeCompare(a.ord || ''));
  const troppi = items.length > 1500;
  items = items.slice(0, 1500);
  let h = testata(o ? 'Diario di ' + o.nome : sv ? 'Fatto: ' + sv.nome : 'Diario', { sub: 'Cosa è stato fatto e scritto, giorno per giorno', indietro: !!(o || sv) }) + '<main class="pad">';

  let giorno = '', n = 0;
  for (const it of items) {
    if (it.data !== giorno) { if (giorno) h += '</div>'; giorno = it.data; n++; h += '<div data-gruppo="g' + n + '"><div class="giorno-testa">' + esc(fmtGiorno(giorno)) + '</div>'; }

  }
  if (giorno) h += '</div>';
  if (!items.length) h += '<p class="empty">Ancora niente. Quando segnate qualcosa come fatto, o scrivete una nota, compare qui.</p>';
  h += '<p class="empty hidden" id="nessun-risultato">Nessun risultato. Prova con un\'altra parola.</p>';
  if (troppi) h += '<p class="hint">Sono mostrate le 1500 cose più recenti.</p>';
  h += '<a class="btn btn-sm" style="margin-top:14px" href="#/gia-fatto">' + ic('plus', 20) + ' Aggiungi una cosa fatta nei giorni passati</a>';
  return h + '</main>' + barra(o || sv ? '' : 'diario');
}

moduli.nota = async form => {
  const fd = new FormData(form);
  const t = String(fd.get('testo') || '').trim();
  if (!t) { errore('err-testo', 'Scrivi qualcosa.'); return; }
  const vecchia = form.dataset.id ? evento(form.dataset.id) : null;
  const data = dataValida(fd.get('data')) ? String(fd.get('data')) : oggi();
  const e = Object.assign({}, vecchia || { id: uid(), tipo: 'nota', chi: utente(), creato: adesso() }, {
    testo: t, ospiteId: String(fd.get('ospite') || '') || null, data, ora: oraValida(fd.get('ora')) ? String(fd.get('ora')) : null
  });
  // chi cambia una nota non cancella quello che c'era scritto: la versione di prima resta sotto
  if (vecchia && vecchia.testo !== t) {
    e.modificataDa = utente();
    e.versioni = (vecchia.versioni || []).concat([{ testo: vecchia.testo, da: vecchia.modificataDa || vecchia.chi || null, quando: adesso() }]);
  }
  await salva('eventi', e);
  avvisa(vecchia ? 'Nota aggiornata' : 'Nota salvata');
  indietro();
};
